<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget du foyer</title>
<meta name="theme-color" content="#1E4636">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-zUyW6tb8LgYlyScywIRol0wMd41/+c5gJLgzhnOPK64=' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' blob: data: https://login.microsoftonline.com https://login.live.com https://graph.microsoft.com https://*.1drv.com https://*.livefilestore.com https://*.sharepoint.com https://*.onedrive.com https://api.onedrive.com https://*.microsoftpersonalcontent.com; frame-src https://login.microsoftonline.com https://login.live.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" href="icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* Charte « Vert Empire » : encre sur papier, coins droits, filets, accent or bruni unique */
:root{
  --encre:#182A20; --vert-empire:#1E4636; --vert-profond:#0F2A1F;
  --sauge:#6F8678; --or-bruni:#9B7D34; --garnet:#6E2A2A;
  --ivoire:#F6F2E7; --papier:#FBF9F2; --filet-clair:#C9D2CB;
  --vert-pale:#E6ECE7; --garnet-pale:#F3E6E3; --or-pale:#F4EEDD;
  --serif:"EB Garamond","Garamond",Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;border-radius:0}
html{font-size:16px}
body{font-family:var(--serif); color:var(--encre); background:var(--papier); line-height:1.45; min-height:100vh}
[hidden]{display:none !important}
.num, td.num, th.num{font-variant-numeric:tabular-nums lining-nums; text-align:right; white-space:nowrap}
.neg{color:var(--garnet)} .pos{color:var(--vert-empire)} .discret{color:var(--sauge)}
small, .petit{font-size:.84rem}
a{color:var(--vert-empire)}

/* ---------- Cadre ---------- */
.appli{display:grid; grid-template-columns:232px minmax(0,1fr); min-height:100vh}
nav.laterale{background:var(--ivoire); border-right:1px solid var(--filet-clair); padding:1.1rem 0; position:sticky; top:0; height:100vh; overflow:auto}
.marque{padding:0 1.2rem .9rem; border-bottom:2px solid var(--vert-empire); margin:0 .8rem .8rem}
.marque .titre{font-size:1.25rem; font-weight:600; color:var(--vert-empire); font-variant-caps:small-caps; letter-spacing:.06em; line-height:1.15}
.marque .sous{font-size:.8rem; color:var(--sauge)}
nav.laterale a{display:flex; justify-content:space-between; align-items:center; padding:.42rem 1.2rem .42rem 1.6rem; color:var(--vert-profond); text-decoration:none; font-size:1rem; border-left:3px solid transparent; cursor:pointer}
nav.laterale a:hover{background:#fff}
nav.laterale a.actif{border-left-color:var(--or-bruni); background:#fff; color:var(--vert-empire); font-weight:600}
nav.laterale .rubrique{font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--sauge); padding:.9rem 1.6rem .25rem}
.pastille{background:var(--or-bruni); color:#fff; font-size:.72rem; font-weight:600; min-width:1.4rem; text-align:center; padding:.05rem .35rem; font-variant-numeric:tabular-nums}
.pastille.alerte{background:var(--garnet)}
nav.laterale .pied-nav{margin:1.2rem .8rem 0; padding:.7rem .8rem 0; border-top:1px solid var(--filet-clair); font-size:.8rem; color:var(--sauge)}
.point{display:inline-block; width:.55rem; height:.55rem; background:var(--vert-empire); margin-right:.35rem; vertical-align:middle}
.point.attente{background:var(--or-bruni)} .point.erreur{background:var(--garnet)}

main{padding:1.1rem 1.6rem 3rem; min-width:0}
.entete{display:flex; align-items:flex-end; justify-content:space-between; gap:1rem; flex-wrap:wrap; border-bottom:2px solid var(--vert-empire); padding-bottom:.5rem; margin-bottom:1rem}
.entete h1{font-size:1.5rem; font-weight:600; color:var(--vert-empire); font-variant-caps:small-caps; letter-spacing:.06em; line-height:1.1}
.entete .contexte{color:var(--sauge); font-size:.92rem}
.outils{display:flex; gap:.5rem; align-items:center; flex-wrap:wrap}
h2{font-size:1.05rem; font-weight:600; color:var(--vert-profond); font-variant-caps:small-caps; letter-spacing:.05em; margin-bottom:.45rem}
h3{font-size:.98rem; font-weight:600; color:var(--vert-profond); margin-bottom:.3rem}
section{margin-bottom:1.5rem}
.encadre{background:var(--ivoire); border:1px solid var(--vert-empire); padding:.9rem 1rem}
.carte{background:#fff; border:1px solid var(--filet-clair); border-top:2px solid var(--vert-empire); padding:.8rem .95rem}
.note{font-size:.88rem; color:var(--sauge); margin-top:.4rem}
.question{border-left:3px solid var(--or-bruni); background:var(--or-pale); padding:.5rem .8rem; font-size:.92rem; margin:.6rem 0}
.question strong{color:var(--or-bruni); font-variant-caps:small-caps; letter-spacing:.05em}
.vide{color:var(--sauge); font-style:italic; padding:.6rem 0}
p + p{margin-top:.5rem}

/* Boutons, champs */
button, .bouton{font-family:var(--serif); font-size:.92rem; cursor:pointer; background:#fff; color:var(--vert-empire); border:1px solid var(--vert-empire); padding:.36rem .8rem; text-decoration:none; display:inline-block; line-height:1.3}
button:hover{background:var(--ivoire)}
button:disabled{opacity:.45; cursor:default}
button.primaire{background:var(--or-bruni); border-color:var(--or-bruni); color:#fff; font-weight:600}
button.primaire:hover{background:#856a2b}
button.discret{border-color:var(--sauge); color:var(--sauge)}
button.danger{border-color:var(--garnet); color:var(--garnet)}
button.mini{padding:.12rem .5rem; font-size:.84rem}
button.lien{border:0; background:none; padding:0; color:var(--vert-empire); text-decoration:underline; font-size:inherit}
input[type=text], input[type=search], input[type=password], input[type=number], input[type=date], input[type=email], select, textarea{
  font-family:var(--serif); font-size:.95rem; color:var(--encre); background:#fff; border:1px solid var(--sauge); padding:.32rem .45rem; max-width:100%}
textarea{width:100%; min-height:4rem}
input:focus, select:focus, button:focus, textarea:focus, a:focus{outline:2px solid var(--or-bruni); outline-offset:1px}
input[readonly]{background:var(--ivoire); color:var(--sauge)}
label{display:block; font-size:.8rem; color:var(--vert-profond); letter-spacing:.03em; margin-bottom:.12rem}
.champ{margin-bottom:.6rem}
.champ input:not([type=checkbox]):not([type=radio]), .champ select, .champ textarea{width:100%}
.case{display:flex; align-items:center; gap:.4rem; font-size:.92rem}
.case input{width:auto}
.case label{margin:0; font-size:.92rem}
.grille-champs{display:grid; grid-template-columns:repeat(auto-fit,minmax(12rem,1fr)); gap:.2rem .9rem}
.segments{display:inline-flex; border:1px solid var(--vert-empire); flex-wrap:wrap}
.segments button{border:0; border-right:1px solid var(--vert-empire); padding:.3rem .75rem}
.segments button:last-child{border-right:0}
.segments button.choisi{background:var(--vert-empire); color:#fff}

/* Indicateurs */
.indicateurs{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.8rem; margin-bottom:1.3rem}
.indicateur{background:#fff; border:1px solid var(--filet-clair); border-top:2px solid var(--vert-empire); padding:.7rem .9rem .75rem}
.indicateur.alerte{border-top-color:var(--garnet); background:var(--garnet-pale)}
.indicateur.attention{border-top-color:var(--or-bruni); background:var(--or-pale)}
.indicateur .lib{font-size:.78rem; letter-spacing:.08em; text-transform:uppercase; color:var(--sauge)}
.indicateur .val{font-size:1.75rem; font-weight:600; color:var(--vert-empire); font-variant-numeric:tabular-nums lining-nums; line-height:1.15; margin:.15rem 0}
.indicateur.alerte .val{color:var(--garnet)}
.indicateur .det{font-size:.86rem; color:var(--vert-profond)}
button.indicateur{font:inherit; text-align:left; color:inherit; cursor:pointer; width:100%; border-radius:0}
button.indicateur:hover{background:var(--ivoire)}
button.indicateur:focus-visible{outline:2px solid var(--or-bruni); outline-offset:2px}
.indicateur.choisi{background:var(--ivoire); border-top-width:4px; padding-top:calc(.7rem - 2px)}
tr.sous-titre td{font-variant:small-caps; letter-spacing:.04em; color:var(--vert-empire); font-weight:600; padding-top:.7rem; border-bottom:1px solid var(--filet-clair)}
.barre-part{display:inline-block; width:7rem; height:.55rem; background:var(--filet-clair); vertical-align:middle}
.barre-part i{display:block; height:100%; background:var(--vert-empire)}
.jauge{height:6px; background:var(--vert-pale); margin-top:.45rem; position:relative}
.jauge span{position:absolute; left:0; top:0; bottom:0; background:var(--vert-empire)}
.jauge span.depasse{background:var(--garnet)}

/* Bandeaux */
.bandeau{padding:.55rem .9rem; margin-bottom:1rem; display:flex; gap:.8rem; align-items:center; justify-content:space-between; flex-wrap:wrap; font-size:.95rem}
.bandeau.alerte{background:var(--garnet); color:#fff}
.bandeau.alerte button{background:transparent; color:#fff; border-color:#fff}
.bandeau.info{background:var(--or-pale); border-left:3px solid var(--or-bruni)}
.bandeau.calme{background:var(--vert-pale); border-left:3px solid var(--vert-empire)}

/* Tableaux */
.tableau{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:.92rem}
th{text-align:left; font-weight:600; color:var(--vert-empire); border-top:2px solid var(--vert-empire); border-bottom:2px solid var(--vert-empire); padding:.38rem .5rem; font-variant-caps:small-caps; letter-spacing:.04em; white-space:nowrap; background:var(--papier)}
th.triable{cursor:pointer; user-select:none}
th.triable:hover{color:var(--or-bruni)}
th.triable.asc::after{content:" ▲"; color:var(--or-bruni); font-size:.8em}
th.triable.desc::after{content:" ▼"; color:var(--or-bruni); font-size:.8em}
td{border-bottom:1px solid var(--filet-clair); padding:.32rem .5rem; vertical-align:top}
tbody tr:last-child td{border-bottom:2px solid var(--vert-empire)}
tr.groupe td{background:var(--ivoire); font-weight:600; color:var(--vert-profond); font-variant-caps:small-caps; letter-spacing:.04em}
tr.total td{font-weight:600; border-top:1px solid var(--vert-empire); background:var(--ivoire)}
tr.choisie td{background:var(--or-pale)}
tr.cliquable{cursor:pointer}
tbody tr:hover td{background:#fff}
tr.choisie:hover td{background:var(--or-pale)}
td.retrait{padding-left:1.3rem}
.serre{font-size:.86rem}
.serre td, .serre th{padding:.3rem .35rem}
.libbanque{display:block; max-width:12rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:.74rem; color:var(--sauge); letter-spacing:.02em}
.marque-src{font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; padding:.02rem .3rem; border:1px solid var(--sauge); color:var(--sauge); white-space:nowrap}
.marque-src.regle{border-color:var(--vert-empire); color:var(--vert-empire)}
.marque-src.histo{border-color:var(--or-bruni); color:var(--or-bruni)}
.marque-src.aprec{border-color:var(--garnet); color:var(--garnet)}
.etiq{display:inline-block; font-size:.78rem; padding:.02rem .4rem; background:var(--vert-pale); color:var(--vert-profond); white-space:nowrap}
.etiq.l0{background:#E8E4D3} .etiq.l1{background:#E3E9EE} .etiq.l2{background:#EEE} .etiq.l3{background:#EDE3EC}
.barre-ecart{display:inline-block; width:90px; height:8px; background:var(--vert-pale); position:relative; vertical-align:middle}
.barre-ecart i{position:absolute; top:0; bottom:0; left:0; background:var(--vert-empire)}
.barre-ecart i.depasse{background:var(--garnet)}
.barre-ecart b{position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--encre); left:75%}
td.editable{cursor:text}
td.editable:hover{outline:1px dotted var(--sauge)}
td.choix{cursor:pointer}
td.choix:hover{background:var(--ivoire); outline:1px dotted var(--sauge)}

/* Grilles */
.deux{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:1rem}
.deux.bilan{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
.trois{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem}
.trois.rappro{grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr) minmax(0,1.1fr)}
.large-etroit{display:grid; grid-template-columns:minmax(0,1.7fr) minmax(0,1fr); gap:1rem}
.liste-traiter{list-style:none}
.liste-traiter li{display:flex; justify-content:space-between; align-items:center; gap:.6rem; padding:.45rem 0; border-bottom:1px solid var(--filet-clair)}
.liste-traiter li:last-child{border-bottom:0}
.compte-traiter{font-size:1.4rem; font-weight:600; color:var(--vert-empire); font-variant-numeric:tabular-nums; min-width:2.2rem; display:inline-block}

/* Rapprochement */
.ticket{background:#fff; border:1px solid var(--filet-clair); padding:.5rem; text-align:center}
.ticket img{max-width:100%; max-height:70vh}
.champ-ocr{display:grid; grid-template-columns:7.5rem minmax(0,1fr) auto; gap:.4rem; align-items:center; padding:.3rem 0; border-bottom:1px solid var(--filet-clair)}
.champ-ocr label{margin:0}
.champ-ocr input, .champ-ocr select{width:100%}
.confiance{font-size:.75rem; color:var(--sauge); white-space:nowrap}
.confiance.neg{color:var(--garnet)}
.candidat{border:1px solid var(--filet-clair); background:#fff; padding:.55rem .7rem; margin-bottom:.5rem; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.2rem .8rem; align-items:center}
.candidat.meilleur{border:1px solid var(--vert-empire); border-left:4px solid var(--or-bruni)}
.score{font-variant-numeric:tabular-nums; font-weight:600; color:var(--vert-empire)}
.suggestions{display:flex; gap:.35rem; flex-wrap:wrap; margin-top:.3rem}
.suggestions button{font-size:.82rem; border:1px dashed var(--sauge); padding:.05rem .45rem; color:var(--vert-profond); background:#fff}
.texte-brut{font-family:"Courier New",monospace; font-size:.75rem; white-space:pre-wrap; background:#fff; border:1px solid var(--filet-clair); padding:.4rem; max-height:14rem; overflow:auto}

/* Panneau de détail */
.avec-panneau{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:1rem; align-items:start}
.panneau{background:var(--ivoire); border:1px solid var(--vert-empire); padding:.9rem 1rem; position:sticky; top:1rem}
.panneau dl{display:grid; grid-template-columns:6.2rem minmax(0,1fr); gap:.3rem .6rem; font-size:.9rem}
.panneau dt{color:var(--sauge)}
.panneau dd{overflow-wrap:anywhere}
.panneau select{max-width:100%}
.panneau .segments button{padding:.3rem .5rem}
.panneau input[type=text]{width:100%}

/* Dépôt de fichiers */
.depot{border:1px dashed var(--vert-empire); background:var(--ivoire); text-align:center; padding:1.1rem; margin-bottom:1rem; cursor:pointer}
.depot.survol{background:var(--or-pale); border-color:var(--or-bruni)}

/* Graphiques */
svg text{font-family:var(--serif)}
.legende{display:flex; gap:1rem; flex-wrap:wrap; font-size:.84rem; color:var(--vert-profond); margin-top:.3rem}
.legende i{display:inline-block; width:.9rem; height:.55rem; margin-right:.3rem; vertical-align:middle}

/* Dialogue et messages */
.voile{position:fixed; inset:0; background:rgba(24,42,32,.45); z-index:50; overflow:auto; padding:6vh 1rem}
.dialogue{background:var(--papier); border:1px solid var(--vert-empire); border-top:3px solid var(--vert-empire); max-width:34rem; margin:0 auto; padding:1rem 1.2rem}
.dialogue.large{max-width:56rem}
.dialogue h2{font-size:1.15rem}
.dialogue .actions{display:flex; gap:.6rem; flex-wrap:wrap; margin-top:1rem; justify-content:flex-end}
.messages{position:fixed; right:1rem; bottom:1rem; z-index:60; display:flex; flex-direction:column; gap:.5rem; max-width:24rem}
.message{background:var(--vert-profond); color:#fff; padding:.55rem .8rem; font-size:.92rem; box-shadow:0 2px 6px rgba(0,0,0,.2)}
.message.alerte{background:var(--garnet)}

/* Écran d'ouverture */
.verrou{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem}
.verrou .boite-verrou{background:var(--ivoire); border:1px solid var(--vert-empire); border-top:3px solid var(--vert-empire); max-width:30rem; width:100%; padding:1.4rem 1.5rem}
.verrou .titre{font-size:1.5rem; font-weight:600; color:var(--vert-empire); font-variant-caps:small-caps; letter-spacing:.06em; border-bottom:2px solid var(--vert-empire); padding-bottom:.4rem; margin-bottom:.9rem}
.verrou input[type=password], .verrou input[type=text]{width:100%; font-size:1.05rem; padding:.5rem}
.choix-stockage button{display:block; width:100%; text-align:left; margin-bottom:.5rem; padding:.6rem .8rem}
.choix-stockage button small{display:block; color:var(--sauge)}

/* ---------- Saisie mobile ---------- */
.saisie{max-width:30rem; margin:0 auto; min-height:100vh; background:var(--papier)}
.saisie .barre-tel{background:var(--vert-empire); color:#fff; padding:.7rem 1rem; font-variant-caps:small-caps; letter-spacing:.06em; display:flex; justify-content:space-between; align-items:center; font-size:1.05rem; position:sticky; top:0; z-index:5; padding-top:calc(.7rem + env(safe-area-inset-top))}
.saisie .barre-tel button{background:transparent; color:#fff; border-color:rgba(255,255,255,.6); font-size:.85rem}
.saisie .corps-tel{padding:1rem}
.saisie .gros{width:100%; padding:.95rem; font-size:1.12rem; margin-bottom:.6rem; min-height:48px}
.saisie input[type=text], .saisie select, .saisie input[type=date]{width:100%; font-size:1.1rem; padding:.55rem .6rem; min-height:46px}
.saisie .montant{font-size:2rem; font-weight:600; text-align:right; font-variant-numeric:tabular-nums; color:var(--vert-empire)}
.puces{display:flex; flex-wrap:wrap; gap:.4rem; margin:.2rem 0 .8rem}
.puces button{min-height:42px; padding:.4rem .7rem; font-size:1rem}
.puces button.choisi{background:var(--vert-empire); color:#fff}
.saisie .legende-tel{font-size:.82rem; color:var(--sauge); margin-bottom:.7rem}
.saisie .bloc{margin-bottom:.8rem}
.propose{font-size:.75rem; color:var(--or-bruni); letter-spacing:.06em; text-transform:uppercase; margin-left:.3rem}
.recentes{list-style:none}
.recentes li{display:flex; justify-content:space-between; padding:.5rem 0; border-bottom:1px solid var(--filet-clair); font-size:.95rem}
.apercu-photo{max-width:100%; max-height:40vh; display:block; margin:0 auto .6rem; border:1px solid var(--filet-clair)}
.progression{height:6px; background:var(--vert-pale); margin:.4rem 0}
.progression span{display:block; height:100%; background:var(--or-bruni); width:0}

nav.basse{display:none}

@media (max-width:980px){
  .indicateurs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .deux,.deux.bilan,.trois,.trois.rappro,.large-etroit,.avec-panneau{grid-template-columns:minmax(0,1fr)}
  .panneau{position:static}
}
@media (max-width:760px){
  .appli{grid-template-columns:minmax(0,1fr)}
  nav.laterale{display:none}
  main{padding:.9rem 1rem 5rem}
  .entete h1{font-size:1.3rem}
  nav.basse:not([hidden]){display:grid; grid-template-columns:repeat(5,1fr); position:fixed; bottom:0; left:0; right:0; background:var(--ivoire); border-top:2px solid var(--vert-empire); z-index:30; padding-bottom:env(safe-area-inset-bottom)}
  nav.basse a{text-align:center; padding:.45rem 0 .5rem; font-size:.8rem; color:var(--vert-profond); text-decoration:none; min-height:52px; cursor:pointer}
  nav.basse a b{display:block; font-size:1.15rem; line-height:1.1; font-weight:400}
  nav.basse a.actif{color:var(--or-bruni); font-weight:600}
  .indicateur .val{font-size:1.4rem}
  .champ-ocr{grid-template-columns:minmax(0,1fr)}
  .messages{left:1rem; bottom:4.5rem}
}
#impression{display:none}
@page paysage{size:A4 landscape; margin:12mm}
@media print{
  @page{size:A4; margin:14mm 13mm}
  body:has(#impression > *) > *:not(#impression){display:none !important}
  body:has(#impression > *){background:#fff}
  #impression{display:block; font-size:9.5pt; color:#1d1d1b; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  #impression *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  /* Imprimante noir et blanc : couleurs ramenées au noir, fonds en gris clair, négatifs en gras */
  #impression{--vert-empire:#000; --garnet:#000; --or-bruni:#000; --sauge:#000; --ivoire:#ececec}
  #impression .neg{font-weight:700}
  #impression .imp-tete{border-bottom:2px solid var(--vert-empire); padding-bottom:3mm; margin-bottom:4mm}
  #impression .imp-foyer{font-variant:small-caps; letter-spacing:.08em; color:var(--or-bruni); font-size:9pt}
  #impression h1{font-size:18pt; color:var(--vert-empire); margin:1mm 0; font-weight:600}
  #impression .imp-soustitre{color:#000; font-size:9pt}
  #impression td, #impression th{font-size:9.5pt}
  #impression .imp-sous td{font-size:9pt}
  #impression .imp-lieux-titre{font-size:8pt; text-transform:uppercase; letter-spacing:.06em; color:#000; margin:3mm 0 1mm}

    if (dv.getUint32(pos, true) !== 0x02014b50) break;
    const methode = dv.getUint16(pos + 10, true), tailleComp = dv.getUint32(pos + 20, true);
    const tailleNom = dv.getUint16(pos + 28, true), tailleExtra = dv.getUint16(pos + 30, true), tailleComm = dv.getUint16(pos + 32, true);
    const decalage = dv.getUint32(pos + 42, true);
    entrees[dec.decode(donnees.subarray(pos + 46, pos + 46 + tailleNom))] = {methode, tailleComp, decalage};
    pos += 46 + tailleNom + tailleExtra + tailleComm;
  }
  return {donnees, dv, entrees};
}
async function lireDuZip(zip, nom){
  const e = zip.entrees[nom]; if (!e) return null;
  const tailleNom = zip.dv.getUint16(e.decalage + 26, true), tailleExtra = zip.dv.getUint16(e.decalage + 28, true);
  const debut = e.decalage + 30 + tailleNom + tailleExtra;
  const brut = zip.donnees.subarray(debut, debut + e.tailleComp);
  if (e.methode === 0) return new TextDecoder("utf-8").decode(brut);
  if (e.methode === 8){
    const flux = new Blob([brut]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return await new Response(flux).text();
  }
  throw new Error("compression " + e.methode + " non gérée");
}
function colonneVersIndex(lettres){ let n = 0; for (const c of lettres) n = n * 26 + (c.charCodeAt(0) - 64); return n - 1; }
function indexVersColonne(i){ let s = ""; i++; while (i > 0){ const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = (i - 1 - r) / 26; } return s; }
const enfantsNommes = (el, nom) => Array.from(el.getElementsByTagName("*")).filter(x => x.localName === nom);

/* Renvoie {noms: [...], feuilles: {nom: [[valeurs]]}} ; nombres en nombres, textes en textes. */
async function lireClasseur(buffer){
  const zip = extraireZip(buffer);
  const partage = [];
  const xmlPartage = await lireDuZip(zip, "xl/sharedStrings.xml");
  if (xmlPartage){
    const doc = new DOMParser().parseFromString(xmlPartage, "text/xml");
    for (const si of enfantsNommes(doc, "si")) partage.push(enfantsNommes(si, "t").map(t => t.textContent).join(""));
  }
  const docClasseur = new DOMParser().parseFromString(await lireDuZip(zip, "xl/workbook.xml") || "<a/>", "text/xml");
  const rels = new DOMParser().parseFromString(await lireDuZip(zip, "xl/_rels/workbook.xml.rels") || "<a/>", "text/xml");
  const cibles = {};
  for (const r of enfantsNommes(rels, "Relationship")) cibles[r.getAttribute("Id")] = r.getAttribute("Target");
  const noms = [], feuilles = {};
  for (const f of enfantsNommes(docClasseur, "sheet")){
    const nom = f.getAttribute("name");
    const rid = f.getAttribute("r:id") || f.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
    let cible = cibles[rid] || ""; cible = cible.replace(/^\/?xl\//, "");
    const xml = await lireDuZip(zip, "xl/" + cible);
    if (!xml) continue;
    const doc = new DOMParser().parseFromString(xml, "text/xml");
    const matrice = [];
    for (const row of enfantsNommes(doc, "row")){
      const iLigne = parseInt(row.getAttribute("r"), 10) - 1;
      const ligne = [];
      for (const c of Array.from(row.children).filter(x => x.localName === "c")){
        const ref = (c.getAttribute("r") || "").replace(/\d+/g, "");
        const type = c.getAttribute("t") || "";
        let valeur = null;
        if (type === "inlineStr") valeur = enfantsNommes(c, "t").map(t => t.textContent).join("");
        else {
          const v = Array.from(c.children).find(x => x.localName === "v");
          if (v){
            const brut = v.textContent;
            if (type === "s") valeur = partage[parseInt(brut, 10)] ?? "";
            else if (type === "str" || type === "e") valeur = brut;
            else if (type === "b") valeur = brut === "1";
            else valeur = brut === "" ? null : Number(brut);
          }
        }
        ligne[ref ? colonneVersIndex(ref) : ligne.length] = valeur;
      }
      matrice[isNaN(iLigne) ? matrice.length : iLigne] = ligne;
    }
    for (let i = 0; i < matrice.length; i++) if (!matrice[i]) matrice[i] = [];
    noms.push(nom); feuilles[nom] = matrice;
  }
  return {noms, feuilles};
}

/* Écriture. feuilles = [{nom, colonnes: [{titre, largeur, type: "texte"|"euros"|"date"|"nombre"|"pourcent"}], lignes: [[...]]}] */
function ecrireClasseur(feuilles){
  const x = v => String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const STYLES = {texte: 0, entete: 1, euros: 2, date: 3, nombre: 4, pourcent: 5};
  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="2"><numFmt numFmtId="164" formatCode="#,##0.00\\ &quot;€&quot;;[Red]\\-#,##0.00\\ &quot;€&quot;"/><numFmt numFmtId="165" formatCode="dd/mm/yyyy"/></numFmts>
<fonts count="2"><font><sz val="11"/><name val="Garamond"/></font><font><b/><sz val="11"/><color rgb="FF1E4636"/><name val="Garamond"/></font></fonts>
<fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFF6F2E7"/></patternFill></fill></fills>
<borders count="2"><border/><border><bottom style="medium"><color rgb="FF1E4636"/></bottom></border></borders>
<cellStyleXfs count="1"><xf/></cellStyleXfs>
<cellXfs count="6"><xf/><xf fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1"/><xf numFmtId="164" applyNumberFormat="1"/><xf numFmtId="165" applyNumberFormat="1"/><xf numFmtId="4" applyNumberFormat="1"/><xf numFmtId="10" applyNumberFormat="1"/></cellXfs>
</styleSheet>`;
  const entrees = [];
  const feuillesXml = feuilles.map((f, i) => {
    const cols = f.colonnes.map((c, j) => `<col min="${j + 1}" max="${j + 1}" width="${c.largeur || 14}" customWidth="1"/>`).join("");
    const ligneXml = (valeurs, r, entete) => `<row r="${r}">` + valeurs.map((v, j) => {
      const ref = indexVersColonne(j) + r;
      if (entete) return `<c r="${ref}" t="inlineStr" s="1"><is><t>${x(v)}</t></is></c>`;
      if (v === null || v === undefined || v === "") return "";
      const t = f.colonnes[j]?.type || "texte";
      if (t === "date" && typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v)){
        const n = (Date.UTC(+v.slice(0, 4), +v.slice(5, 7) - 1, +v.slice(8, 10)) / 86400000) + 25569;
        return `<c r="${ref}" s="3"><v>${n}</v></c>`;
      }
      if (typeof v === "number" && isFinite(v)) return `<c r="${ref}" s="${STYLES[t] ?? 4}"><v>${v}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${x(v)}</t></is></c>`;
    }).join("") + `</row>`;
    const lignes = [ligneXml(f.colonnes.map(c => c.titre), 1, true)].concat(f.lignes.map((l, k) => ligneXml(l, k + 2, false))).join("");
    entrees.push({nom: `xl/worksheets/sheet${i + 1}.xml`, contenu: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols}</cols><sheetData>${lignes}</sheetData><autoFilter ref="A1:${indexVersColonne(Math.max(0, f.colonnes.length - 1))}${f.lignes.length + 1}"/></worksheet>`});
    return `<sheet name="${x(f.nom.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`;
  });
  entrees.unshift(
    {nom: "[Content_Types].xml", contenu: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${feuilles.map((f, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>`},
    {nom: "_rels/.rels", contenu: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {nom: "xl/workbook.xml", contenu: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${feuillesXml.join("")}</sheets></workbook>`},
    {nom: "xl/_rels/workbook.xml.rels", contenu: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${feuilles.map((f, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}<Relationship Id="rId${feuilles.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
    {nom: "xl/styles.xml", contenu: styles}
  );
  return zipSansCompression(entrees);
}

/* ===== 03-modele.js ===== */
/* ================= Modèle du livre de comptes =================
   Le livre est un objet JSON unique, chiffré dans « budget.chiffre ». Chaque
   enregistrement porte « maj » (horodatage) et « app » (appareil) : la fusion
   entre appareils garde, enregistrement par enregistrement, le plus récent.
   Une suppression laisse une pierre tombale (supprime: true). */

const COLLECTIONS = ["comptes", "operations", "commercants", "regles", "budgets", "echeances",
  "valorisations", "justificatifs", "factures", "soldes", "imports", "documents"];

const TYPES_COMPTE = {

  pea: "PEA", titres: "Compte-titres", immobilier: "Bien immobilier", dette: "Dette", especes: "Espèces", autre: "Autre"
};
/* Ordre et regroupement au bilan */
const RUBRIQUES_BILAN = [

const NATURES_DEFAUT = ["Courante", "Ponctuelle", "Exceptionnelle", "Hors budget", "Revenu"];

const CATEGORIES_DEFAUT = {

function livreVide(nomFoyer){
  const l = {format: "budget-foyer", version: 1, cree: new Date().toISOString(), maj: Date.now(),
    parametres: {
      maj: Date.now(), nomFoyer: nomFoyer || "Budget du foyer",
      lieux: ["Autres"], natures: NATURES_DEFAUT.slice(), categories: JSON.parse(JSON.stringify(CATEGORIES_DEFAUT)),
      compteTresorerie: "", seuilBas: 0, seuilHaut: 150000,
      tolTicketAvant: 2, tolTicketApres: 5, tolFactureAvant: 30, tolFactureApres: 60, delaiSansOperation: 10,
      verrouMinutes: 15, amexJourPrelevement: 27
    },
    cles: {}};
  for (const c of COLLECTIONS) l[c] = {};
  return l;
}

/* ---------- Appareil courant ---------- */
function appareil(){
  let a = null;
  try { a = localStorage.getItem("bf_appareil"); } catch (e) {}
  if (!a){ a = "app-" + idAleatoire(6); try { localStorage.setItem("bf_appareil", a); } catch (e) {} }
  return a;
}
function nomAppareil(){ try { return localStorage.getItem("bf_nom_appareil") || ""; } catch (e) { return ""; } }

/* ---------- Accès et écriture ---------- */
let LIVRE = null;            // livre déchiffré en mémoire
let LIVRE_MODIFIE = false;   // à enregistrer
const vivants = coll => Object.values(LIVRE[coll] || {}).filter(x => !x.supprime);
const obtenir = (coll, id) => { const x = LIVRE[coll]?.[id]; return x && !x.supprime ? x : null; };
let horlogeLocale = 0;
function horodatage(){ horlogeLocale = Math.max(Date.now(), horlogeLocale + 1); return horlogeLocale; }
function enregistrer(coll, objet){
  if (!objet.id) objet.id = coll.slice(0, 3) + "-" + idAleatoire(10);
  objet.maj = horodatage(); objet.app = appareil();
  LIVRE[coll][objet.id] = objet;
  marquerModifie();
  return objet;
}
function supprimer(coll, id){
  if (!LIVRE[coll][id]) return;
  LIVRE[coll][id] = {id, supprime: true, maj: horodatage(), app: appareil()};
  marquerModifie();
}
function modifierParametres(changements){
  Object.assign(LIVRE.parametres, changements, {maj: horodatage()});
  marquerModifie();
}
function marquerModifie(){ LIVRE_MODIFIE = true; LIVRE.maj = Date.now(); planifierSauvegarde(); }

/* ---------- Fusion de deux versions du livre ---------- */
function plusRecent(a, b){
  if (!a) return b; if (!b) return a;
  if ((a.maj || 0) !== (b.maj || 0)) return (a.maj || 0) > (b.maj || 0) ? a : b;
  return String(a.app || "") >= String(b.app || "") ? a : b;
}
function fusionnerLivres(local, distant){
  if (!local) return {livre: distant, changements: 0};
  if (!distant) return {livre: local, changements: 0};
  const r = JSON.parse(JSON.stringify(local));
  let changements = 0;
  for (const c of COLLECTIONS){
    r[c] = r[c] || {};
    for (const [id, x] of Object.entries(distant[c] || {})){
      const garde = plusRecent(r[c][id], x);
      if (garde !== r[c][id]){ r[c][id] = garde; changements++; }
    }
  }
  if ((distant.parametres?.maj || 0) > (r.parametres?.maj || 0)){ r.parametres = distant.parametres; changements++; }
  // Les clés du foyer sont créées une fois pour toutes ; on complète sans écraser.
  r.cles = Object.assign({}, distant.cles || {}, r.cles || {});
  r.maj = Math.max(local.maj || 0, distant.maj || 0);
  return {livre: r, changements};
}

/* ---------- Libellés et catégories ---------- */
function libelleCompte(id){ const c = obtenir("comptes", id); return c ? c.nom : "—"; }
function comptesDeType(...types){ return vivants("comptes").filter(c => types.includes(c.type) && c.actif !== false); }
function categorieComplete(op){ return op.categorie ? op.categorie + (op.sousCategorie ? " › " + op.sousCategorie : "") : "À préciser"; }
function listeCategories(){
  const r = [];
  for (const [cat, sous] of Object.entries(LIVRE.parametres.categories)) for (const s of sous) r.push([cat, s]);
  return r;
}
function ajouterCategorie(cat, sous){
  if (!cat) return;
  const cats = LIVRE.parametres.categories;
  if (!cats[cat]) cats[cat] = [];
  if (sous && !cats[cat].includes(sous)) cats[cat].push(sous);
  modifierParametres({categories: cats});
}
function ajouterLieu(lieu){
  if (lieu && !LIVRE.parametres.lieux.includes(lieu)) modifierParametres({lieux: [...LIVRE.parametres.lieux, lieu]});
}
function classeLieu(lieu){ const i = LIVRE.parametres.lieux.indexOf(lieu); return "etiq l" + (i < 0 ? 2 : i % 4); }
/* Une opération compte-t-elle dans le budget et le résultat ? */
function horsResultat(op){ return !op.nature || NATURES_HORS_RESULTAT.includes(op.nature) || op.categorie === "Transfert"; }
/* Parts d'une opération : ses ventilations si elle en a, sinon elle-même. */
function partsDe(op){
  if (op.ventilation && op.ventilation.length) return op.ventilation.map(v => Object.assign({}, op, v, {montant: v.montant, partDe: op.id}));
  return [op];
}

/* ===== 04-crypto.js ===== */
/* ================= Chiffrement =================
   Livre : une clé de données AES-256-GCM aléatoire chiffre le livre ; elle est
   enveloppée par une clé dérivée du mot de passe (PBKDF2-SHA-256, 600 000 itérations).
   Boîte de saisie : chiffrement hybride vers la clé publique ECDH P-256 du foyer
   (clé éphémère, ECDH, HKDF-SHA-256, AES-GCM). Le téléphone n'a que la clé publique :
   il peut déposer, jamais relire.
   Rien ne quitte l'appareil en clair ; le mot de passe n'est jamais stocké. */

const ITERATIONS_PBKDF2 = 600000;
const enc = new TextEncoder(), dec = new TextDecoder();

async function deriverCleMotDePasse(motDePasse, sel, iterations){
  const matiere = await crypto.subtle.importKey("raw", enc.encode(motDePasse.normalize("NFC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt: sel, iterations: iterations || ITERATIONS_PBKDF2, hash: "SHA-256"},
    matiere, {name: "AES-GCM", length: 256}, false, ["wrapKey", "unwrapKey"]);
}
async function nouvelleCleDonnees(){
  return crypto.subtle.generateKey({name: "AES-GCM", length: 256}, true, ["encrypt", "decrypt"]);
}
async function aesChiffrer(cle, octets){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const c = await crypto.subtle.encrypt({name: "AES-GCM", iv}, cle, octets);
  return {iv: versB64(iv), donnees: versB64(c)};
}
async function aesDechiffrer(cle, paquet){
  return new Uint8Array(await crypto.subtle.decrypt({name: "AES-GCM", iv: depuisB64(paquet.iv)}, cle, depuisB64(paquet.donnees)));
}

/* En-tête du livre : sel, itérations et clé de données enveloppée. */
async function creerEnveloppe(motDePasse, cleDonnees){
  const sel = crypto.getRandomValues(new Uint8Array(16));
  const cleMdp = await deriverCleMotDePasse(motDePasse, sel, ITERATIONS_PBKDF2);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enveloppee = await crypto.subtle.wrapKey("raw", cleDonnees, cleMdp, {name: "AES-GCM", iv});
  return {kdf: "PBKDF2-SHA256", iterations: ITERATIONS_PBKDF2, sel: versB64(sel), iv: versB64(iv), cle: versB64(enveloppee)};
}
/* Ouvre l'enveloppe ; « extractible » faux par défaut (la clé ne peut plus être exportée). */
async function ouvrirEnveloppe(motDePasse, env, extractible){
  const cleMdp = await deriverCleMotDePasse(motDePasse, depuisB64(env.sel), env.iterations);
  try {
    return await crypto.subtle.unwrapKey("raw", depuisB64(env.cle), cleMdp, {name: "AES-GCM", iv: depuisB64(env.iv)},
      {name: "AES-GCM", length: 256}, !!extractible, ["encrypt", "decrypt"]);
  } catch (e){ throw new Error("Mot de passe incorrect."); }
}

/* Fichier « budget.chiffre » : JSON {format, v, enveloppe, iv, donnees} ; contenu = gzip(JSON du livre). */
async function chiffrerLivre(livre, cleDonnees, enveloppe){
  const clair = await compresser(enc.encode(JSON.stringify(livre)));
  const p = await aesChiffrer(cleDonnees, clair);
  return enc.encode(JSON.stringify({format: "budget-foyer", v: 1, enveloppe, iv: p.iv, donnees: p.donnees}));
}
function lireEnTete(octets){
  const o = JSON.parse(dec.decode(octets));
  if (o.format !== "budget-foyer") throw new Error("Ce fichier n'est pas un livre « Budget du foyer ».");
  return o;
}
async function dechiffrerLivre(octets, cleDonnees){
  const o = lireEnTete(octets);
  let clair;
  try { clair = await aesDechiffrer(cleDonnees, o); }
  catch (e){ throw new Error("Clé incorrecte pour ce livre (mot de passe changé sur un autre appareil ?)."); }
  return JSON.parse(dec.decode(await decompresser(clair)));
}

/* Objets génériques chiffrés avec la clé de données (justificatifs, sauvegardes). */
async function chiffrerObjet(objet, cle){
  const p = await aesChiffrer(cle, await compresser(enc.encode(JSON.stringify(objet))));
  return enc.encode(JSON.stringify({format: "budget-foyer-objet", v: 1, iv: p.iv, donnees: p.donnees}));
}
async function dechiffrerObjet(octets, cle){
  const o = JSON.parse(dec.decode(octets));
  return JSON.parse(dec.decode(await decompresser(await aesDechiffrer(cle, o))));
}

/* ---------- Boîte de saisie (écriture seule) ---------- */
async function nouvellePaireBoite(){
  const p = await crypto.subtle.generateKey({name: "ECDH", namedCurve: "P-256"}, true, ["deriveBits"]);
  return {publique: await crypto.subtle.exportKey("jwk", p.publicKey), privee: await crypto.subtle.exportKey("jwk", p.privateKey)};
}
async function cleHybride(privee, publique, sel, usage){
  const bits = await crypto.subtle.deriveBits({name: "ECDH", public: publique}, privee, 256);
  const hk = await crypto.subtle.importKey("raw", bits, "HKDF", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "HKDF", hash: "SHA-256", salt: sel, info: enc.encode("budget-foyer|boite|v1")},
    hk, {name: "AES-GCM", length: 256}, false, [usage]);
}
async function chiffrerPourBoite(objet, jwkPublique){
  const pub = await crypto.subtle.importKey("jwk", jwkPublique, {name: "ECDH", namedCurve: "P-256"}, false, []);
  const eph = await crypto.subtle.generateKey({name: "ECDH", namedCurve: "P-256"}, true, ["deriveBits"]);
  const sel = crypto.getRandomValues(new Uint8Array(16));
  const cle = await cleHybride(eph.privateKey, pub, sel, "encrypt");
  const p = await aesChiffrer(cle, await compresser(enc.encode(JSON.stringify(objet))));
  const epk = await crypto.subtle.exportKey("jwk", eph.publicKey);
  return enc.encode(JSON.stringify({format: "budget-foyer-saisie", v: 1, epk: {kty: epk.kty, crv: epk.crv, x: epk.x, y: epk.y}, sel: versB64(sel), iv: p.iv, donnees: p.donnees}));
}
async function dechiffrerBoite(octets, jwkPrivee){
  const o = JSON.parse(dec.decode(octets));
  if (o.format !== "budget-foyer-saisie") throw new Error("format de saisie inconnu");
  const priv = await crypto.subtle.importKey("jwk", jwkPrivee, {name: "ECDH", namedCurve: "P-256"}, false, ["deriveBits"]);
  const epk = await crypto.subtle.importKey("jwk", o.epk, {name: "ECDH", namedCurve: "P-256"}, false, []);
  const cle = await cleHybride(priv, epk, depuisB64(o.sel), "decrypt");
  return JSON.parse(dec.decode(await decompresser(await aesDechiffrer(cle, o))));
}

/* ---------- Extrait des commerçants pour le téléphone (clé symétrique dédiée) ---------- */
async function cleExtrait(b64){ return crypto.subtle.importKey("raw", depuisB64(b64), {name: "AES-GCM"}, false, ["encrypt", "decrypt"]); }

/* Robustesse d'un mot de passe : estimation simple, sans dictionnaire. */
function forceMotDePasse(m){
  if (!m) return {note: 0, texte: ""};
  let classes = 0; for (const re of [/[a-z]/, /[A-Z]/, /\d/, /[^A-Za-z0-9]/]) if (re.test(m)) classes++;
  const bits = m.length * Math.log2([0, 26, 52, 62, 94][classes] || 26);
  if (m.length < 10) return {note: 1, texte: "trop court (10 caractères au moins)"};
  if (bits < 55) return {note: 2, texte: "moyen : une phrase de quatre ou cinq mots serait plus sûre"};
  return {note: 3, texte: "solide"};
}

/* ===== 05-stockage.js ===== */
/* ================= Stockage =================
   1. Cache local chiffré (IndexedDB) : travail hors ligne, ouverture rapide.
   2. Dossier partagé, par l'une de trois voies (un « adaptateur ») :
      - « dossier » : le dossier OneDrive synchronisé du PC (API File System Access, Chrome et Edge) ;
      - « graph »   : OneDrive en ligne via Microsoft Graph (téléphones, ou PC sans client OneDrive) ;
      - « local »   : ce navigateur seulement (essai, ou appareil isolé).
   Contrat d'un adaptateur :
     lire(chemin) → {octets, etiquette} | null
     ecrire(chemin, octets, etiquetteAttendue?) → nouvelle étiquette ; lève ConflitEcriture si le fichier a changé
     lister(dossier) → [{nom, chemin, etiquette}]
     deplacer(chemin, dossierCible)
   Les chemins sont relatifs au dossier de l'application (« budget.chiffre », « boite/xxx.chiffre »). */

class ConflitEcriture extends Error { constructor(){ super("Le fichier a été modifié sur un autre appareil."); this.conflit = true; } }

/* ---------- IndexedDB minimal ---------- */
const BASE_IDB = "budget-foyer";
function ouvrirBase(){
  return new Promise((ok, ko) => {
    const r = indexedDB.open(BASE_IDB, 1);
    r.onupgradeneeded = () => { const db = r.result; for (const s of ["cles", "fichiers", "reglages", "file"]) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s); };
    r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
  });
}
async function idb(magasin, mode, action){
  const db = await ouvrirBase();
  return new Promise((ok, ko) => {
    const t = db.transaction(magasin, mode); const m = t.objectStore(magasin);
    const req = action(m);
    t.oncomplete = () => { db.close(); ok(req ? req.result : undefined); };
    t.onerror = () => { db.close(); ko(t.error); };
  });
}
const idbLire = (m, k) => idb(m, "readonly", s => s.get(k));
const idbEcrire = (m, k, v) => idb(m, "readwrite", s => s.put(v, k));
const idbSuppr = (m, k) => idb(m, "readwrite", s => s.delete(k));
const idbCles = m => idb(m, "readonly", s => s.getAllKeys());

/* Réglages propres à l'appareil (jamais partagés) */
async function reglage(cle, defaut){ try { const v = await idbLire("reglages", cle); return v === undefined ? defaut : v; } catch (e) { return defaut; } }
async function definirReglage(cle, v){ try { await idbEcrire("reglages", cle, v); } catch (e) {} }

/* ---------- Adaptateur « local » (ce navigateur) ---------- */
const adaptateurLocal = {
  nom: "local", libelle: "Ce navigateur seulement",
  async lire(chemin){ const v = await idbLire("fichiers", chemin); return v ? {octets: v.octets, etiquette: v.etiquette} : null; },
  async ecrire(chemin, octets, attendue){
    const v = await idbLire("fichiers", chemin);
    if (attendue !== undefined && attendue !== null && v && v.etiquette !== attendue) throw new ConflitEcriture();
    const etiquette = "l" + horodatage();
    await idbEcrire("fichiers", chemin, {octets, etiquette});
    return etiquette;
  },
  async lister(dossier){
    const cles = await idbCles("fichiers");
    return cles.filter(k => k.startsWith(dossier + "/") && !k.slice(dossier.length + 1).includes("/")).map(k => ({nom: k.slice(dossier.length + 1), chemin: k}));
  },
  async deplacer(chemin, dossier){
    const v = await idbLire("fichiers", chemin); if (!v) return;
    await idbEcrire("fichiers", dossier + "/" + chemin.split("/").pop(), v); await idbSuppr("fichiers", chemin);
  },
  async pret(){ return true; }
};

/* ---------- Adaptateur « dossier » (dossier OneDrive synchronisé du PC) ---------- */
const adaptateurDossier = {
  nom: "dossier", libelle: "Dossier OneDrive de ce PC", racine: null,
  disponible: () => "showDirectoryPicker" in window,
  async choisir(){
    this.racine = await window.showDirectoryPicker({id: "budget-foyer", mode: "readwrite", startIn: "documents"});
    await definirReglage("dossier_racine", this.racine);
    return this.racine.name;
  },
  async pret(interactif){
    if (!this.racine) this.racine = await reglage("dossier_racine", null);
    if (!this.racine) return false;
    let p = await this.racine.queryPermission({mode: "readwrite"});
    if (p !== "granted" && interactif) p = await this.racine.requestPermission({mode: "readwrite"});
    return p === "granted";
  },
  async poignee(chemin, creer){
    const parts = chemin.split("/"); let d = this.racine;
    for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p, {create: !!creer});
    return d.getFileHandle(parts[parts.length - 1], {create: !!creer});
  },
  async lire(chemin){
    try {
      const f = await (await this.poignee(chemin, false)).getFile();
      return {octets: new Uint8Array(await f.arrayBuffer()), etiquette: f.lastModified + ":" + f.size};
    } catch (e){ if (e.name === "NotFoundError" || e.name === "TypeMismatchError") return null; throw e; }
  },
  async ecrire(chemin, octets, attendue){
    if (attendue){
      const actuel = await this.lire(chemin);
      if (actuel && actuel.etiquette !== attendue) throw new ConflitEcriture();
    }
    const fh = await this.poignee(chemin, true);
    const w = await fh.createWritable(); await w.write(octets); await w.close();
    const f = await fh.getFile();
    return f.lastModified + ":" + f.size;
  },
  async lister(dossier){
    const r = [];
    try {
      let d = this.racine; for (const p of dossier.split("/").filter(Boolean)) d = await d.getDirectoryHandle(p, {create: false});
      for await (const [nom, poignee] of d.entries()) if (poignee.kind === "file") r.push({nom, chemin: (dossier ? dossier + "/" : "") + nom});
    } catch (e){ if (e.name !== "NotFoundError") throw e; }
    return r;
  },
  async deplacer(chemin, dossierCible){
    const src = await this.lire(chemin); if (!src) return;
    const nom = chemin.split("/").pop();
    await this.ecrire(dossierCible + "/" + nom, src.octets);
    const parts = chemin.split("/"); let d = this.racine;
    for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p);
    await d.removeEntry(parts[parts.length - 1]);
  }
};

/* ---------- Adaptateur « graph » (OneDrive en ligne, Microsoft Graph) ----------
   Autorisation demandée : Files.ReadWrite.AppFolder, soit le seul dossier
   « Applications/<nom de l'application> » du OneDrive. Comptes personnels (consumers). */
const PORTEES_GRAPH = ["Files.ReadWrite.AppFolder"];
const GRAPH = "https://graph.microsoft.com/v1.0/me/drive/special/approot";
const adaptateurGraph = {
  nom: "graph", libelle: "OneDrive en ligne", msal: null, compte: null, clientId: "",
  async initialiser(clientId){
    if (!window.msal) await chargerScript("vendor/msal-browser.min.js");
    if (!window.msal) throw new Error("Module de connexion Microsoft non chargé.");
    if (this.msal && this.clientId === clientId) return;
    this.clientId = clientId;
    this.msal = new msal.PublicClientApplication({
      auth: {clientId, authority: "https://login.microsoftonline.com/consumers", redirectUri: location.origin + location.pathname.replace(/index\.html$/, ""), navigateToLoginRequestUrl: false},
      cache: {cacheLocation: "localStorage"}
    });
    await this.msal.initialize();
    const r = await this.msal.handleRedirectPromise();
    if (r && r.account) this.compte = r.account;
    if (!this.compte) this.compte = this.msal.getAllAccounts()[0] || null;
  },
  connecte(){ return !!this.compte; },
  async connecter(){ await this.msal.loginRedirect(this.compte ? {scopes: PORTEES_GRAPH, loginHint: this.compte.username} : {scopes: PORTEES_GRAPH, prompt: "select_account"}); },
  async deconnecter(){ if (this.compte) await this.msal.logoutRedirect({account: this.compte}); },
  async jeton(){
    if (!this.compte) throw new Error("Pas de connexion à OneDrive.");
    try { return (await this.msal.acquireTokenSilent({scopes: PORTEES_GRAPH, account: this.compte})).accessToken; }
    catch (e){ await this.msal.acquireTokenRedirect({scopes: PORTEES_GRAPH, account: this.compte}); throw new Error("Reconnexion à OneDrive…"); }
  },
  async requete(url, options){
    const jeton = await this.jeton();
    const o = Object.assign({}, options); o.headers = Object.assign({Authorization: "Bearer " + jeton}, o.headers || {});
    const r = await fetch(url, o);
    if (r.status === 401){ throw new Error("Session OneDrive expirée : reconnectez-vous."); }
    return r;
  },
  url: chemin => GRAPH + ":/" + chemin.split("/").map(encodeURIComponent).join("/") + ":",
  async pret(){ return this.connecte(); },
  async lire(chemin){
    const meta = await this.requete(this.url(chemin));
    if (meta.status === 404) return null;
    if (!meta.ok) throw new Error("OneDrive : lecture impossible (" + meta.status + ").");
    const m = await meta.json();
    const direct = m["@microsoft.graph.downloadUrl"];
    const r = direct ? await fetch(direct) : await this.requete(this.url(chemin) + "/content");
    if (!r.ok) throw new Error("OneDrive : téléchargement impossible (" + r.status + ").");
    return {octets: new Uint8Array(await r.arrayBuffer()), etiquette: m.eTag, id: m.id};
  },
  async ecrire(chemin, octets, attendue){
    const entetes = {"Content-Type": "application/octet-stream"};
    if (attendue) entetes["If-Match"] = attendue;
    const r = await this.requete(this.url(chemin) + "/content" + (attendue ? "" : ""), {method: "PUT", headers: entetes, body: octets});
    if (r.status === 412) throw new ConflitEcriture();
    if (!r.ok) throw new Error("OneDrive : écriture impossible (" + r.status + ").");
    return (await r.json()).eTag;
  },
  async ecrireNouveau(chemin, octets){
    const r = await this.requete(this.url(chemin) + "/content?@microsoft.graph.conflictBehavior=fail", {method: "PUT", headers: {"Content-Type": "application/octet-stream"}, body: octets});
    if (!r.ok) throw new Error("OneDrive : dépôt impossible (" + r.status + " " + (await r.text().catch(() => "")).slice(0, 160) + ").");
    return (await r.json()).eTag;
  },
  async lister(dossier){
    const r = await this.requete(this.url(dossier) + "/children?$select=name,eTag,id,file&$top=999");
    if (r.status === 404) return [];
    if (!r.ok) throw new Error("OneDrive : liste impossible (" + r.status + ").");
    return (await r.json()).value.filter(x => x.file).map(x => ({nom: x.name, chemin: dossier + "/" + x.name, etiquette: x.eTag, id: x.id}));
  },
  async assurerDossier(dossier){
    const r = await this.requete(this.url(dossier));
    if (r.ok) return (await r.json()).id;
    const parent = dossier.includes("/") ? this.url(dossier.split("/").slice(0, -1).join("/")) : GRAPH;
    const c = await this.requete(parent + "/children", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({name: dossier.split("/").pop(), folder: {}, "@microsoft.graph.conflictBehavior": "replace"})});
    if (!c.ok) throw new Error("OneDrive : création du dossier impossible (" + c.status + " " + (await c.text().catch(() => "")).slice(0, 160) + ").");
    return (await c.json()).id;
  },
  // Copie puis retrait de l'original : le dépôt par chemin crée lui-même le dossier cible
  // (OneDrive refuse la création préalable d'un dossier dans le dossier de l'application).
  async deplacer(chemin, dossierCible){
    const src = await this.lire(chemin); if (!src) return;
    await this.ecrire(dossierCible + "/" + chemin.split("/").pop(), src.octets);
    const r = await this.requete(this.url(chemin), {method: "DELETE"});
    if (!r.ok && r.status !== 404) throw new Error("OneDrive : retrait de l'original impossible (" + r.status + ").");
  }
};

/* ---------- Adaptateur simulé (suite de contrôle) ---------- */
function adaptateurSimule(){
  const fichiers = new Map(); let n = 0;
  return {
    nom: "simule", fichiers,
    async pret(){ return true; },
    async lire(c){ const v = fichiers.get(c); return v ? {octets: v.octets, etiquette: v.etiquette} : null; },
    async ecrire(c, octets, attendue){
      const v = fichiers.get(c);
      if (attendue && v && v.etiquette !== attendue) throw new ConflitEcriture();
      const etiquette = "s" + (++n); fichiers.set(c, {octets, etiquette}); return etiquette;
    },
    async ecrireNouveau(c, octets){ if (fichiers.has(c)) throw new Error("existe"); return this.ecrire(c, octets); },
    async lister(d){ return [...fichiers.keys()].filter(k => k.startsWith(d + "/") && !k.slice(d.length + 1).includes("/")).map(k => ({nom: k.slice(d.length + 1), chemin: k})); },
    async deplacer(c, d){ const v = fichiers.get(c); if (!v) return; fichiers.set(d + "/" + c.split("/").pop(), v); fichiers.delete(c); }
  };
}

function adaptateurNomme(nom){ return {local: adaptateurLocal, dossier: adaptateurDossier, graph: adaptateurGraph}[nom] || adaptateurLocal; }

/* ===== 06-session.js ===== */
/* ================= Session : ouverture, enregistrement, synchronisation =================
   Le livre est relu et fusionné avant chaque écriture si un autre appareil l'a modifié
   (étiquette OneDrive « eTag » ou date de modification du fichier). Une copie datée
   par jour est gardée dans « sauvegardes/ ». Les copies de conflit créées par le
   client OneDrive (« budget-NOM-DU-PC.chiffre ») sont fusionnées puis rangées. */

const FICHIER_LIVRE = "budget.chiffre";
const SESSION = {adaptateur: null, cle: null, enveloppe: null, etiquette: null, etat: "ferme", derniereSynchro: null, erreur: "", enCours: false};

async function adaptateurChoisi(){ return adaptateurNomme(await reglage("adaptateur", "local")); }

async function lireCache(){ return idbLire("fichiers", "cache:" + FICHIER_LIVRE); }
async function ecrireCache(octets, synchro){ if (typeof DEMO !== "undefined" && DEMO) return; await idbEcrire("fichiers", "cache:" + FICHIER_LIVRE, {octets, etiquetteDistante: SESSION.etiquette, nonSynchro: !synchro, date: Date.now()}); }

/* ---------- Création d'un livre neuf ---------- */
async function creerLivre(motDePasse, nomFoyer, souvenir){
  const ad = SESSION.adaptateur;
  if (ad && await ad.pret(true)){
    const existant = await ad.lire(FICHIER_LIVRE);
    if (existant) throw new Error("Un livre existe déjà dans ce dossier : ouvrez-le avec son mot de passe.");
  }
  const cle = await nouvelleCleDonnees();
  SESSION.enveloppe = await creerEnveloppe(motDePasse, cle);
  SESSION.cle = cle;
  LIVRE = livreVide(nomFoyer);
  const paire = await nouvellePaireBoite();
  LIVRE.cles = {boitePublique: paire.publique, boitePrivee: paire.privee, extrait: versB64(crypto.getRandomValues(new Uint8Array(32)))};
  if (souvenir) await memoriserCle(motDePasse);
  SESSION.etiquette = null;
  await enregistrerMaintenant(true);
}

/* ---------- Ouverture ---------- */
async function ouvrirLivre(motDePasse, souvenir){
  const ad = SESSION.adaptateur;
  let distant = null;
  if (ad && await ad.pret(false).catch(() => false)) distant = await ad.lire(FICHIER_LIVRE).catch(e => { SESSION.erreur = e.message; return null; });
  const cache = await lireCache().catch(() => null);
  const source = distant ? distant.octets : cache?.octets;
  if (!source) throw new Error("Aucun livre trouvé ici. Choisissez le bon dossier ou créez un livre.");
  const tete = lireEnTete(source);
  SESSION.enveloppe = tete.enveloppe;
  SESSION.cle = motDePasse ? await ouvrirEnveloppe(motDePasse, tete.enveloppe, false) : await idbLire("cles", "cleDonnees");
  if (!SESSION.cle) throw new Error("Mot de passe requis.");
  let livre = await dechiffrerLivre(source, SESSION.cle);
  SESSION.etiquette = distant ? distant.etiquette : (cache?.etiquetteDistante || null);
  if (distant && cache && cache.nonSynchro){
    try { livre = fusionnerLivres(await dechiffrerLivre(cache.octets, SESSION.cle), livre).livre; LIVRE_MODIFIE = true; } catch (e) {}
  }
  LIVRE = completerLivre(livre);
  if (motDePasse && souvenir) await memoriserCle(motDePasse);
  SESSION.etat = "ouvert";
  estimerDebitsCartes();   // livres repris avant la correction du 17/10/2026 : achats carte datés comme débités le jour même
  if (!distant) await ecrireCache(source, false).catch(() => {});
  if (LIVRE_MODIFIE) planifierSauvegarde();
  setTimeout(() => synchroniser().catch(() => {}), 500);
}
/* Mise à niveau douce d'un livre plus ancien : collections et paramètres manquants. */
function completerLivre(l){
  const v = livreVide(l.parametres?.nomFoyer);
  for (const c of COLLECTIONS) l[c] = l[c] || {};
  l.parametres = Object.assign({}, v.parametres, l.parametres || {});
  l.cles = l.cles || {};
  return l;
}
async function memoriserCle(motDePasse){
  const cle = await ouvrirEnveloppe(motDePasse, SESSION.enveloppe, false);
  await idbEcrire("cles", "cleDonnees", cle);
}
async function oublierCle(){ await idbSuppr("cles", "cleDonnees").catch(() => {}); }
async function cleMemorisee(){ return !!(await idbLire("cles", "cleDonnees").catch(() => null)); }

function fermerLivre(){
  LIVRE = null; SESSION.cle = null; SESSION.etat = "ferme"; LIVRE_MODIFIE = false;
  clearTimeout(minuterieSauvegarde);
}

/* ---------- Enregistrement ---------- */
let minuterieSauvegarde = 0;
function planifierSauvegarde(){
  clearTimeout(minuterieSauvegarde);
  minuterieSauvegarde = setTimeout(() => enregistrerMaintenant().catch(e => signalerErreurSynchro(e)), 1200);
}
async function enregistrerMaintenant(creation){
  if (!LIVRE || !SESSION.cle) return;
  const octets = await chiffrerLivre(LIVRE, SESSION.cle, SESSION.enveloppe);
  await ecrireCache(octets, false);
  LIVRE_MODIFIE = false;
  majEtatSynchro();
  await synchroniser(creation ? octets : null);
}

/* Synchronisation : lit le distant, fusionne si besoin, écrit si le local a changé. */
async function synchroniser(octetsPrets){
  const ad = SESSION.adaptateur;
  if (!LIVRE || !ad || SESSION.enCours) return;
  if (!(await ad.pret(false).catch(() => false))){ SESSION.erreur = "Dossier partagé indisponible : les modifications restent sur cet appareil."; majEtatSynchro(); return; }
  SESSION.enCours = true; majEtatSynchro();
  try {
    for (let essai = 0; essai < 4; essai++){
      const cache = await lireCache();
      const distant = await ad.lire(FICHIER_LIVRE);
      let aEcrire = !!(cache && cache.nonSynchro) || !!octetsPrets;
      if (distant && distant.etiquette !== SESSION.etiquette){
        let livreDistant;
        try { livreDistant = await dechiffrerLivre(distant.octets, SESSION.cle); }
        catch (e){ throw new Error("Le livre partagé a changé de clé (mot de passe modifié ailleurs ?) : fermez puis rouvrez-le avec le mot de passe actuel."); }
        const {livre, changements} = fusionnerLivres(LIVRE, livreDistant);
        LIVRE = completerLivre(livre);
        SESSION.etiquette = distant.etiquette;
        if (changements) rafraichirEcran();
        // Le local avait-il des enregistrements plus récents que le distant ?
        aEcrire = aEcrire && JSON.stringify(livre) !== JSON.stringify(livreDistant);
        if (!aEcrire){ await ecrireCache(distant.octets, true); break; }
      }
      if (!aEcrire && distant) break;
      const octets = await chiffrerLivre(LIVRE, SESSION.cle, SESSION.enveloppe);
      try {
        SESSION.etiquette = await ad.ecrire(FICHIER_LIVRE, octets, distant ? SESSION.etiquette : null);
        await ecrireCache(octets, true);
        octetsPrets = null;
        await sauvegardeDuJour(ad, octets);
        break;
      } catch (e){ if (!e.conflit) throw e; /* un autre appareil vient d'écrire : on relit et on fusionne */ }
    }
    if (ad.nom === "dossier") await fusionnerCopiesDeConflit(ad);
    publierExtraitSiBesoin();
    SESSION.erreur = ""; SESSION.derniereSynchro = new Date();
  } catch (e){ SESSION.erreur = e.message; throw e; }
  finally { SESSION.enCours = false; majEtatSynchro(); }
}
async function sauvegardeDuJour(ad, octets){
  if (DEMO) return;
  const nom = "sauvegardes/budget-" + aujourdhui() + ".chiffre";
