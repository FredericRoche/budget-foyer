/* ================= Lecture des tickets (OCR local, Tesseract.js) =================
   Tout se passe dans le navigateur : moteur, modèle français et image restent
   sur l'appareil. L'extraction propose ; l'utilisateur valide ou corrige. */

let MOTEUR_OCR = null;
async function chargerOcr(progression){
  if (MOTEUR_OCR) return MOTEUR_OCR;
  if (!window.Tesseract) await chargerScript("vendor/tesseract/tesseract.min.js");
  const base = new URL("vendor/tesseract/", location.href).href;
  const options = {workerPath: base + "worker.min.js", corePath: base, langPath: base, gzip: true, cacheMethod: "none",
    logger: m => { if (progression && m.status === "recognizing text") progression(m.progress); }};
  // Le moteur pèse plusieurs mégaoctets : une seconde tentative couvre une coupure réseau passagère.
  try { MOTEUR_OCR = await Tesseract.createWorker("fra", 1, options); }
  catch (e){ await attendre(800); MOTEUR_OCR = await Tesseract.createWorker("fra", 1, options); }
  return MOTEUR_OCR;
}
function chargerScript(src){
  return new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => ko(new Error("chargement de " + src)); document.head.appendChild(s); });
}
/* Réduit la photo (1 600 px au plus), la passe en niveaux de gris : plus léger à stocker, plus net à lire. */
async function preparerImage(blob, cote){
  const img = await createImageBitmap(blob);
  const k = Math.min(1, (cote || 1600) / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0, c.width, c.height);
  const couleur = await new Promise(r => c.toBlob(r, "image/jpeg", 0.8));
  const d = ctx.getImageData(0, 0, c.width, c.height); const p = d.data;
  for (let i = 0; i < p.length; i += 4){ const g = 0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]; const v = g > 160 ? 255 : g < 90 ? 0 : g; p[i] = p[i + 1] = p[i + 2] = v; }
  ctx.putImageData(d, 0, 0);
  return {jpeg: new Uint8Array(await couleur.arrayBuffer()), lecture: c};
}
async function lireTicket(blob, progression){
  const {jpeg, lecture} = await preparerImage(blob);
  const moteur = await chargerOcr(progression);
  const r = await moteur.recognize(lecture);
  return Object.assign(extraireTicket(r.data.text || ""), {photo: {mime: "image/jpeg", octets: jpeg}});
}

/* ---------- Extraction (pure, testable) ---------- */
// Montants avec centimes (48,60 ; 1 234,56), ou entiers suivis de « € » comme sur les factures (1070 € ; 4 272 €)
const RE_MONTANT = /(\d{1,3}(?:[ .\u00a0\u202f]\d{3})*|\d+)[,.](\d{2})(?!\d)/g;
const RE_MONTANT_ENTIER = /(?<![\d,.])(\d{1,3}(?:[ .\u00a0\u202f]\d{3})+|\d+)\s?(?:€|EUR\b|euros?\b)/gi;
function montantsDe(ligne){
  const r = []; for (const m of ligne.matchAll(RE_MONTANT)) r.push(parseFloat(m[1].replace(/[ .\u00a0\u202f]/g, "") + "." + m[2]));
  if (!r.length) for (const m of ligne.matchAll(RE_MONTANT_ENTIER)) r.push(parseFloat(m[1].replace(/[ .\u00a0\u202f]/g, "")));
  return r;
}
function extraireTicket(texte){
  const lignes = texte.split(/\r?\n/).map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  const N = lignes.map(l => norm(l).toUpperCase());
  const res = {texte, montant: null, date: null, heure: "", raisonSociale: "", enseigne: "", type: "ticket", carte4: "", siret: "", numero: "", confiance: {}};

  /* Type */
  const facturette = N.some(l => /TICKET CLIENT|A CONSERVER|NO AUTO|N° AUTO|AUTOR|SANS CONTACT|CONTACTLESS|DEBIT|CARTE BANCAIRE|VISA|MASTERCARD|CB EMV|AID A0/.test(l))
    && N.length < 40 && !N.some(l => /TVA \d|QTE|QUANTITE/.test(l));
  const facture = N.some(l => /^FACTURE|FACTURE N|N° DE FACTURE|DATE DE FACTURE|ECHEANCE|CONDITIONS DE PAIEMENT/.test(l));
  res.type = facture ? "facture" : facturette ? "facturette" : "ticket";

  /* Montant : ligne « TOTAL / À PAYER / NET / MONTANT », sinon le plus grand montant */
  const motsTotal = /(TOTAL TTC|NET A PAYER|A PAYER|TOTAL|MONTANT( TTC)?|SOMME|TTC|PAYE|CB )/;
  let candidat = null;
  N.forEach((l, i) => {
    if (!motsTotal.test(l) || /SOUS.?TOTAL|TVA|HT\b|RENDU|REMISE|ECONOMIE/.test(l)) return;
    const m = montantsDe(lignes[i]).concat(i + 1 < lignes.length && !montantsDe(lignes[i]).length ? montantsDe(lignes[i + 1]) : []);
    if (m.length){ const v = Math.max(...m); if (!candidat || /TOTAL TTC|NET A PAYER|A PAYER/.test(l) || v > candidat) candidat = v; }
  });
  if (candidat !== null){ res.montant = candidat; res.confiance.montant = "sûr"; }
  else { const tous = lignes.flatMap(montantsDe).filter(v => v < 100000); if (tous.length){ res.montant = Math.max(...tous); res.confiance.montant = "à vérifier"; } }

  /* Numéro de facture : « Facture n° X », « N°D26-011 », ou le n° posé sur la ligne suivante (les dates en sont retirées) */
  res.numero = numeroFacture(lignes);

  /* Date et heure */
  const dates = [];
  for (const l of lignes){
    // (les PDF découpent parfois la date : « 12 / 10 /202 6 »)
    for (const m of l.matchAll(/\b(\d{1,2}) ?[\/.\-] ?(\d{1,2}) ?[\/.\-] ?(\d ?\d ?\d ?\d|\d{2})(?!\d)/g)){ const d = lireDate(m[0].replace(/ /g, "")); if (d) dates.push(d); }
    for (const m of norm(l).matchAll(/\b(\d{1,2}) (janv|fevr|mars|avr|mai|juin|juil|aout|sept|oct|nov|dec)[a-z]*\.? (\d{4})\b/g)){
      const mois = ["janv", "fevr", "mars", "avr", "mai", "juin", "juil", "aout", "sept", "oct", "nov", "dec"].indexOf(m[2]) + 1;
      dates.push(`${m[3]}-${pad2(mois)}-${pad2(m[1])}`);
    }
    const h = l.match(/\b([01]?\d|2[0-3])[:hH]([0-5]\d)(?:[:]([0-5]\d))?\b/); if (h && !res.heure) res.heure = pad2(h[1]) + ":" + h[2];
  }
  const auj = aujourdhui();
  const plausibles = dates.filter(d => d <= ajouterJours(auj, 1) && d >= ajouterJours(auj, -400));
  if (plausibles.length){ res.date = plausibles[0]; res.confiance.date = "sûr"; }

  /* Carte (4 derniers chiffres), SIRET, TVA */
  for (const l of N){
    const c = l.match(/(?:X{4,}|\*{4,}|#{4,}|[X*#]{2,}\s?[X*#]{2,})[ X*#]*?(\d{4})\b/) || l.match(/CARTE\D{0,12}(\d{4})\s*$/);
    if (c && !res.carte4) res.carte4 = c[1];
    const s = l.match(/SIRET\D{0,6}(\d{3} ?\d{3} ?\d{3} ?\d{5})/) || l.match(/\b(\d{3} \d{3} \d{3} \d{5})\b/);
    if (s && !res.siret) res.siret = s[1].replace(/\s/g, "");
  }
  /* Raison sociale et enseigne : premières lignes significatives */
  const ignorer = /BIENVENUE|MERCI|TICKET|CAISSE|\bTEL\b|WWW|HTTP|@|^\d|SIRET|TVA|FACTURE|DUPLICATA|CLIENT|CONSERVER|CARTE BANCAIRE|SANS CONTACT|^DEBIT|^MONTANT|^CB\b|VISA|MASTERCARD|^X{4}/;
  const tete = lignes.slice(0, 8).filter((l, i) => /[A-Za-z]{3}/.test(l) && !ignorer.test(N[lignes.indexOf(l)]) && !estBanqueTerminal(l) && !/TOTAL|NET A PAYER|^DATE|^N° ?[A-Z0-9]|^DEVIS|^OBJET/.test(N[lignes.indexOf(l)]) && !montantsDe(l).length && l.length <= 40);
  const forme = lignes.find(l => /\b(SARL|SAS|SASU|EURL|SA|SNC|SCP|SELARL)\b/i.test(l));
  res.enseigne = tete[0] || "";
  res.raisonSociale = forme ? forme.replace(/\s+(CAPITAL|AU CAPITAL|RCS).*$/i, "").trim() : res.enseigne;
  res.confiance.commercant = forme ? "lu" : "à vérifier";
  return res;
}
const RE_DATE_LIGNE = /\b\d{1,2} ?[\/.\-] ?\d{1,2} ?[\/.\-] ?(?:\d ?\d ?\d ?\d|\d{2})(?!\d)/g;
function numeroFacture(lignes){
  const propre = s => s.replace(RE_DATE_LIGNE, " ").replace(/\b(DATE|DU|LE|FACTURE|N°|NO|NUMERO|DE|:)\b/gi, " ").trim();
  for (let i = 0; i < lignes.length; i++){
    const l = norm(lignes[i]).toUpperCase();
    const m = l.match(/(?:FACTURE|INVOICE)?\s*(?:N°|NO\b|NUMERO|N\s?O\b)\s*:?\s*([A-Z]{0,4}[\s\-]?\d[\w\s\-–\/.]{1,20})/) || (/FACTURE/.test(l) && l.match(/FACTURE\s*:?\s*([A-Z]{0,4}\d[\w\-–\/.]{2,20})/));
    let brut = m ? propre(m[1]) : "";
    if (!/\d/.test(brut) && /(?:^|\s)(N°|NO|NUMERO)(\s|$)/.test(l) && i + 1 < lignes.length) brut = propre(norm(lignes[i + 1]).toUpperCase());
    const cle = cleNumero(brut);
    if (cle.length >= 3 && /\d/.test(cle)) return cle;
  }
  return "";
}
// Clé de comparaison : lettres et chiffres seuls (« 26 – 07 – 102 » = « 2607102 »)
const cleNumero = s => norm(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 20);

/* Fournisseur connu nommé dans le texte de la pièce : tous les mots (4 lettres et plus, deux au moins) de son nom
   y figurent. Les fiches de la famille, des virements internes et des revenus sont écartées. */
const MOTS_GENERIQUES = new Set(["sarl", "sas", "sasu", "eurl", "cedex", "france", "societe", "chez", "prlv", "sepa", "virement", "carte", "facture", "architecte"]);
const motsNom = s => [...new Set(norm(s || "").toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length >= 4 && !MOTS_GENERIQUES.has(w)))];
function commercantDansTexte(texte, fiches){
  const mots = new Set(motsNom(texte)); let meilleur = null, score = 0;
  for (const f of fiches){
    if (["Famille", "Transfert", "Revenus", "Patrimoine", "Épargne"].includes(f.categorie)) continue;
    for (const nom of [f.nom, ...(f.alias || [])]){
      const m = motsNom(nom);
      if (m.length >= 2 && m.every(w => mots.has(w)) && m.length > score){ meilleur = f; score = m.length; }
    }
  }
  return meilleur;
}
/* Commerçant connu pour un ticket : par alias (raison sociale, enseigne) ou SIRET, sinon par son nom dans le texte. */
function commercantPourTicket(t, liste){
  const fiches = liste || vivants("commercants");
  const cles = [t.raisonSociale, t.enseigne].filter(Boolean).map(cleLibelle).filter(Boolean);
  for (const f of fiches){
    if (t.siret && f.siret === t.siret) return f;
    for (const a of f.alias || []) for (const k of cles) if (a === k || (a.length >= 6 && (k.startsWith(a) || a.startsWith(k)))) return f;
  }
  return t.texte ? commercantDansTexte(t.texte, fiches) : null;
}

/* ===== 13-calculs.js ===== */
/* ================= Budget, réalisé, bilan, résultat =================
   Réalisé : opérations ventilées comptées à leur date d'ACHAT (débit différé ignoré),
   hors transferts et opérations « Hors budget ». Dépense = montant positif. */

function budgetActif(annee){
  const liste = vivants("budgets").filter(b => !b.fige && (!annee || b.annee === annee));
  return liste.find(b => b.actif) || liste[0] || vivants("budgets").find(b => !annee || b.annee === annee) || null;
}
function anneesBudget(){ return [...new Set(vivants("budgets").map(b => b.annee))].sort(); }
/* Poids mensuels d'une ligne : 1/12 par défaut, sinon profil saisi (12 poids). */
function poidsMois(ligne){
  if (Array.isArray(ligne.profil) && ligne.profil.length === 12){ const t = somme(ligne.profil); if (t) return ligne.profil.map(x => x / t); }
  return Array(12).fill(1 / 12);
}
function budgetDuMois(ligne, mois){ return ligne.annuel * poidsMois(ligne)[mois - 1]; }
function partLieu(ligne, lieu){
  if (!lieu) return 1;
  const r = ligne.repartition; if (!r) return lieu === "Autres" ? 1 : 0;
  return r[lieu] || 0;
}
const cleLigne = (c, s) => norm(c) + "|" + norm(s);

/* Parts d'opérations (ventilations dépliées) dans une période. */
function partsPeriode(debut, fin, filtre){
  const r = [];
  for (const op of vivants("operations")){
    if (op.date < debut || op.date > fin) continue;
    for (const p of partsDe(op)) if (!filtre || filtre(p)) r.push(p);
  }
  return r;
}
/* Réalisé par ligne de budget (clé catégorie|sous-catégorie) et par lieu. */
function realiseParLigne(debut, fin, lieu){
  const m = new Map(); const horsBudget = [];
  for (const p of partsPeriode(debut, fin, p => !horsResultat(p) && p.nature !== "Revenu")){
    if (lieu && (p.lieu || "Autres") !== lieu) continue;
    const k = cleLigne(p.categorie, p.sousCategorie);
    m.set(k, (m.get(k) || 0) - p.montant);
  }
  return m;
}
/* Tableau budget/réalisé du mois (ou d'une période de mois) pour un lieu. */
function tableauBudget(budget, annee, moisDebut, moisFin, lieu){
  // Un budget peut ne couvrir qu'une partie de l'année (« debut ») : le réalisé est alors compté à partir de cette date.
  const borne = d => (budget?.debut && budget.debut > d) ? budget.debut : d;
  const debut = borne(`${annee}-${pad2(moisDebut)}-01`), fin = finDeMois(`${annee}-${pad2(moisFin)}-01`);
  const realise = debut <= fin ? realiseParLigne(debut, fin, lieu) : new Map();
  const realiseAnnee = realiseParLigne(borne(`${annee}-01-01`), fin, lieu);
  const lignes = [];
  const vues = new Set();
  for (const l of budget?.lignes || []){
    const k = cleLigne(l.categorie, l.sousCategorie); vues.add(k);
    const part = partLieu(l, lieu);
    let b = 0; for (let mo = moisDebut; mo <= moisFin; mo++) b += budgetDuMois(l, mo) * part;
    lignes.push({ligne: l, nature: l.nature, categorie: l.categorie, sousCategorie: l.sousCategorie, budget: b, realise: realise.get(k) || 0,
      cumul: realiseAnnee.get(k) || 0, annuel: l.annuel * part});
  }
  // Dépenses sans ligne de budget
  for (const [k, v] of realise){
    if (vues.has(k) || Math.abs(v) < 0.005) continue;
    const [c, s] = k.split("|");
    const ex = partsPeriode(debut, fin, p => cleLigne(p.categorie, p.sousCategorie) === k)[0];
    lignes.push({ligne: null, nature: ex?.nature || "Courante", categorie: ex?.categorie || c, sousCategorie: ex?.sousCategorie || s, budget: 0, realise: v, cumul: realiseAnnee.get(k) || v, annuel: 0, horsBudget: true});
  }
  return lignes;
}
function ordreNatures(){ return LIVRE.parametres.natures.filter(n => !NATURES_HORS_RESULTAT.includes(n) && n !== "Revenu"); }

/* ---------- Bilan ---------- */
/* Solde d'un compte bancaire à une date : dernier solde relevé connu (≤ date) + opérations postérieures. */
function soldeCompte(compte, date){
  if (compte.type === "carte"){
    // Encours : achats non encore débités à cette date (dette)
    return somme(vivants("operations").filter(o => o.compte === compte.id && o.date <= date && (!o.dateDebit || o.dateDebit > date) && !(o.lien && o.montant > 0)), o => o.montant);
  }
  if (["courant", "especes"].includes(compte.type)){
    const releves = vivants("soldes").filter(s => s.compte === compte.id && s.date <= date).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (a.debut ? 1 : -1));
    const ref = releves[0];
    if (!ref){
      if (compte.type === "especes") return somme(vivants("operations").filter(o => o.compte === compte.id && o.date <= date && o.montant > 0), o => o.montant)
        + somme(vivants("operations").filter(o => o.compte === compte.id && o.date <= date && o.montant < 0), o => o.montant);
      return null;
    }
    // Après le dernier relevé : opérations du compte (hors lignes carte, comptées sur les comptes carte) jusqu'à la date
    const apres = vivants("operations").filter(o => o.compte === compte.id && o.date > ref.date && o.date <= date);
    return ref.solde + somme(apres, o => o.montant);
  }
  const v = derniereValorisation(compte.id, date);
  return v ? v.valeur : null;
}
function derniereValorisation(compteId, date){
  return vivants("valorisations").filter(v => v.compte === compteId && v.date <= date).sort((a, b) => a.date < b.date ? 1 : -1)[0] || null;
}
function sourceSolde(compte, date){
  if (compte.type === "carte") return "achats non débités";
  if (["courant", "especes"].includes(compte.type)){
    const s = vivants("soldes").filter(x => x.compte === compte.id && x.date <= date).sort((a, b) => a.date < b.date ? 1 : -1)[0];
    return s ? "relevé du " + dateFr(s.date) + (s.date < date ? " + opérations" : "") : "aucun relevé";
  }
  const v = derniereValorisation(compte.id, date);
  return v ? (v.source ? "relevé" : "saisie") + " du " + dateFr(v.date) : "aucune valorisation";
}
function bilan(date){
  const rubriques = [];
  let total = 0;
  for (const [titre, types] of RUBRIQUES_BILAN){
    const lignes = [];
    for (const c of vivants("comptes").filter(c => types.includes(c.type) && c.actif !== false)){
      const v = soldeCompte(c, date);
      if (v === null && c.type !== "carte") { lignes.push({compte: c, valeur: null, source: sourceSolde(c, date)}); continue; }
      const val = c.type === "dette" ? -Math.abs(v || 0) : (v || 0);
      if (c.type === "carte" && Math.abs(val) < 0.005) continue;
      lignes.push({compte: c, valeur: val, source: sourceSolde(c, date)}); total += val;
    }
    if (lignes.length) rubriques.push({titre, lignes});
  }
  return {date, rubriques, total};
}

/* Variation du patrimoine net à périmètre comparable : seuls les postes valorisés aux deux dates. */
function variationComparable(b1, b0){
  const v0 = new Map(); for (const r of b0.rubriques) for (const l of r.lignes) if (l.valeur !== null) v0.set(l.compte.id, l.valeur);
  let d = 0, exclus = 0;
  for (const r of b1.rubriques) for (const l of r.lignes){
    if (l.valeur === null) continue;
    if (v0.has(l.compte.id)) d += l.valeur - v0.get(l.compte.id);
    else if (l.compte.type === "carte") d += l.valeur;
    else exclus++;
  }
  return {variation: d, exclus};
}

/* ---------- Compte de résultat ---------- */
function resultat(debut, fin){
  const parNature = new Map(); const memo = {epargne: 0, cessions: 0};
  for (const p of partsPeriode(debut, fin)){
    if (p.categorie === "Épargne") { memo.epargne += -p.montant; continue; }
    if (p.categorie === "Patrimoine") { memo.cessions += p.montant; continue; }
    if (horsResultat(p)) continue;
    const n = p.nature === "Revenu" || p.montant > 0 && p.categorie === "Revenus" ? "Revenu" : p.nature || "Courante";
    if (!parNature.has(n)) parNature.set(n, new Map());
    const m = parNature.get(n); const k = n === "Revenu" ? p.sousCategorie || p.categorie : p.categorie;
    m.set(k, (m.get(k) || 0) + p.montant);
  }
  return {parNature, memo, total: somme([...parNature.values()].flatMap(m => [...m.values()]))};
}
/* Variation de valeur des placements non expliquée par les versements (plus-values latentes). */
function plusValuesLatentes(debut, fin){
  /* Variation de valeur des placements valorisés aux deux dates, moins les versements d'épargne de la période. */
  let variation = 0;
  for (const c of vivants("comptes").filter(c => ["livret", "assurance_vie", "retraite", "prevoyance", "pea", "titres", "immobilier"].includes(c.type))){
    const v0 = derniereValorisation(c.id, ajouterJours(debut, -1)), v1 = derniereValorisation(c.id, fin);
    if (v0 && v1) variation += v1.valeur - v0.valeur;
  }
  const versements = somme(partsPeriode(debut, fin, p => p.categorie === "Épargne"), p => -p.montant);
  return variation - versements;
}

/* ===== 14-tresorerie.js ===== */
/* ================= Trésorerie prévisionnelle (12 mois, au jour le jour) =================
   Compte suivi : le compte de trésorerie (compte courant). Flux projetés :
   - échéances datées (loyer, pensions, impôts, travaux, voiture, cessions…) ;
   - budget courant restant, réparti selon son mode de paiement : prélèvements et
     virements étalés dans le mois ; achats par cartes LCL débités le dernier jour
     ouvré ; achats Amex débités au jour habituel du mois suivant ;
   - encours connus des cartes (achats importés, non encore débités).
   Une ligne de budget liée à une échéance n'est pas comptée deux fois.
   Trois visions séparées : la marche courante (cette simulation), l'épargne (simulerEpargne) et les
   projets. Les flux de capital (cessions de titres, paiements des projets) vont à l'épargne, même s'ils
   transitent par le compte joint ; « tout » les réunit pour retrouver le compte joint réel. */
function jourPrelevementAmex(compteId){
  const vus = vivants("operations").filter(x => (!compteId || x.compte === compteId) && x.montant < 0 && /AMERICAN EXPRESS/i.test(x.libelle))
    .sort((a, b) => a.date < b.date ? 1 : -1).slice(0, 3).map(x => +x.date.slice(8, 10)).sort((a, b) => a - b);
  return LIVRE.parametres.amexJourPrelevement || (vus.length ? vus[Math.floor(vus.length / 2)] : 27);
}
const estCapital = e => !!e.projet || !!e.capital || e.categorie === "Patrimoine";
/* Épargne mobilisable : livrets, assurances-vie, épargne retraite (le PER sert de réserve d'appoint
   quand les revenus ne suffisent pas) et PEA ; réglable compte par compte (Réglages › Comptes).
   Valeurs brutes : la fiscalité latente n'est pas déduite. */
const estMobilisable = c => c.actif !== false && (c.mobilisable ?? ["livret", "assurance_vie", "retraite", "pea"].includes(c.type));

function occurrences(e, debut, fin){
  const r = []; const d0 = e.debut || debut;
  if (e.recurrence === "unique" || !e.recurrence){ if (d0 >= debut && d0 <= fin) r.push(d0); return r; }
  const pas = {mensuelle: 1, trimestrielle: 3, semestrielle: 6, annuelle: 12}[e.recurrence] || 1;
  let d = d0;
  while (d < debut) d = ajouterMois(d, pas);
  while (d <= fin && (!e.fin || d <= e.fin)){ r.push(d); d = ajouterMois(d, pas); }
  return r;
}
/* Jour habituel du mois où une dépense passe par le compte : tiré de ses opérations des 12 derniers mois,
   par sous-catégorie (3 au moins, dont les trois quarts à 4 jours près du jour retenu) ; sinon null,
   et la dépense reste étalée sur le mois. Se met à jour à chaque import. */
const distanceJours = (a, b) => { const d = Math.abs(a - b); return Math.min(d, 31 - d); };
function jourDominant(jours){
  if (jours.length < 3) return null;
  let j = null, meilleur = Infinity;
  for (const x of jours){ const s = somme(jours, y => distanceJours(x, y)); if (s < meilleur){ meilleur = s; j = x; } }
  return jours.filter(y => distanceJours(j, y) <= 4).length >= jours.length * 0.75 ? j : null;
}
function joursHabituels(compteId, depart){
  const debut = ajouterJours(depart, -365), par = new Map();
  for (const o of vivants("operations")){
    if (o.compte !== compteId || o.montant >= 0 || o.date <= debut || o.date > depart || !o.categorie || o.categorie === "Transfert") continue;
    const k = cleLigne(o.categorie, o.sousCategorie || "");
    if (!par.has(k)) par.set(k, []);
    par.get(k).push(+o.date.slice(8, 10));
  }
  const r = new Map();
  for (const [k, js] of par){ const j = jourDominant(js); if (j) r.set(k, j); }
  return r;
}
function simulerTresorerie(options){
  const o = Object.assign({jours: 365, depart: aujourdhui(), supplements: [], perimetre: "courant"}, options);
  const compte = obtenir("comptes", LIVRE.parametres.compteTresorerie) || comptesDeType("courant")[0];
  if (!compte) return null;
  const fin = ajouterJours(o.depart, o.jours);
  const soldeDepart = soldeCompte(compte, o.depart);
  const flux = new Map(); const evenements = [];
  const ajouter = (date, montant, libelle, genre, gros, recurrent) => {
    if (date <= o.depart || date > fin) return;
    flux.set(date, (flux.get(date) || 0) + montant);
    if (gros) evenements.push({date, montant, libelle, genre, recurrent: !!recurrent});
  };
  // 1. Échéances
  const lignesLiees = new Set();
  for (const e of vivants("echeances").filter(x => x.active !== false && (!x.compte || x.compte === compte.id))){
    if (e.ligneBudget) lignesLiees.add(e.ligneBudget);
    if (o.perimetre === "courant" && estCapital(e)) continue;
    for (const d of occurrences(e, ajouterJours(o.depart, 1), fin)) ajouter(d, e.montant, e.libelle, "echeance", Math.abs(e.montant) >= 1000 || e.recurrence === "unique", e.recurrence && e.recurrence !== "unique");
  }
  for (const s of o.supplements) ajouter(s.date, s.montant, s.libelle, "simulation", true);
  // Intérêts des livrets de l'année écoulée, virés au compte courant en janvier
  const interetsLivrets = produitsEpargne(o.depart).livrets;
  if (interetsLivrets) for (let an = +o.depart.slice(0, 4) + 1; an <= +fin.slice(0, 4); an++)
    ajouter(an + "-01-" + pad2(JOUR_VIREMENT_LIVRETS), interetsLivrets, "Intérêts " + (an - 1) + " des livrets, virés depuis l'épargne", "echeance", true);
  // 2. Encours connus des cartes rattachées à ce compte
  const amexJour = jourPrelevementAmex(compte.id);
  for (const c of vivants("comptes").filter(c => c.type === "carte" && (c.compteDebit === compte.id || !c.compteDebit))){
    const encours = vivants("operations").filter(x => x.compte === c.id && !x.dateDebit && !(x.lien && x.montant > 0) && x.date <= o.depart);
    if (!encours.length) continue;
    const total = somme(encours, x => x.montant);
    const date = c.carte === "AMEX" ? prochainJour(o.depart, amexJour) : dernierJourOuvre(o.depart);
    ajouter(date > o.depart ? date : dernierJourOuvre(ajouterMois(o.depart, 1)), total, "Débit différé " + c.nom + " (encours connu)", "carte", true);
  }
  // 3. Budget courant restant, mois par mois ; la part payée par le compte tombe à son jour habituel quand il est connu
  const budgetsParAnnee = {};
  const habituels = joursHabituels(compte.id, o.depart);
  let mois = debutDeMois(o.depart);
  while (mois <= fin){
    const an = +mois.slice(0, 4), m = +mois.slice(5, 7);
    // Année sans budget : on prolonge le dernier budget connu (signalé dans l'écran de trésorerie).
    const b = budgetsParAnnee[an] !== undefined ? budgetsParAnnee[an] : (budgetsParAnnee[an] = budgetActif(an) || dernierBudgetAvant(an));
    if (b){
      const finMois = finDeMois(mois);
      const realise = mois === debutDeMois(o.depart) ? realiseParLigne(mois, o.depart) : new Map();
      let compteMois = 0, cartesMois = 0, amexMois = 0;
      for (const l of b.lignes){
        if (lignesLiees.has(l.id) || l.nature === "Exceptionnelle") continue;
        const reste = Math.max(0, budgetDuMois(l, m) - (realise.get(cleLigne(l.categorie, l.sousCategorie)) || 0));
        const p = l.paiement || {compte: 1, cartes: 0, amex: 0};
        const partCompte = reste * (p.compte || 0);
        const jour = l.jour || habituels.get(cleLigne(l.categorie, l.sousCategorie));
        const date = jour ? mois.slice(0, 8) + pad2(Math.min(jour, +finMois.slice(8))) : null;
        if (date && date > o.depart && partCompte) ajouter(date, -partCompte, (l.sousCategorie || l.categorie) + " (budget, vers le " + jour + ")", "budget", partCompte >= 1000, true);
        else compteMois += partCompte;
        cartesMois += reste * (p.cartes || 0); amexMois += reste * (p.amex || 0);
      }
      // prélèvements et virements étalés sur les jours restants du mois
      const premierJour = mois === debutDeMois(o.depart) ? ajouterJours(o.depart, 1) : mois;
      const nbJours = ecartJours(premierJour, finMois) + 1;
      if (nbJours > 0) for (let d = premierJour; d <= finMois; d = ajouterJours(d, 1)) ajouter(d, -compteMois / nbJours, "budget courant", "budget", false);
      if (cartesMois) ajouter(dernierJourOuvre(mois), -cartesMois, "Cartes LCL (budget du mois)", "carte", false);
      if (amexMois) ajouter(prochainJour(finMois, amexJour), -amexMois, "Amex (budget du mois)", "carte", false);
    }
    mois = ajouterMois(mois, 1);
  }
  // 4. Cumul jour par jour
  const jours = []; let solde = soldeDepart ?? 0;
  for (let d = ajouterJours(o.depart, 1); d <= fin; d = ajouterJours(d, 1)){
    const f = flux.get(d) || 0; solde += f;
    jours.push({date: d, flux: f, solde});
  }
  return {compte, depart: o.depart, soldeDepart, soldeConnu: soldeDepart !== null, jours, perimetre: o.perimetre, evenements: evenements.sort((a, b) => a.date < b.date ? -1 : 1)};
}
/* Approvisionnements du compte courant par l'épargne : à chaque passage sous le seuil bas de la
   marche courante, le virement qui l'y ramène (arrondi à la centaine supérieure). */
function approvisionnementsCourant(sim){
  const seuil = LIVRE.parametres.seuilBas || 0; let apport = 0; const r = [];
  for (const j of sim?.jours || []){ const manque = seuil - (j.solde + apport); if (manque > 0){ const m = Math.ceil(manque / 100) * 100; r.push({date: j.date, montant: m}); apport += m; } }
  return r;
}
const estVirementDepuisEpargne = (e, compte) => e.categorie === "Transfert" && e.montant > 0 && (!e.compte || e.compte === compte?.id);
/* Trésorerie de l'épargne : épargne mobilisable au départ (ses revenus y restent), plus les cessions de
   titres, moins le financement des projets et les approvisionnements du compte courant, prévus en
   échéance ou rendus nécessaires par la marche courante. */
/* Rendement estimé des placements (% par an, brut) : taux du compte, sinon taux par défaut de son type.
   Les sommes nouvelles (cessions, moins les financements) rapportent le taux des nouveaux placements. */
const RENDEMENT_DEFAUT = {livret: 1.5, assurance_vie: 2, retraite: 2, prevoyance: 2};
const tauxRendement = c => (typeof c.rendement === "number" ? c.rendement : (RENDEMENT_DEFAUT[c.type] || 0));
const tauxNouveauxPlacements = () => (typeof LIVRE.parametres.tauxNouveauxPlacements === "number" ? LIVRE.parametres.tauxNouveauxPlacements : 2);
/* Produits de l'épargne qui alimentent la marche courante :
   - intérêts des livrets (Livret A, LDDS…) de l'année écoulée, virés au compte courant le 15 janvier ;
   - rendement des assurances-vie, tenu pour disponible (il reste sur le contrat, mais finance le déficit avant le capital). */
const JOUR_VIREMENT_LIVRETS = 15;
function produitsEpargne(date){
  const mob = vivants("comptes").filter(estMobilisable);
  const prod = types => somme(mob.filter(c => types.includes(c.type)), c => (soldeCompte(c, date) || 0) * tauxRendement(c) / 100);
  return {livrets: Math.round(prod(["livret"])), assurancesVie: Math.round(prod(["assurance_vie", "prevoyance"]))};
}
function simulerEpargne(options){
  const o = Object.assign({jours: 365, depart: aujourdhui(), rendement: true}, options);
  const fin = ajouterJours(o.depart, o.jours);
  const comptes = vivants("comptes").filter(estMobilisable).map(c => ({compte: c, solde: soldeCompte(c, o.depart) || 0, taux: tauxRendement(c)}));
  const soldeDepart = somme(comptes, x => x.solde);
  const courant = simulerTresorerie({depart: o.depart, jours: o.jours});
  const flux = new Map(), evenements = [];
  const ajouter = (d, m, libelle, genre, echeance) => { flux.set(d, (flux.get(d) || 0) + m); evenements.push({date: d, montant: m, libelle, genre, echeance}); };
  for (const e of vivants("echeances").filter(x => x.active !== false))
    for (const d of occurrences(e, ajouterJours(o.depart, 1), fin)){
      if (estCapital(e)) ajouter(d, e.montant, e.libelle + (e.projet ? " (projet " + e.projet + ")" : ""), e.projet ? "projet" : "capital", e);
      else if (courant && estVirementDepuisEpargne(e, courant.compte)) ajouter(d, -e.montant, e.libelle + " (vers " + courant.compte.nom + ")", "courant", e);
    }
  const interetsLivrets = produitsEpargne(o.depart).livrets;
  if (interetsLivrets && courant) for (let an = +o.depart.slice(0, 4) + 1; an <= +fin.slice(0, 4); an++){
    const d = an + "-01-" + pad2(JOUR_VIREMENT_LIVRETS); if (d > o.depart && d <= fin) ajouter(d, -interetsLivrets, "Intérêts " + (an - 1) + " des livrets, virés vers " + courant.compte.nom, "courant", null);
  }
  const appro = approvisionnementsCourant(courant);
  for (const a of appro) ajouter(a.date, -a.montant, "Approvisionnement du compte courant (déficit de la marche courante)", "courant", null);
  // Rendement estimé, crédité en fin de mois (au prorata pour le premier mois) : comptes au départ à leur taux, sommes nouvelles au taux des nouveaux placements
  // (intérêts au jour le jour, crédités en fin de mois)
  const baseJour = somme(comptes, x => x.solde * x.taux / 100 / 365), tauxNouveau = tauxNouveauxPlacements() / 100 / 365;
  const jours = []; let solde = soldeDepart, rendement = 0, couru = 0, couruNouveau = 0;
  for (let d = ajouterJours(o.depart, 1); d <= fin; d = ajouterJours(d, 1)){
    let f = flux.get(d) || 0; solde += f;
    if (o.rendement){
      const n = (solde - soldeDepart - rendement) * tauxNouveau;
      couru += baseJour + n; couruNouveau += n;
      if (d === finDeMois(d) || d === fin){
        const r = Math.round(couru * 100) / 100, rn = Math.round(couruNouveau * 100) / 100; couru = 0; couruNouveau = 0;
        // « nouveau » : part due aux sommes nouvelles (cessions placées, moins les financements et prélèvements)
        if (r){ solde += r; f += r; rendement += r; evenements.push({date: d, montant: r, nouveau: rn, libelle: "Rendement estimé des placements", genre: "rendement"}); }
      }
    }
    jours.push({date: d, flux: f, solde});
  }
  return {titre: "Épargne disponible", depart: o.depart, soldeDepart, comptes, jours, rendement, approvisionnements: appro, evenements: evenements.sort((a, b) => a.date < b.date ? -1 : 1)};
}
function dernierBudgetAvant(an){
  const annees = anneesBudget().filter(a => a < an);
  return annees.length ? budgetActif(annees[annees.length - 1]) : null;
}
function prochainJour(apres, jour){
  let d = apres.slice(0, 8) + pad2(Math.min(jour, +finDeMois(apres).slice(8)));
  if (d <= apres) d = ajouterMois(d.slice(0, 8) + "01", 1).slice(0, 8) + pad2(jour);
  return d;
}
function analyseTresorerie(sim){
  if (!sim || !sim.jours.length) return null;
  const p = LIVRE.parametres;
  const min = sim.jours.reduce((a, j) => j.solde < a.solde ? j : a, sim.jours[0]);
  const premierBas = sim.jours.find(j => j.solde < p.seuilBas);
  const hauts = sim.jours.filter(j => j.solde > p.seuilHaut);
  let virement = 0, avant = null;
  if (premierBas){ virement = Math.ceil((p.seuilBas - min.solde + 5000) / 5000) * 5000; avant = ajouterJours(premierBas.date, -1); }
  // Excédent durable : au-dessus du seuil haut pendant 30 jours consécutifs ou plus
  let serie = 0, excedent = null;
  for (const j of sim.jours){ if (j.solde > p.seuilHaut){ serie++; if (serie >= 30 && !excedent) excedent = {depuis: ajouterJours(j.date, -29), montant: 0}; } else serie = 0; }
  if (excedent) excedent.montant = Math.floor((Math.min(...sim.jours.filter(j => j.date >= excedent.depuis).slice(0, 90).map(j => j.solde)) - p.seuilHaut) / 5000) * 5000;
  const parMois = new Map();
  for (const j of sim.jours){
    const k = j.date.slice(0, 7);
    if (!parMois.has(k)) parMois.set(k, {mois: k, debut: j.solde - j.flux, entrees: 0, sorties: 0, bas: Infinity, haut: -Infinity, fin: 0});
    const m = parMois.get(k);
    if (j.flux > 0) m.entrees += j.flux; else m.sorties -= j.flux;
    m.bas = Math.min(m.bas, j.solde); m.haut = Math.max(m.haut, j.solde); m.fin = j.solde;
  }
  return {min, premierBas, virement, avant, excedent, auDessus: hauts.length, mois: [...parMois.values()]};
}

/* ================= Interface : éléments communs ================= */

/* ---------- Messages ---------- */
function message(texte, alerte){
  const m = h("div", {class: "message" + (alerte ? " alerte" : "")}, texte);
  $("messages").appendChild(m);
  setTimeout(() => m.remove(), alerte ? 9000 : 5000);
}

/* ---------- Dialogue (fenêtre modale) ----------
   dialogue({titre, corps: Node|[Node], actions: [{libelle, classe, action: () => true|false|Promise}], large})
   Une action qui renvoie false garde la fenêtre ouverte. */
let fermerDialogueCourant = null;
function dialogue(o){
  return new Promise(resoudre => {
    const d = vider($("dialogue")); d.className = "dialogue" + (o.large ? " large" : "");
    d.appendChild(h("h2", null, o.titre));
    ajouterEnfants(d, [o.corps]);
    const actions = h("div", {class: "actions"});
    const fermer = v => { $("voile").hidden = true; fermerDialogueCourant = null; resoudre(v); };
    for (const a of o.actions || [{libelle: "Fermer"}]){
      actions.appendChild(h("button", {class: a.classe || "", onclick: async () => {
        try {
          // Une action qui renvoie false garde la fenêtre ouverte (saisie incomplète) ; un bouton sans action
          // la ferme toujours, avec sa valeur (false pour « Annuler »).
          if (!a.action) return fermer(a.valeur ?? true);
          const r = await a.action();
          if (r !== false) fermer(r === undefined ? a.valeur ?? true : r);
        } catch (e){ message(e.message, true); }
      }}, a.libelle));
    }
    d.appendChild(actions);
    $("voile").hidden = false;
    fermerDialogueCourant = () => fermer(null);
    const premier = d.querySelector("input, select, textarea, button.primaire"); if (premier) setTimeout(() => premier.focus(), 30);
  });
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && fermerDialogueCourant) fermerDialogueCourant(); });
async function confirmer(texte, libelleOui, danger){
  return !!(await dialogue({titre: "Confirmation", corps: h("p", null, texte),
    actions: [{libelle: "Annuler", classe: "discret", valeur: false}, {libelle: libelleOui || "Confirmer", classe: danger ? "danger" : "primaire", valeur: true}]}));
}
async function demander(titre, libelle, valeur, type){
  const champ = h("input", {type: type || "text", value: valeur || ""});
  const r = await dialogue({titre, corps: h("div", {class: "champ"}, h("label", null, libelle), champ),
    actions: [{libelle: "Annuler", classe: "discret", valeur: null}, {libelle: "Valider", classe: "primaire", action: () => champ.value}]});
  return r;
}

/* ---------- Champs ---------- */
function champ(libelle, controle, aide){ return h("div", {class: "champ"}, h("label", null, libelle), controle, aide ? h("div", {class: "note"}, aide) : null); }
function selection(options, valeur, attrs){
  const s = h("select", attrs || null);
  for (const o of options){
    const [v, t] = Array.isArray(o) ? o : [o, o];
    s.appendChild(h("option", {value: v, selected: v === valeur}, t));
  }
  if (valeur && !options.some(o => (Array.isArray(o) ? o[0] : o) === valeur)) s.appendChild(h("option", {value: valeur, selected: true}, valeur));
  return s;
}
/* Liste « Catégorie › sous-catégorie », valeur codée « cat|sous » */
function selectionCategorie(cat, sous, attrs){
  const s = h("select", attrs || null);
  s.appendChild(h("option", {value: "À préciser|À préciser"}, "À préciser"));
  for (const [c, liste] of Object.entries(LIVRE.parametres.categories)){
    if (c === "À préciser") continue;
    const g = h("optgroup", {label: c});
    for (const ss of liste) g.appendChild(h("option", {value: c + "|" + ss, selected: c === cat && ss === sous}, c + " › " + ss));
    s.appendChild(g);
  }
  if (cat && cat !== "À préciser" && !(LIVRE.parametres.categories[cat] || []).includes(sous)) s.appendChild(h("option", {value: cat + "|" + (sous || ""), selected: true}, cat + (sous ? " › " + sous : "")));
  s.appendChild(h("option", {value: "__nouvelle__"}, "Nouvelle catégorie…"));
  s.addEventListener("change", async () => {
    if (s.value !== "__nouvelle__") return;
    const c = await demander("Nouvelle catégorie", "Catégorie (existante ou nouvelle)", cat || ""); if (!c){ s.value = (cat || "À préciser") + "|" + (sous || "À préciser"); return; }
    const ss = await demander("Nouvelle catégorie", "Sous-catégorie de « " + c + " »", ""); if (!ss) return;
    ajouterCategorie(c, ss);
    const o = h("option", {value: c + "|" + ss, selected: true}, c + " › " + ss); s.insertBefore(o, s.lastChild); s.value = o.value;
    s.dispatchEvent(new Event("change"));
  });
  return s;
}
const valeurCategorie = sel => { const [c, s] = sel.value.split("|"); return {categorie: c, sousCategorie: s || ""}; };
function selectionLieu(valeur, attrs){ return selection([["", "—"], ...LIVRE.parametres.lieux.map(l => [l, l])], valeur || "", attrs); }
function selectionNature(valeur, attrs){ return selection(LIVRE.parametres.natures, valeur || "Courante", attrs); }
function segments(options, valeur, auChoix){
  const g = h("div", {class: "segments"});
  for (const o of options){
    const [v, t] = Array.isArray(o) ? o : [o, o];
    g.appendChild(h("button", {class: v === valeur ? "choisi" : "", onclick: () => { for (const b of g.children) b.classList.remove("choisi"); g.children[options.indexOf(o)].classList.add("choisi"); auChoix(v); }}, t));
  }
  return g;
}
function etiquetteLieu(lieu){ return lieu ? h("span", {class: classeLieu(lieu)}, lieu) : "—"; }

/* ---------- Champ de date jj/mm/aaaa ----------
   Le champ de date natif suit la langue du navigateur et peut afficher mm/jj/aaaa : on le remplace par un
   champ texte français. Sa propriété value se lit et s'écrit en ISO (aaaa-mm-jj), comme celle du champ natif ;
   une saisie illisible se lit "" et le champ est signalé. Accepte 18/10/2026, 18.10.26, 18 10 2026, 18102026. */
const dateValide = iso => !!iso && isoDe(dateDe(iso)) === iso;
function lireDateFr(txt){
  const s = String(txt || "").trim(); if (!s) return "";
  let m = s.match(/^(\d{1,2})[\/.\-\s]+(\d{1,2})[\/.\-\s]+(\d{2}|\d{4})$/) || s.match(/^(\d{2})(\d{2})(\d{4}|\d{2})$/);
  if (m){ const a = m[3].length === 2 ? "20" + m[3] : m[3]; const iso = a + "-" + pad2(+m[2]) + "-" + pad2(+m[1]); return dateValide(iso) ? iso : null; }
  m = s.match(/^\d{4}-\d{2}-\d{2}$/);
  return m && dateValide(s) ? s : null;
}
// Contrôle avant enregistrement : date obligatoire (ou facultative) et lisible ; message et refus sinon.
function dateSaisieOk(el, nom, facultative){
  const brut = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value").get.call(el).trim();
  if (!brut && facultative) return true;
  if (!brut || !lireDateFr(brut)){ el.classList.add("invalide"); el.focus(); message((nom || "Date") + " : " + (brut ? "date illisible" : "date à saisir") + " (jj/mm/aaaa).", true); return false; }
  return true;
}
function champDate(attrs){
  const a = Object.assign({}, attrs); const initiale = a.value || ""; delete a.value; delete a.type;
  const el = h("input", Object.assign({type: "text", inputmode: "numeric", placeholder: "jj/mm/aaaa", autocomplete: "off", maxlength: 10, class: "champ-date"}, a));
  const natif = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, "value");
  Object.defineProperty(el, "value", {configurable: true, get(){ return lireDateFr(natif.get.call(el)) || ""; }, set(v){ natif.set.call(el, v ? dateFr(v) : ""); }});
  el.value = initiale;
  const verifier = () => { const brut = natif.get.call(el), iso = lireDateFr(brut); el.classList.toggle("invalide", iso === null); el.title = iso === null ? "Date illisible : jj/mm/aaaa" : ""; if (iso) natif.set.call(el, dateFr(iso)); };
  el.addEventListener("blur", verifier);
  el.addEventListener("keydown", e => { if (e.key === "Enter") verifier(); });

}
function tableau(colonnes, lignes, options){
  const o = options || {};
  let tri = o.tri || null, sens = o.sens || 1;
  const t = h("table", {class: o.classe || ""}); const thead = h("thead"); const tbody = h("tbody");
  const rendre = () => {
    vider(thead); vider(tbody);
    const tr = h("tr");
    colonnes.forEach((c, i) => {
      const th = h("th", {class: (c.num ? "num " : "") + (c.cle ? "triable" : "") + (tri === i ? (sens > 0 ? " asc" : " desc") : "")}, c.titre);
      if (c.cle) th.addEventListener("click", () => { if (tri === i) sens = -sens; else { tri = i; sens = 1; } rendre(); });
      tr.appendChild(th);
    });
    thead.appendChild(tr);
    let ls = lignes.slice();
    if (tri !== null && colonnes[tri].cle){
      const k = colonnes[tri].cle;
      ls.sort((a, b) => { const x = k(a), y = k(b); return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "fr", {numeric: true})) * sens; });
    }
    const limite = o.limite || 600;
    for (const l of ls.slice(0, limite)) tbody.appendChild(o.ligne(l));
    if (ls.length > limite) tbody.appendChild(h("tr", null, h("td", {colspan: colonnes.length, class: "discret"}, (ls.length - limite) + " ligne(s) de plus : affinez la recherche.")));
    if (!ls.length) tbody.appendChild(h("tr", null, h("td", {colspan: colonnes.length, class: "vide"}, o.vide || "Rien à afficher.")));
  };
  rendre();
  t.append(thead, tbody);
  return h("div", {class: "tableau"}, t);
}

/* ================= Graphiques SVG à la charte ================= */
const COULEURS = {vert: "#1E4636", or: "#9B7D34", garnet: "#6E2A2A", sauge: "#6F8678", filet: "#C9D2CB", encre: "#182A20"};

function grapheTresorerie(sim, ana, hauteur, compact, seuils){
  const L = 900, H = hauteur || 300, g = 72, dr = 14, ht = 14, bas = 46;
  const j = sim.jours; if (!j.length) return h("div", {class: "vide"}, "Pas de projection.");
  const p = seuils || LIVRE.parametres;
  const vals = j.map(x => x.solde);
  const mini = Math.min(p.seuilBas, ...vals), maxi = Math.max(...vals, p.seuilBas + 1);
  const etendue = maxi - mini; const pas = [1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000].find(x => etendue / x <= 6) || 1000000;
  const ymin = Math.floor(mini / pas) * pas, ymax = Math.ceil(maxi / pas) * pas || pas;
  const x = i => g + i / Math.max(1, j.length - 1) * (L - g - dr);
  const y = v => ht + (ymax - v) / (ymax - ymin) * (H - ht - bas);
  const svg = s("svg", {viewBox: `0 0 ${L} ${H}`, width: "100%", role: "img", "aria-label": "Solde projeté de " + (sim.compte?.nom || sim.titre || "")});
  for (let v = ymin; v <= ymax + 1; v += pas){
    svg.appendChild(s("line", {x1: g, x2: L - dr, y1: y(v), y2: y(v), stroke: COULEURS.filet, "stroke-width": 1}));
    svg.appendChild(s("text", {x: g - 6, y: y(v) + 5, "text-anchor": "end", "font-size": 15, fill: COULEURS.sauge}, nombre(v / 1000, 0) + " k€"));
  }

async function enregistrerFichier(f, enLot){
  try {
    const lu = f.lu;
    if (lu.genre === "compte" || lu.genre === "carte"){ const imp = appliquerReleve(f.prep); f.resultat = imp.nouvelles + " opération(s)"; }
    else if (lu.genre === "facture_cb") appliquerFacture(f.prep);
    else if (lu.genre === "valorisation") appliquerValorisation(lu, f.compte);
    else if (lu.genre === "reprise_v7"){
      const ok = enLot ? true : await confirmer("Reprendre " + f.prep.operations.length + " opérations, le budget " + (f.prep.budget?.annee || "") + " (" + euros(f.prep.budget?.total || 0) + ") et " + f.prep.echeances.length + " échéances à confirmer ? Le classeur n'est pas modifié.", "Reprendre");
      if (!ok) return;
      const r = appliquerReprise(f.prep); message(r.operations + " opérations reprises.");
    }
    else if (lu.genre === "plan"){ const r = appliquerPlan(lu.contenu); message(r.budgets + " budget(s), " + r.echeances + " échéance(s), " + r.regles + " règle(s)" + (r.comptes ? ", " + r.comptes + " compte(s)" : "") + " importés" + (r.reclassees != null ? " ; " + r.reclassees + " opération(s) reclassée(s)" : "") + ".");
      for (const op of vivants("operations").filter(o => o.statut !== "classe")) enregistrer("operations", classerAutomatiquement(op)); }
    else if (lu.genre === "regles"){ const n = appliquerRegles(lu.contenu); message(n + " règle(s) importée(s).");
      for (const op of vivants("operations").filter(o => o.statut !== "classe")) enregistrer("operations", classerAutomatiquement(op)); }
    else if (lu.genre === "justificatif_pdf" || lu.genre === "image") await importerJustificatifPc(lu);
    else if (lu.genre === "document") enregistrer("documents", {genre: lu.sousGenre, fichier: lu.nom, date: lu.date, titre: lu.titre, quantite: lu.quantite, montant: lu.montant, sens: lu.sens, isin: lu.isin});
    f.statut = "fait";
    for (const autre of FICHIERS_EN_COURS.filter(x => x.statut === "pret" && x !== f)) preparerFichier(autre);
    if (!enLot) rafraichirEcran();
  } catch (e){ f.erreur = e.message; f.statut = "erreur"; console.error(e); message(e.message, true); if (!enLot) rafraichirEcran(); }
}

/* ================= Épargne et projets : hors marche courante du foyer =================
   Trois visions : la marche courante (écran Trésorerie), l'épargne (ses comptes, leurs revenus, les
   cessions de titres, et ce qu'elle finance) et les projets (travaux, voiture…). Un projet regroupe des échéances
   (paiements prévus) et des opérations (paiements faits). Une opération lui appartient si elle
   porte son nom (panneau de détail), ou si elle a la catégorie et la sous-catégorie d'une de ses
   échéances et la nature « Exceptionnelle ». */
function nomsProjets(){ return [...new Set(vivants("echeances").map(e => e.projet).filter(Boolean))].sort(); }
/* Rattachement d'office : nature « Exceptionnelle » et catégorie (avec sa sous-catégorie si elle est
   précisée) d'une échéance du projet ou de sa liste « rattache » ; le champ « Projet » d'une opération
   l'emporte toujours (vide = règle d'office). */
function operationsDuProjet(nom, echeances){
  const regles = echeances.flatMap(e => [...(e.rattache || []), e.categorie ? {categorie: e.categorie, sousCategorie: e.sousCategorie} : null]).filter(Boolean);
  const vaAuProjet = o => regles.some(r => r.categorie === o.categorie && (!r.sousCategorie || r.sousCategorie === o.sousCategorie));
  return vivants("operations").filter(o => o.projet === nom || (!o.projet && o.nature === "Exceptionnelle" && o.montant < 0 && vaAuProjet(o)));
}
/* Prochain paiement net : les échéances d'une même date se compensent (reprise du véhicule au jour du solde). */
function prochainPaiement(prevu){
  const parDate = new Map(); for (const p of prevu) parDate.set(p.date, (parDate.get(p.date) || 0) + p.montant);
  const d = [...parDate.keys()].sort().find(k => parDate.get(k) < -0.005);
  return d ? {date: d, montant: parDate.get(d)} : null;
}
function etatProjet(nom){
  const ech = vivants("echeances").filter(e => e.projet === nom && e.active !== false);
  const prevu = ech.flatMap(e => occurrences(e, ajouterJours(aujourdhui(), 1), "2100-12-31").map(d => ({date: d, montant: e.montant, echeance: e}))).sort((a, b) => a.date < b.date ? -1 : 1);
  const ops = operationsDuProjet(nom, ech);
  const paye = -somme(ops, o => o.montant), reste = -somme(prevu, x => x.montant);
  return {nom, ech, prevu, ops, paye, reste, total: paye + reste};
}

/* ---------- Détail de l'épargne : se recalcule à chaque import (valorisations datées) ---------- */
const GROUPES_EPARGNE = [["Épargne réglementée", ["livret"]], ["Assurance-vie", ["assurance_vie", "prevoyance"]], ["Épargne retraite", ["retraite"]], ["PEA", ["pea"]]];
// Comptes mobilisables regroupés par nature : valorisation retenue, précédente, variation et part de chacun.
function detailComptesEpargne(ep){
  const total = ep.soldeDepart || 0;
  const ligne = x => {
    const v = derniereValorisation(x.compte.id, ep.depart);
    const avant = v ? vivants("valorisations").filter(w => w.compte === x.compte.id && w.date < v.date).sort((a, b) => a.date < b.date ? 1 : -1)[0] : null;
    return {compte: x.compte, solde: x.solde, date: v?.date || null, precedente: avant || null, variation: avant ? x.solde - avant.valeur : null,
      part: total ? x.solde / total : 0, ancien: !v || ecartJours(v.date, ep.depart) > 120};
  };
  const lignes = ep.comptes.map(ligne);
  const groupes = GROUPES_EPARGNE.map(([nom, types]) => ({nom, lignes: lignes.filter(l => types.includes(l.compte.type)).sort((a, b) => b.solde - a.solde)}));
  const autres = lignes.filter(l => !GROUPES_EPARGNE.some(g => g[1].includes(l.compte.type)));
  if (autres.length) groupes.push({nom: "Autres placements mobilisables", lignes: autres.sort((a, b) => b.solde - a.solde)});
  return groupes.filter(g => g.lignes.length).map(g => Object.assign(g, {total: somme(g.lignes, l => l.solde)}));
}
// De l'épargne d'aujourd'hui à celle dans 12 mois : un total par genre de mouvement.
function decompositionEpargne(ep){
  const s = f => somme(ep.evenements.filter(f), e => e.montant);
  return {depart: ep.soldeDepart, cessions: s(e => e.genre === "capital" && e.montant > 0), autresCapital: s(e => e.genre === "capital" && e.montant < 0),
    projets: s(e => e.genre === "projet"), courant: s(e => e.genre === "courant"), rendement: s(e => e.genre === "rendement"),
    fin: ep.jours.length ? ep.jours[ep.jours.length - 1].solde : ep.soldeDepart};
}
// Financements par destination : chaque projet (net des reprises), puis le compte courant.
function financementsParDestination(ep){
  const m = new Map();
  for (const e of ep.evenements.filter(x => x.genre === "projet" || x.genre === "courant")){
    const cle = e.genre === "courant" ? "Compte courant" : "Projet " + (e.echeance?.projet || "sans nom");
    const g = m.get(cle) || {destination: cle, sorties: 0, entrees: 0, nombre: 0, premiere: e.date, derniere: e.date};
    if (e.montant < 0) g.sorties -= e.montant; else g.entrees += e.montant;
    g.nombre++; g.derniere = e.date; m.set(cle, g);
  }
  return [...m.values()].sort((a, b) => (a.destination === "Compte courant") - (b.destination === "Compte courant") || b.sorties - a.sorties);
}

/* ================= Démarrage ================= */
async function initialiser(){
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !/[?&]autotest\b/.test(location.search))
    navigator.serviceWorker.register("sw.js", {updateViaCache: "none"}).catch(() => {});
  if (/[?&]autotest\b/.test(location.search)) return afficherAutotest();
  if (/[?&]demo\b/.test(location.search)) return demarrerDemonstration();
  if (await traiterAppairage()) return demarrerSaisieMobile();
  if ((await reglage("mode", "")) === "saisie" && await configMobile()) return demarrerSaisieMobile();
  if (ecranAccueilIos()) return ecranAppairageColle();
  addEventListener("hashchange", () => { const n = location.hash.slice(1); if (SESSION.etat === "ouvert" && ECRANS[n] && n !== ECRAN_COURANT) aller(n); });
  addEventListener("beforeunload", e => { if (LIVRE_MODIFIE){ enregistrerMaintenant().catch(() => {}); e.preventDefault(); } });
  await afficherVerrou();
}
initialiser().catch(e => { console.error(e); document.body.appendChild(h("div", {class: "bandeau alerte"}, "Démarrage impossible : " + e.message)); });
