/* ===== 07-classement.js ===== */
/* ================= Commerçants et classement automatique =================
   Ordre de décision : règle explicite, puis fiche du commerçant (apprise des
   validations et des corrections), puis code de catégorie de commerçant (MCC)
   ou catégorie proposée par la banque, sinon « À préciser ».
   Une correction manuelle l'emporte toujours ensuite. */

/* Clé d'un libellé : majuscules sans accents, préfixes bancaires, numéros et dates retirés. */
const PREFIXES = /^(CB|CARTE|PRLV SEPA|PRLV|VIR SEPA|VIR INST|VIR|VIREMENT( SEPA)?( EMIS| RECU)?|PAIEMENT( PAR CARTE)?|ACHAT CB|SUMUP ?\*|SQ ?\*|PAYPAL ?\*|ZTL ?\*|IZ ?\*|BCK ?\*|SP ?\*|LYF ?\*)\s*/;
function cleLibelle(libelle){
  let t = norm(libelle).toUpperCase().replace(/[^A-Z0-9*&' ]/g, " ").replace(/\s+/g, " ").trim();
  for (let i = 0; i < 3; i++) t = t.replace(PREFIXES, "");
  t = t.replace(/\b\d{2}[ /.]\d{2}([ /.]\d{2,4})?\b/g, " ")      // dates
       .replace(/\b[A-Z]{0,3}\d{4,}[A-Z0-9/]*\b/g, " ")          // références, numéros
       .replace(/\bCB [A-Z]\b/g, " ").replace(/\*/g, " ")
       .replace(/\s+/g, " ").trim();
  return t.split(" ").slice(0, 4).join(" ");
}
/* Nom d'usage proposé à partir d'une clé : « BOUCHERIE DU PONT VILLE » → « Boucherie du Pont Ville » */
function nomDepuisCle(cle){
  const petits = new Set(["de", "du", "des", "la", "le", "les", "et", "d", "l", "au", "aux", "en"]);
  return cle.toLowerCase().split(" ").map((m, i) => (i && petits.has(m)) ? m : m.charAt(0).toUpperCase() + m.slice(1)).join(" ");
}

/* ---------- Index des alias ---------- */
let INDEX_ALIAS = null;
function indexAlias(){
  if (INDEX_ALIAS) return INDEX_ALIAS;
  INDEX_ALIAS = new Map();
  for (const c of vivants("commercants")) for (const a of c.alias || []) INDEX_ALIAS.set(a, c.id);
  return INDEX_ALIAS;
}
function invaliderIndex(){ INDEX_ALIAS = null; }
function trouverCommercant(libelleOuCle, estCle){
  const cle = estCle ? libelleOuCle : cleLibelle(libelleOuCle);
  if (!cle) return null;
  const idx = indexAlias();
  if (idx.has(cle)) return obtenir("commercants", idx.get(cle));
  // Préfixe commun suffisamment long (« BOUCHERIE DU PONT » ⊂ « BOUCHERIE DU PONT VILLE »)
  let meilleur = null, long = 0;
  for (const [a, id] of idx){
    if (a.length < 6) continue;
    if ((cle.startsWith(a + " ") || a.startsWith(cle + " ")) && a.length > long){ meilleur = id; long = a.length; }
  }
  return meilleur ? obtenir("commercants", meilleur) : null;
}
function assurerCommercant(libelle, nomPropose){
  const cle = cleLibelle(libelle);
  if (!cle) return null;
  let c = trouverCommercant(cle, true);
  if (!c){
    c = enregistrer("commercants", {nom: nomPropose || nomDepuisCle(cle), alias: [cle], stats: {}, natures: {}, titulaires: {}});
    invaliderIndex();
  }
  return c;
}
/* Banques des terminaux de paiement, imprimées en tête des facturettes : jamais un commerçant. */
const BANQUES_TERMINAUX = /BANQUE POPULAIRE|CREDIT AGRICOLE|CAISSE D.?EPARGNE|SOCIETE GENERALE|\bBNP\b|PARIBAS|CREDIT MUTUEL|\bCIC\b|\bLCL\b|CREDIT LYONNAIS|BANQUE POSTALE|\bHSBC\b|\bBRED\b|CREDIT DU NORD|BOURSORAMA|BANQUE DE SAVOIE|BANQUE RHONE|LYONNAISE DE BANQUE|\bCAISSE REGIONALE\b/;
const estBanqueTerminal = s => BANQUES_TERMINAUX.test(norm(s || "").toUpperCase());
function ajouterAlias(commercant, texte){
  if (estBanqueTerminal(texte)) return false;
  const cle = cleLibelle(texte);
  if (!cle || (commercant.alias || []).includes(cle)) return false;
  // L'alias est retiré d'une autre fiche qui le portait.
  for (const autre of vivants("commercants")) if (autre.id !== commercant.id && (autre.alias || []).includes(cle))
    enregistrer("commercants", Object.assign(autre, {alias: autre.alias.filter(a => a !== cle)}));
  commercant.alias = [...(commercant.alias || []), cle];
  enregistrer("commercants", commercant); invaliderIndex();
  return true;
}
function fusionnerCommercants(garde, absorbe){
  garde.alias = [...new Set([...(garde.alias || []), ...(absorbe.alias || [])])];
  for (const champ of ["stats", "natures", "titulaires"]){
    garde[champ] = garde[champ] || {};
    for (const [k, v] of Object.entries(absorbe[champ] || {})) garde[champ][k] = (garde[champ][k] || 0) + v;
  }
  enregistrer("commercants", garde);
  for (const op of vivants("operations")) if (op.commercant === absorbe.id) enregistrer("operations", Object.assign(op, {commercant: garde.id}));
  supprimer("commercants", absorbe.id); invaliderIndex();
}

/* ---------- Apprentissage ---------- */
function apprendre(op){
  const c = op.commercant ? obtenir("commercants", op.commercant) : null;
  if (!c || !op.categorie || op.categorie === "À préciser" || op.categorie === "Transfert") return;
  const cle = [op.categorie, op.sousCategorie || "", op.nature || "", op.lieu || ""].join("|");
  c.stats = c.stats || {}; c.stats[cle] = (c.stats[cle] || 0) + 1;
  if (op.natureExacte){ c.natures = c.natures || {}; c.natures[op.natureExacte] = (c.natures[op.natureExacte] || 0) + 1; }
  const titulaire = obtenir("comptes", op.compte)?.titulaire;
  if (titulaire){ c.titulaires = c.titulaires || {}; c.titulaires[titulaire] = (c.titulaires[titulaire] || 0) + 1; }
  recalculerDefaut(c);
  enregistrer("commercants", c);
}
/* Correction manuelle : la fiche adopte ce classement et ne le perd plus par la majorité. */
function apprendreCorrection(op){
  const c = op.commercant ? obtenir("commercants", op.commercant) : null;
  if (!c) return;
  Object.assign(c, {categorie: op.categorie, sousCategorie: op.sousCategorie || "", nature: op.nature || "", lieu: op.lieu || "", fixe: true});
  apprendre(op);
}
function recalculerDefaut(c){
  if (c.fixe) return;
  const entrees = Object.entries(c.stats || {}); const total = somme(entrees, e => e[1]);
  if (!total) return;
  entrees.sort((a, b) => b[1] - a[1]);
  const [cle, n] = entrees[0];
  if (n / total >= 0.7 && n >= 2){
    const [categorie, sousCategorie, nature, lieu] = cle.split("|");
    Object.assign(c, {categorie, sousCategorie, nature, lieu, variable: false});
  } else Object.assign(c, {categorie: "", sousCategorie: "", nature: "", lieu: "", variable: total >= 3});
}
function repartitionCommercant(c){
  const entrees = Object.entries(c.stats || {}); const total = somme(entrees, e => e[1]);
  return entrees.sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, n]) => {
    const [categorie, sousCategorie, nature, lieu] = k.split("|");
    return {categorie, sousCategorie, nature, lieu, part: n / total, n};
  });
}

/* ---------- Règles explicites ---------- */
function regleConvient(r, op){
  const texte = norm((op.libelle || "") + " " + (op.detail || "")).toUpperCase();
  if (r.contient && !norm(r.contient).toUpperCase().split("|").some(m => m && texte.includes(m.trim()))) return false;
  if (r.compte && op.compte !== r.compte) return false;
  if (r.sens === "debit" && op.montant >= 0) return false;
  if (r.sens === "credit" && op.montant <= 0) return false;
  const m = Math.abs(op.montant);
  if (r.montantMin != null && r.montantMin !== "" && m < Number(r.montantMin) - 0.005) return false;
  if (r.montantMax != null && r.montantMax !== "" && m > Number(r.montantMax) + 0.005) return false;
  const jour = +op.date.slice(8, 10);
  if (r.jourMin && jour < r.jourMin) return false;
  if (r.jourMax && jour > r.jourMax) return false;
  return true;
}
function reglesTriees(){ return vivants("regles").filter(r => r.active !== false).sort((a, b) => (b.priorite || 0) - (a.priorite || 0)); }

/* ---------- Tables de secours : code MCC et catégorie LCL ---------- */
const MCC = [
  [[5411, 5412, 5422, 5441, 5451, 5462, 5499, 5311, 5331], "Alimentation", "Courses"],
  [[5812, 5813, 5814], "Alimentation", "Restaurants et cafés"], [[5921], "Alimentation", "Vins et spiritueux"],
  [[5912, 8011, 8021, 8031, 8042, 8043, 8049, 8062, 8071, 8099], "Santé", "Soins et pharmacie"],
  [[5541, 5542, 5552], "Voiture", "Carburant et recharge"], [[4784], "Voiture", "Péages"], [[7523], "Voiture", "Stationnement"],
  [[7531, 7538, 5533], "Voiture", "Entretien"], [[4121], "Transports", "Taxis"], [[4111, 4112, 4131], "Transports", "Train et transports en commun"],
  [[7011, 3501], "Voyages", "Hôtels"], [[5611, 5621, 5631, 5651, 5655, 5661, 5691, 5699, 7210, 7216], "Habillement", "Vêtements, chaussures, pressing"],
  [[5192, 5942, 5994, 7832, 7922, 7991, 7996], "Culture et loisirs", "Livres, presse, sorties, jeux"],
  [[7230, 7298, 5977], "Soins personnels", "Beauté, parfumerie, coiffeur"],
  [[5200, 5211, 5231, 5251, 5261], "Maison", "Bricolage et jardin"], [[5992], "Maison", "Fleurs"],
  [[5722, 5732, 5712, 5719], "Maison", "Équipement, électroménager"], [[6011], "Espèces", "Retraits"]
];
const CATEGORIES_LCL = [
  [/restaurant/i, "Alimentation", "Restaurants et cafés"], [/epicerie|alimentation/i, "Alimentation", "Courses"],
  [/pharmacie|medecin|dentiste|sante/i, "Santé", "Soins et pharmacie"], [/journaux|loisirs|culture/i, "Culture et loisirs", "Livres, presse, sorties, jeux"],
  [/habillement/i, "Habillement", "Vêtements, chaussures, pressing"], [/automobile|carburant/i, "Voiture", "Carburant et recharge"],
  [/liquide/i, "Espèces", "Retraits"]
];
function classementSecours(op){
  if (op.mcc){ const n = +op.mcc; for (const [codes, c, s] of MCC) if (codes.includes(n)) return {categorie: c, sousCategorie: s, origine: "mcc"}; }
  if (op.categorieBanque){ for (const [re, c, s] of CATEGORIES_LCL) if (re.test(norm(op.categorieBanque))) return {categorie: c, sousCategorie: s, origine: "banque"}; }
  return null;
}

/* ---------- Décision ---------- */
/* Renvoie {categorie, sousCategorie, nature, lieu, origine, sur, suggestions} sans modifier l'opération. */
function proposerClassement(op){
  for (const r of reglesTriees()){
    if (regleConvient(r, op)) return {categorie: r.categorie, sousCategorie: r.sousCategorie || "", nature: r.nature || natureParDefaut(r.categorie),
      lieu: r.lieu || "", natureExacte: r.natureExacte || "", origine: "regle", regle: r.id, sur: true};
  }
  const c = op.commercant ? obtenir("commercants", op.commercant) : trouverCommercant(op.libelle);
  if (c && c.categorie){
    const rep = repartitionCommercant(c); const n = somme(rep, x => x.n);
    const sur = !!c.fixe || (rep[0] && rep[0].part >= 0.9 && n >= 3);
    return {categorie: c.categorie, sousCategorie: c.sousCategorie, nature: c.nature || natureParDefaut(c.categorie), lieu: c.lieu || "",
      origine: c.fixe ? "commercant" : "historique", sur, part: rep[0]?.part, n};
  }
  const sec = classementSecours(op);
  const suggestions = c ? repartitionCommercant(c) : [];
  if (sec) return Object.assign(sec, {nature: natureParDefaut(sec.categorie), lieu: c?.lieu || "", sur: false, suggestions});
  return {categorie: "À préciser", sousCategorie: "À préciser", nature: op.montant > 0 ? "Revenu" : "Courante", lieu: "", origine: "inconnu", sur: false, suggestions};
}
function natureParDefaut(categorie){
  if (categorie === "Revenus") return "Revenu";
  if (["Transfert", "Épargne", "Patrimoine"].includes(categorie)) return "Hors budget";
  return "Courante";
}
/* Applique la proposition ; statut « classe » si elle est sûre, « propose » sinon. */
function classerAutomatiquement(op){
  if (op.verrou) return op;
  if (!op.commercant){ const c = assurerCommercant(op.libelle); if (c) op.commercant = c.id; }
  const p = proposerClassement(op);
  Object.assign(op, {categorie: p.categorie, sousCategorie: p.sousCategorie, nature: p.nature, origine: p.origine,
    statut: p.categorie === "À préciser" ? "a_preciser" : (p.sur ? "classe" : "propose")});
  if (p.lieu && !op.lieu) op.lieu = p.lieu;
  if (p.natureExacte && !op.natureExacte) op.natureExacte = p.natureExacte;
  if (p.categorie && p.categorie !== "À préciser") ajouterCategorieSilencieuse(p.categorie, p.sousCategorie);
  return op;
}
function ajouterCategorieSilencieuse(cat, sous){
  const cats = LIVRE.parametres.categories;
  if (cats[cat] && (!sous || cats[cat].includes(sous))) return;
  ajouterCategorie(cat, sous);
}
/* Validation (par l'utilisateur) d'un classement : verrouille l'opération et nourrit la fiche. */
function validerClassement(op, corrige){
  op.statut = "classe"; op.verrou = true;
  if (corrige) apprendreCorrection(op); else apprendre(op);
  enregistrer("operations", op);
}

/* ===== 08-lecture-fichiers.js ===== */
/* ================= Lecture et reconnaissance des fichiers =================
   Chaque fichier déposé est reconnu (relevé, facture de cartes, valorisation,
   classeur de reprise, règles) et transformé en un objet neutre ; rien n'est
   enregistré ici. Tout est lu sur l'appareil. */

/* ---------- pdf.js, chargé à la demande ---------- */
let PDFJS = null;
async function chargerPdfjs(){
  if (PDFJS) return PDFJS;
  PDFJS = await import(new URL("vendor/pdfjs/pdf.min.mjs", location.href).href);
  // Adresse absolue : un chemin relatif serait résolu depuis le module, d'où « vendor/pdfjs/vendor/pdfjs/… ».
  PDFJS.GlobalWorkerOptions.workerSrc = new URL("vendor/pdfjs/pdf.worker.min.mjs", location.href).href;
  return PDFJS;
}
/* Texte d'un PDF, ligne par ligne (les fragments sont regroupés par ordonnée). */
async function textePdf(octets, motDePasse){
  const pdfjs = await chargerPdfjs();
  const doc = await pdfjs.getDocument({data: octets.slice(), password: motDePasse || undefined, isEvalSupported: false, disableFontFace: true}).promise;
  const pages = [];
  for (let p = 1; p <= doc.numPages; p++){
    const contenu = await (await doc.getPage(p)).getTextContent();
    const lignes = new Map();
    for (const it of contenu.items){
      if (!it.str) continue;
      const y = Math.round(it.transform[5] / 2);
      if (!lignes.has(y)) lignes.set(y, []);
      lignes.get(y).push({x: it.transform[4], t: it.str});
    }
    pages.push([...lignes.entries()].sort((a, b) => b[0] - a[0]).map(([, l]) => l.sort((a, b) => a.x - b.x).map(x => x.t).join(" ")).join("\n"));
  }
  await doc.destroy();
  return pages.join("\n\f\n").replace(/[   ]/g, " ").replace(/[ \t]+/g, " ");
}
class PdfProtege extends Error { constructor(){ super("PDF protégé par un mot de passe"); this.protege = true; } }

/* ---------- Point d'entrée ---------- */
async function lireFichier(fichier, motDePasse){
  const nom = fichier.name || "fichier";
  const ext = (nom.split(".").pop() || "").toLowerCase();
  const buffer = await fichier.arrayBuffer();
  const octets = new Uint8Array(buffer);
  if (ext === "csv" || ext === "txt") return lireCsv(nom, decoderTexte(buffer));
  if (ext === "xlsx" || ext === "xlsm") return lireXlsx(nom, buffer);
  if (ext === "json") return lireJson(nom, decoderTexte(buffer));
  if (ext === "pdf"){
    let texte;
    try { texte = await textePdf(octets, motDePasse); }
    catch (e){ if (e && (e.name === "PasswordException" || /password/i.test(e.message))) throw new PdfProtege(); throw e; }
    return reconnaitrePdf(nom, texte, octets);
  }
  if (/^(jpe?g|png|heic|webp)$/.test(ext)) return {genre: "image", nom, octets, mime: fichier.type || "image/jpeg"};
  return {genre: "inconnu", nom, raison: "format non reconnu (." + ext + ")"};
}

/* ---------- CSV ---------- */
function lireCsv(nom, texte){
  const lignes = analyserCSV(texte);
  if (!lignes.length) return {genre: "inconnu", nom, raison: "fichier vide"};
  const tete = lignes[0].map(x => norm(x).trim());
  if (tete[0] === "date" && tete[1] === "description" && tete[2] === "montant") return lireAmexCsv(nom, lignes);
  if (lignes[0].length <= 5 && /^\d{2}\/\d{2}\/\d{4}$/.test(lignes[0][0]) && /\d{5} \d{6}[A-Z]/.test(lignes[0][3] || "")) return lireLcl(nom, lignes);
  return {genre: "inconnu", nom, raison: "CSV non reconnu (ni export LCL, ni export Amex)"};
}

/* Export LCL : 1re ligne « date ; solde ; ; n° de compte », dernière ligne idem,
   entre les deux : date ; montant ; type ; n° chèque ; libellé ; libellé 2 ; code MCC ; catégorie LCL. */
function lireLcl(nom, lignes){
  const premiere = lignes[0], derniere = lignes[lignes.length - 1];
  const numero = (premiere[3] || "").trim();
  const corps = lignes.slice(1, -1).filter(l => /^\d{2}\/\d{2}\/\d{4}$/.test(l[0]));
  const ops = corps.map(l => ({
    date: lireDate(l[0]), montant: lireMontant(l[1]), type: propre(l[2]), cheque: propre(l[3]),
    libelle: propre([l[4], l[5]].filter(Boolean).join(" ")), mcc: (l[6] || "").trim(), categorieBanque: propre(l[7])
  })).filter(o => o.date && !isNaN(o.montant));
  const mCarte = nom.match(/_carte_(.+?)_(X\d{3,4})_du_(\d{2}-\d{2}-\d{4})_au_(\d{2}-\d{2}-\d{4})/i);
  const mPeriode = nom.match(/_du_(\d{2}-\d{2}-\d{4})_au_(\d{2}-\d{2}-\d{4})/);
  const periode = {debut: lireDate(premiere[0]), fin: lireDate(derniere[0])};
  if (mPeriode){ periode.debut = lireDate(mPeriode[1]); periode.fin = lireDate(mPeriode[2]); }
  const toutesCartes = ops.length && ops.every(o => o.type === "Carte");
  const total = somme(ops, o => versCentimes(o.montant));
  const encours = versCentimes(lireMontant(premiere[1]));
  if (mCarte || (toutesCartes && Math.abs(encours + total) < 1 && lireMontant(derniere[1]) === 0)){
    return {genre: "carte", banque: "LCL", nom, numero: numero.replace(/^\d{5} /, ""), carte: mCarte ? mCarte[2].toUpperCase() : "",
      libelleCarte: mCarte ? mCarte[1].replace(/_/g, " ").replace(/^Carte /i, "") : "", periode, encours: encours / 100,
      controle: {ok: Math.abs(encours + total) < 1, texte: "encours " + euros(encours / 100) + (Math.abs(encours + total) < 1 ? " = somme des lignes" : " ≠ somme des lignes " + euros(-total / 100))},
      lignes: ops};
  }
  return {genre: "compte", banque: "LCL", nom, numero: numero.replace(/^\d{5} /, ""), periode,
    soldeDebut: lireMontant(premiere[1]), soldeFin: lireMontant(derniere[1]), lignes: ops};
}

/* Export CSV Amex : Date,Description,Montant ; dates mm/jj/aaaa ; débit positif. */
function lireAmexCsv(nom, lignes){
  const ops = lignes.slice(1).filter(l => l[0]).map(l => ({date: lireDate(l[0], "mj"), montant: -lireMontant(l[2]), libelle: propre(l[1]), type: "Carte"}))
    .filter(o => o.date && !isNaN(o.montant));
  const dates = ops.map(o => o.date).sort();
  return {genre: "carte", banque: "Amex", nom, numero: "", carte: "AMEX", periode: {debut: dates[0], fin: dates[dates.length - 1]}, lignes: ops};
}

/* ---------- Classeurs ---------- */
async function lireXlsx(nom, buffer){
  const c = await lireClasseur(buffer);
  if (c.feuilles["Opérations"] && c.feuilles["Synthèse"]) return {genre: "reprise_v7", nom, classeur: c};
  for (const n of c.noms){
    const m = c.feuilles[n];
    const iTete = m.findIndex(l => l && norm(l[0]) === "date" && norm(l[1]) === "description" && /montant/.test(norm(l[2])));
    if (iTete >= 0){
      const t = m[iTete].map(x => norm(x));
      const iRef = t.indexOf("reference"), iVille = t.indexOf("ville");
      const ops = m.slice(iTete + 1).filter(l => l && l[0] && l[2] !== null && l[2] !== undefined).map(l => ({
        date: typeof l[0] === "number" ? dateExcel(l[0]) : lireDate(l[0], "mj"), montant: -lireMontant(l[2]), libelle: propre(l[1]),
        ville: iVille >= 0 ? propre(l[iVille]) : "", reference: iRef >= 0 ? String(l[iRef] || "") : "", categorieBanque: propre(l[t.indexOf("categorie")] || ""), type: "Carte"
      })).filter(o => o.date && !isNaN(o.montant));
      const dates = ops.map(o => o.date).sort();
      return {genre: "carte", banque: "Amex", nom, numero: "", carte: "AMEX", periode: {debut: dates[0], fin: dates[dates.length - 1]}, lignes: ops};
    }
  }
  return {genre: "inconnu", nom, raison: "classeur non reconnu"};
}
function lireJson(nom, texte){
  let o; try { o = JSON.parse(texte); } catch (e) { return {genre: "inconnu", nom, raison: "JSON illisible"}; }
  if (o.format === "budget-foyer-regles") return {genre: "regles", nom, contenu: o};
  if (o.format === "budget-foyer-plan") return {genre: "plan", nom, contenu: o};
  return {genre: "inconnu", nom, raison: "JSON non reconnu"};
}

/* ---------- PDF : factures de cartes et relevés de valorisation ---------- */
const reMontant = "(-?\\d[\\d .]*,\\d{2})";
const MOIS_TEXTE = {janvier: 1, fevrier: 2, mars: 3, avril: 4, mai: 5, juin: 6, juillet: 7, aout: 8, septembre: 9, octobre: 10, novembre: 11, decembre: 12};
function dateTexte(t){
  const m = norm(t).match(/(\d{1,2})(?:er)? ([a-z]+) (\d{4})/);
  if (m && MOIS_TEXTE[m[2]]) return `${m[3]}-${pad2(MOIS_TEXTE[m[2]])}-${pad2(m[1])}`;
  return lireDate(t);
}
function premier(texte, re){ const m = texte.match(re); return m ? m[1].trim() : ""; }

function reconnaitrePdf(nom, texte, octets){
  const T = texte; const N = norm(texte);
  const base = {nom, texte: T, octets};
  // Facture des cartes LCL (« RELEVE CB AU jj/mm/aa »)
  if (/RELEVE CB AU/.test(T) && /DIFFERE|Montant/i.test(T)){
    return Object.assign(base, {genre: "facture_cb", banque: "LCL",
      montant: Math.abs(lireMontant(premier(T, new RegExp("Montant\\s*" + reMontant)))),
      arrete: lireDate(premier(T, /RELEVE CB AU (\d{2}\/\d{2}\/\d{2,4})/)),
      dateDebit: lireDate(premier(T, /Date de l.op[ée]ration\s*(\d{2}\/\d{2}\/\d{4})/)),
      dateValeur: lireDate(premier(T, /Date de valeur\s*(\d{2}\/\d{2}\/\d{4})/)),
      numero: premier(T, /Compte\s+\d{5}\s?(\d{6}[A-Z])/)});
  }
  const fn = nom.match(/^([A-Z]+)_(\d{11})_(\d{8})/);
  // Livrets LCL (relevé annuel)
  if (fn && /^LIVRET/.test(fn[1]) && /SOLDE EN EUROS/.test(T)){
    return Object.assign(base, {genre: "valorisation", etablissement: "LCL", typeCompte: "livret",
      produit: /DEVDURABLE/.test(fn[1]) ? "Livret de développement durable et solidaire" : (fn[1] === "LIVRETA" ? "Livret A" : fn[1]),
      numero: fn[2].slice(5), date: `${fn[3].slice(0, 4)}-${fn[3].slice(4, 6)}-${fn[3].slice(6, 8)}`,
      valeur: lireMontant(premier(T, new RegExp("SOLDE EN EUROS\\s*" + reMontant)))});
  }
  // PEA LCL : relevé du compte espèces avec l'évaluation globale
  if (/Evaluation globale de votre PEA/i.test(T)){
    return Object.assign(base, {genre: "valorisation", etablissement: "LCL", typeCompte: "pea", produit: "PEA",
      numero: fn ? fn[2].slice(5) : "", date: lireDate(premier(T, /PEA au (\d{2}\/\d{2}\/\d{4})/)) || (fn ? `${fn[3].slice(0, 4)}-${fn[3].slice(4, 6)}-${fn[3].slice(6, 8)}` : null),
      valeur: lireMontant(premier(T, /Evaluation globale de votre PEA\s*:\s*([\d.,\s]+)\s*euros/i)),
      versements: lireMontant(premier(T, /Cumul des versements depuis l.ouverture\s*:\s*([\d.,\s]+)\s*euros/i))});
  }
  // Relevé de valeurs mobilières (portefeuille titres)
  if (/RELEVE DE VALEURS MOBILIERES/.test(T) && /EVALUATION TOTALE/.test(T)){
    const lignes = [];
    for (const m of T.matchAll(/(\d[\d ]*?) [CNP] \d [A-Z]\s+([\d,]+)\s*([A-Z][A-Z0-9 .'&-]+?) ([A-Z]{2}\d{9}[0-9A-Z])\s+([\d,]+)\s+([\d ]+,\d{2})/g))
      lignes.push({quantite: lireMontant(m[1]), prixRevient: lireMontant(m[2]), titre: m[3].trim(), isin: m[4], cours: lireMontant(m[5]), valeur: lireMontant(m[6])});
    const surPea = /plan d.[ée]pargne en actions/i.test(T);
    return Object.assign(base, {genre: "valorisation", etablissement: "LCL", typeCompte: surPea ? "pea" : "titres", produit: surPea ? "PEA" : "Compte-titres",
      numero: premier(T, /\d{5}-(\d{6}[A-Z])/), date: lireDate(premier(T, /[ée]tabli au (\d{2}\/\d{2}\/\d{4})/)),
      valeur: lireMontant(premier(T, new RegExp("EVALUATION TOTALE\\s*" + reMontant))), lignes, partiel: surPea});
  }
  // Assurance-vie, relevé trimestriel (« valeur de votre adhésion »)
  if (/valeur de votre adh[ée]sion s.[ée]l[èe]ve/i.test(T)){
    return Object.assign(base, {genre: "valorisation", etablissement: premier(T, /Assureur\s*:\s*([A-Za-zÀ-ÿ ]+?)\s*(?:N°|\n)/) || "Assurance-vie", typeCompte: "assurance_vie",
      produit: premier(T, /adh[ée]sion au contrat (.+?) formule/i) || "Assurance-vie",
      numero: premier(T, /N° Adh[ée]sion\s*:\s*([\d ]+[A-Z])/).replace(/\s/g, ""),
      date: dateTexte(premier(T, /relev[ée] trimestriel au (\d{1,2}(?:er)? \S+ \d{4})/i)),
      valeur: lireMontant(premier(T, /valeur de votre adh[ée]sion s.[ée]l[èe]ve [àa]\s*([\d .,]+)\s*euros/i))});
  }
  // Contrat de retraite (« valeur de transfert »)
  if (/Valeur de transfert/i.test(T)){
    return Object.assign(base, {genre: "valorisation", etablissement: premier(T, /^(.+?)\n/) || "Assureur", typeCompte: "retraite",
      produit: premier(T, /adh[ée]sion ([\s\S]{3,80}?)\.\s*Vous/i).replace(/\s+/g, " ") || "Contrat retraite",
      numero: premier(T, /num[ée]ro de contrat\s*(\w+)/i), date: lireDate(premier(T, /SITUATION DE VOTRE CONTRAT AU (\d{2}\.\d{2}\.\d{4})/)),
      valeur: lireMontant(premier(T, new RegExp("Valeur de transfert\\s*\\(\\d\\)\\s*" + reMontant))),
      renteMinimale: lireMontant(premier(T, new RegExp("au terme\\s*\\(\\d\\)\\s*" + reMontant)))});
  }
  // Épargne disponible (valeur de rachat) d'un contrat d'assurance
  if (/Epargne disponible \(valeur de rachat\)/i.test(T)){
    return Object.assign(base, {genre: "valorisation", etablissement: premier(T, /^(.+?)\n/) || "Assureur", typeCompte: "assurance_vie",
      produit: premier(T, /adh[ée]sion ([A-Z][A-Z ]+?)\. Vous/) || "Contrat d'assurance",
      numero: premier(T, /num[ée]ro de contrat\s*(\w+)/i), date: lireDate(premier(T, /SITUATION DE VOTRE CONTRAT AU (\d{2}\.\d{2}\.\d{4})/)),
      valeur: lireMontant(premier(T, new RegExp("Epargne disponible \\(valeur de rachat\\)\\s*" + reMontant, "i"))),
      cotisation: lireMontant(premier(T, new RegExp("Cotisation [A-Z]+\\s*" + reMontant)))});
  }
  // Contrat vie entière (prévoyance) avec valeur de rachat
  if (/Valeur de rachat/i.test(T) && /VIE ENTIERE|capital de/i.test(T)){
    return Object.assign(base, {genre: "valorisation", etablissement: premier(T, /^(.+?)\n/) || "Assureur", typeCompte: "prevoyance",
      produit: premier(T, /Contrat ([A-Z][A-Z ]*?)\s{0,2}(?:m |En)/) || "Contrat vie entière",
      numero: premier(T, /n° de contrat\s*:\s*(\w+)/i), date: lireDate(premier(T, /avant le (\d{2}\/\d{2}\/\d{4})/)) || null,
      valeur: lireMontant(premier(T, new RegExp("Valeur de rachat\\s*" + reMontant))),
      capitalDeces: lireMontant(premier(T, new RegExp("capital de\\s*" + reMontant)))});
  }
  // Avis d'opéré (vente ou achat de titres)
  if (/AVIS DE (VENTE|ACHAT) DE VALEURS MOBILIERES/.test(T)){
    const m = T.match(/(Vente|Achat) de (\d[\d ]*) (.+?) \(code ([A-Z0-9]{12})\)/);
    return Object.assign(base, {genre: "document", sousGenre: "avis_opere", sens: m ? m[1] : "", quantite: m ? lireMontant(m[2]) : null, titre: m ? m[3] : "",
      isin: m ? m[4] : "", montant: lireMontant(premier(T, /cr[ée]dit[ée] en date du \d{2}\/\d{2}\/\d{4} de ([\d .,]+) EUR/)),
      date: lireDate(premier(T, /en date du (\d{2}\/\d{2}\/\d{4})/))});
  }
  if (/^COMPTEDEDEPOTS_/.test(nom)) return Object.assign(base, {genre: "inconnu", raison: "relevé de compte PDF : importez plutôt l'export CSV du compte (plus complet)"});
  // Pièce justificative (facture, ticket)
  return Object.assign(base, {genre: "justificatif_pdf"});
}

/* ===== 09-import.js ===== */
/* ================= Intégration des fichiers lus dans le livre =================
   preparer…() calcule un aperçu (nouvelles lignes, doublons écartés, contrôles)
   sans rien écrire ; appliquer…() enregistre. Dédoublonnage par empreinte :
   compte + date + montant + libellé normalisé + rang d'occurrence dans le fichier. */

const cleEmpreinte = libelle => norm(libelle).toUpperCase().replace(/[^A-Z0-9]/g, "");
function empreintes(compteId, lignes){
  const rangs = new Map();
  return lignes.map(l => {
    const base = [compteId, l.date, versCentimes(l.montant), cleEmpreinte(l.libelle)].join("|");
    const r = (rangs.get(base) || 0) + 1; rangs.set(base, r);
    return base + "|" + r;
  });
}
function indexEmpreintes(){
  const m = new Map();
  for (const op of vivants("operations")) if (op.empreinte) m.set(op.empreinte, op);
  return m;
}
/* LCL double chaque ligne carte de l'export du compte : on garde ceil(n/2) exemplaires des lignes identiques. */
function dedoublonnerCartesLcl(lignes){
  const groupes = regrouper(lignes, l => [l.date, versCentimes(l.montant), l.libelle].join("|"));
  const r = [];
  for (const g of groupes.values()) r.push(...g.slice(0, Math.ceil(g.length / 2)));
  return {gardees: r, ecartees: lignes.length - r.length};
}

/* ---------- Comptes : recherche et création ---------- */
function trouverCompte(critere){
  return vivants("comptes").find(c =>
    (critere.carte && c.carte === critere.carte && (!critere.banque || c.banque === critere.banque)) ||
    (!critere.carte && critere.numero && c.numero === critere.numero && c.type === (critere.type || c.type)) ||
    (critere.id && c.id === critere.id)) || null;
}
function compteCourantLcl(numero){ return vivants("comptes").find(c => c.type === "courant" && c.banque === "LCL" && (!numero || c.numero === numero)); }
function compteCartesNonVentilees(debit){
  let c = vivants("comptes").find(x => x.type === "carte" && x.carte === "LCL-NV");
  if (!c) c = enregistrer("comptes", {nom: "Cartes LCL (sans titulaire)", type: "carte", banque: "LCL", carte: "LCL-NV", compteDebit: debit || "", actif: true,
    note: "Lignes carte venues de l'export du compte, avant les exports par carte."});
  return c;
}
/* Proposition de compte à créer pour un fichier dont le compte est inconnu. */
function compteAProposer(lu){
  if (lu.genre === "compte") return {nom: "Compte " + lu.banque + " …" + lu.numero.slice(-4), type: "courant", banque: lu.banque, numero: lu.numero, titulaire: "Joint"};
  if (lu.genre === "carte" && lu.banque === "Amex") return {nom: "Amex", type: "carte", banque: "Amex", carte: "AMEX", compteDebit: compteCourantLcl()?.id || ""};
  if (lu.genre === "carte") return {nom: "Carte " + (lu.libelleCarte || "LCL") + " " + lu.carte, type: "carte", banque: lu.banque, carte: lu.carte, numero: lu.numero,
    compteDebit: compteCourantLcl(lu.numero)?.id || ""};
  if (lu.genre === "valorisation") return {nom: lu.produit + (lu.numero ? " …" + String(lu.numero).slice(-4) : ""), type: lu.typeCompte, banque: lu.etablissement, numero: lu.numero || ""};
  return null;
}
function compteDuFichier(lu){
  if (lu.genre === "compte") return trouverCompte({numero: lu.numero, type: "courant"});
  if (lu.genre === "carte") return trouverCompte({carte: lu.carte, banque: lu.banque});
  if (lu.genre === "valorisation"){
    return vivants("comptes").find(c => lu.numero && c.numero && String(c.numero).replace(/\s/g, "") === String(lu.numero).replace(/\s/g, ""))
      || vivants("comptes").find(c => !lu.numero && c.type === lu.typeCompte && norm(c.produit || c.nom).includes(norm(lu.produit))) || null;
  }
  if (lu.genre === "facture_cb") return compteCourantLcl(lu.numero) || compteCourantLcl();
  return null;
}

/* ---------- Relevés (compte courant ou carte) ---------- */
function preparerReleve(lu, compte){
  const idx = indexEmpreintes();
  const res = {lu, compte, nouvelles: [], deja: [], ecartees: [], reattribuees: [], controles: []};
  let lignes = lu.lignes.slice();
  if (lu.genre === "compte" && lu.banque === "LCL"){
    const cartes = lignes.filter(l => l.type === "Carte");
    lignes = lignes.filter(l => l.type !== "Carte");
    // Lignes carte : écartées si les exports par carte couvrent leur date, sinon gardées (dédoublonnées) sur le compte « sans titulaire ».
    const couvertes = periodesCartes();
    const aGarder = [];
    for (const l of cartes) (couvertes.some(p => l.date >= p.debut && l.date <= p.fin) ? res.ecartees : aGarder).push(l);
    const d = dedoublonnerCartesLcl(aGarder);
    res.doublonsLcl = d.ecartees;
    res.cartesSansTitulaire = d.gardees;
    // Contrôle du solde : solde initial + opérations hors carte + factures de cartes débitées = solde final
    const factures = vivants("factures").filter(f => f.compteDebit === compte?.id && f.dateDebit > lu.periode.debut && f.dateDebit <= lu.periode.fin);
    const calc = versCentimes(lu.soldeDebut) + somme(lignes, l => versCentimes(l.montant)) - somme(factures, f => versCentimes(f.montant));
    const ecart = versCentimes(lu.soldeFin) - calc;
    res.controles.push({ok: Math.abs(ecart) < 2, texte: Math.abs(ecart) < 2
      ? "solde " + euros(lu.soldeFin) + " (hors lignes carte, factures de cartes incluses)"
      : "écart de " + euros(ecart / 100) + " sur le solde : facture de cartes à importer ?"});
  }
  if (lu.genre === "carte" && lu.controle) res.controles.push(lu.controle);
  const cid = compte ? compte.id : "?";
  const emp = empreintes(cid, lignes);
  // Pour un export par carte : une ligne déjà venue de l'export du compte (compte « sans titulaire ») est réattribuée.
  const nv = lu.genre === "carte" && lu.banque === "LCL" ? vivants("comptes").find(c => c.carte === "LCL-NV") : null;
  const empNv = nv ? empreintes(nv.id, lignes) : [];
  lignes.forEach((l, i) => {
    if (idx.has(emp[i])) res.deja.push(l);
    else if (nv && idx.has(empNv[i])) res.reattribuees.push({ligne: l, op: idx.get(empNv[i]), empreinte: emp[i]});
    else res.nouvelles.push(Object.assign({}, l, {empreinte: emp[i]}));
  });
  if (res.cartesSansTitulaire?.length){
    const c = vivants("comptes").find(x => x.carte === "LCL-NV");
    const e2 = empreintes(c ? c.id : "LCL-NV", res.cartesSansTitulaire);
    res.cartesSansTitulaire = res.cartesSansTitulaire.map((l, i) => Object.assign({}, l, {empreinte: e2[i]})).filter(l => !idx.has(l.empreinte));
  }
  for (const n of res.nouvelles) n.proposition = proposerClassement({libelle: n.libelle, montant: n.montant, date: n.date, compte: cid, mcc: n.mcc, categorieBanque: n.categorieBanque});
  return res;
}
function periodesCartes(){
  return vivants("imports").filter(i => i.genre === "carte" && i.banque === "LCL").map(i => i.periode);
}
function creerOperation(compte, l, importId){
  const op = {compte: compte.id, date: l.date, montant: Math.round(l.montant * 100) / 100, libelle: l.libelle, detail: l.detail || "", type: l.type || "",
    mcc: l.mcc || "", categorieBanque: l.categorieBanque || "", ville: l.ville || "", empreinte: l.empreinte, import: importId, justificatifs: []};
  if (compte.type === "carte") op.dateDebit = null; else op.dateDebit = l.date;
  classerAutomatiquement(op);
  return enregistrer("operations", op);
}
function appliquerReleve(prep){
  const imp = enregistrer("imports", {genre: prep.lu.genre, banque: prep.lu.banque, fichier: prep.lu.nom, compte: prep.compte.id, periode: prep.lu.periode,
    date: new Date().toISOString(), nouvelles: prep.nouvelles.length, deja: prep.deja.length});
  for (const l of prep.nouvelles) creerOperation(prep.compte, l, imp.id);
  for (const r of prep.reattribuees) enregistrer("operations", Object.assign(r.op, {compte: prep.compte.id, empreinte: r.empreinte}));
  if (prep.cartesSansTitulaire?.length){
    const nv = compteCartesNonVentilees(prep.compte.id);
    // Empreintes recalculées avec l'identifiant réel du compte (il peut naître ici).
    const idx = indexEmpreintes();
    const emp = empreintes(nv.id, prep.cartesSansTitulaire);
    prep.cartesSansTitulaire.forEach((l, i) => { if (!idx.has(emp[i])) creerOperation(nv, Object.assign({}, l, {empreinte: emp[i]}), imp.id); });
  }
  if (prep.lu.genre === "compte"){
    enregistrer("soldes", {compte: prep.compte.id, date: prep.lu.periode.debut, solde: prep.lu.soldeDebut, source: prep.lu.nom, debut: true});
    enregistrer("soldes", {compte: prep.compte.id, date: prep.lu.periode.fin, solde: prep.lu.soldeFin, source: prep.lu.nom});
  }
  apresImport();
  return imp;
}

/* ---------- Factures des cartes LCL ---------- */
function preparerFacture(lu, compte){
  const deja = vivants("factures").find(f => f.arrete === lu.arrete && f.compteDebit === compte?.id);
  const precedente = vivants("factures").filter(f => f.compteDebit === compte?.id && f.arrete < lu.arrete).sort((a, b) => a.arrete < b.arrete ? 1 : -1)[0];
  // Achats du lendemain de la fin de période précédente jusqu'à la fin de période (deux jours ouvrés avant l'arrêté).
  // Sans facture précédente : la période précédente est supposée close à la fin du mois d'avant.
  const fin = finPeriodeCarte(lu.arrete);
  const debut = ajouterJours(precedente ? (precedente.finPeriode || finPeriodeCarte(precedente.arrete)) : finPeriodeCarte(dernierJourOuvre(ajouterMois(debutDeMois(lu.arrete), -1))), 1);
  const cartes = vivants("comptes").filter(c => c.type === "carte" && c.banque === "LCL" && (c.compteDebit === compte?.id || !c.compteDebit));
  const ops = vivants("operations").filter(o => cartes.some(c => c.id === o.compte) && o.date >= debut && o.date <= fin && (deja ? (!o.facture || o.facture === deja.id) : (!o.facture && (!o.dateDebit || o.debitEstime))));
  const total = -somme(ops, o => versCentimes(o.montant)) / 100;
  const parCarte = cartes.map(c => ({compte: c, total: -somme(ops.filter(o => o.compte === c.id), o => versCentimes(o.montant)) / 100})).filter(x => x.total);
  return {lu, compte, deja, debut, fin, ops, total, parCarte, ecart: Math.round((lu.montant - total) * 100) / 100};
}
function appliquerFacture(prep){
  const f = enregistrer("factures", Object.assign(prep.deja || {}, {arrete: prep.lu.arrete, dateDebit: prep.lu.dateDebit, dateValeur: prep.lu.dateValeur,
    montant: prep.lu.montant, compteDebit: prep.compte.id, fichier: prep.lu.nom, ecart: prep.ecart, debutPeriode: prep.debut, finPeriode: prep.fin}));
  for (const o of prep.ops) enregistrer("operations", Object.assign(o, {dateDebit: prep.lu.dateDebit, debitEstime: false, facture: f.id}));
  const empreinte = "facture|" + prep.compte.id + "|" + prep.lu.arrete;
  if (!vivants("operations").some(o => o.empreinte === empreinte)){
    enregistrer("operations", {compte: prep.compte.id, date: prep.lu.dateDebit, dateDebit: prep.lu.dateDebit, montant: -prep.lu.montant,
      libelle: "RELEVE CB AU " + dateFr(prep.lu.arrete), categorie: "Transfert", sousCategorie: "Facture cartes", nature: "Hors budget",
      statut: "classe", verrou: true, origine: "facture", facture: f.id, empreinte, justificatifs: []});
  }
  apresImport();
  return f;
}

/* ---------- Valorisations ---------- */
function appliquerValorisation(lu, compte){
  const deja = vivants("valorisations").find(v => v.compte === compte.id && v.date === lu.date);

/* ---------- Après chaque import : transferts, débits différés, rapprochements ---------- */
function apresImport(){
  apparierTransferts();
  affecterDebitsAmex();
  estimerDebitsCartes();
  rapprocherTout();
}
/* Prélèvement Amex sur le compte courant ↔ paiement reçu sur le compte Amex ; virements entre comptes du foyer. */
function apparierTransferts(){
  const ops = vivants("operations");
  const libres = ops.filter(o => !o.lien && (o.categorie === "Transfert" || /AMERICAN EXPRESS|PRELEVEMENT AUTOMATIQUE/i.test(o.libelle)));
  for (const a of libres){
    if (a.lien || a.montant >= 0) continue;
    const b = libres.find(x => !x.lien && x !== a && x.compte !== a.compte && versCentimes(x.montant) === -versCentimes(a.montant) && Math.abs(ecartJours(a.date, x.date)) <= 5);
    if (!b) continue;
    for (const [o, autre] of [[a, b], [b, a]]){
      Object.assign(o, {lien: autre.id, categorie: "Transfert", sousCategorie: /AMERICAN|AMEX|PRELEVEMENT AUTOMATIQUE/i.test(a.libelle + b.libelle) ? "Paiement Amex" : "Virement entre comptes",
        nature: "Hors budget", statut: "classe"});
      enregistrer("operations", o);
    }
  }
}
/* Date de débit des achats Amex : au prélèvement, les achats non encore débités dont la somme égale le montant prélevé. */
function affecterDebitsAmex(){
  const amex = vivants("comptes").find(c => c.carte === "AMEX"); if (!amex) return;
  const paiements = vivants("operations").filter(o => o.compte === amex.id && o.montant > 0 && o.lien).sort((a, b) => a.date < b.date ? -1 : 1);
  for (const p of paiements){
    const prlv = obtenir("operations", p.lien); if (!prlv) continue;
    if (vivants("operations").some(o => o.compte === amex.id && o.paiementAmex === p.id)) continue;
    const achats = vivants("operations").filter(o => o.compte === amex.id && !o.dateDebit && o.date <= prlv.date && o.id !== p.id && !(o.montant > 0 && o.lien))
      .sort((a, b) => a.date < b.date ? -1 : 1);
    let cumul = 0, n = -1;
    for (let i = 0; i < achats.length; i++){ cumul += -versCentimes(achats[i].montant); if (Math.abs(cumul - versCentimes(p.montant)) <= 100){ n = i; break; } }
    if (n < 0) continue;
    for (const o of achats.slice(0, n + 1)) enregistrer("operations", Object.assign(o, {dateDebit: prlv.date, paiementAmex: p.id}));
  }
}

/* Achats carte repris d'un historique, sans facture ni prélèvement rattachés : date de débit estimée (debitEstime).
   Cartes LCL : facture au dernier jour ouvré du mois, pour les achats jusqu'à deux jours ouvrés plus tôt ; au-delà, mois suivant.
   Amex : chaque prélèvement « American Express » du compte de débit solde, dans l'ordre, les achats les plus anciens
   dont la somme lui est égale (à 1 € près) ; un achat ancien resté seul va au prélèvement qui le suit.
   Un débit postérieur à la dernière donnée connue reste « à venir » : c'est l'encours. Renvoie le nombre d'opérations modifiées. */
/* Achats (triés par date) d'une suite de jours dont la somme vaut cible (centimes, positive) ; le dernier jour
   peut n'être pris qu'en partie. Renvoie la liste retenue, ou null. */
function suiteSoldee(cand, cible){
  const jours = [...new Set(cand.map(o => o.date))].sort();
  const par = Object.fromEntries(jours.map(d => [d, cand.filter(o => o.date === d)]));
  const sousEnsembles = l => {
    if (l.length > 8) return [l];
    const r = [];
    for (let m = (1 << l.length) - 1; m > 0; m--) r.push(l.filter((_, i) => m & (1 << i)));
    return r.sort((a, b) => b.length - a.length);
  };
  const total = l => somme(l, o => -versCentimes(o.montant));
  for (const tol of [1, 100]){
    for (let e = jours.length - 1; e >= 0; e--){
      const fins = sousEnsembles(par[jours[e]]).map(l => ({l, t: total(l)}));
      let base = 0, pleins = [];
      for (let s = e; s >= 0; s--){
        if (s < e){ base += total(par[jours[s]]); pleins = par[jours[s]].concat(pleins); }
        const f = fins.find(x => Math.abs(base + x.t - cible) < tol);
        if (f) return pleins.concat(f.l);
      }
    }
  }
  return null;
}
function estimerDebitsCartes(){
  const ops = vivants("operations");
  const fin = ops.reduce((m, o) => o.date > m ? o.date : m, "");
  const visee = o => o.origine === "reprise" && !o.facture && !o.paiementAmex && !(o.lien && o.montant > 0)
    && (!o.dateDebit || o.debitEstime || o.dateDebit === o.date);
  const parDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
  const voulu = new Map();
  for (const c of vivants("comptes").filter(c => c.type === "carte")){
    const achats = ops.filter(o => o.compte === c.id && visee(o)).sort(parDate);
    if (c.banque === "LCL"){
      for (const o of achats){
        let a = dernierJourOuvre(o.date);
        if (o.date > finPeriodeCarte(a)) a = dernierJourOuvre(ajouterMois(debutDeMois(o.date), 1));
        voulu.set(o, a <= fin ? a : null);
      }
    } else if (c.carte === "AMEX"){
      // Chaque prélèvement solde les achats d'une suite de jours des 45 jours qui le précèdent, de somme égale
      // (au centime, puis à 1 € près) ; le dernier jour peut n'être pris qu'en partie (arrêté en cours de
      // journée). La suite qui finit le plus tard est retenue. Le prélèvement du relevé antérieur au début
      // des données n'a pas ses achats : il reste sans correspondance.
      const prlvs = ops.filter(o => o.compte === c.compteDebit && o.montant < 0 && /AMERICAN EXPRESS/i.test(o.libelle)).sort(parDate);
      let reste = achats.slice();
      for (const p of prlvs){
        const choix = suiteSoldee(reste.filter(o => o.date < p.date && o.date >= ajouterJours(p.date, -45)), -versCentimes(p.montant));
        if (!choix) continue;
        for (const o of choix) voulu.set(o, p.date);
        reste = reste.filter(o => !voulu.has(o));
      }
      // Achats restés seuls : au prélèvement qui les suit s'ils sont anciens ; les plus récents forment l'encours.
      const dernier = prlvs.length ? prlvs[prlvs.length - 1].date : null;
      for (const o of reste){
        const suivant = dernier && o.date < ajouterJours(dernier, -40) ? prlvs.find(p => p.date > o.date) : null;
        voulu.set(o, suivant ? suivant.date : null);
      }
    }
  }
  let n = 0;
  for (const [o, d] of voulu){
    if ((o.dateDebit || null) === d && !!o.debitEstime === !!d) continue;
    enregistrer("operations", Object.assign(o, {dateDebit: d, debitEstime: !!d})); n++;
  }
  return n;
}

/* ---------- Plan importé d'un fichier JSON : budgets, échéances et règles ----------
   Un budget de même nom et de même année est remplacé ; une échéance de même libellé et de
   même date de début aussi. Rien d'autre n'est modifié. */
function appliquerPlan(contenu){
  const r = {budgets: 0, echeances: 0, regles: 0};
  for (const b of contenu.budgets || []){
    for (const l of b.lignes || []){ if (!l.id) l.id = "lb-" + idAleatoire(8); ajouterCategorieSilencieuse(l.categorie, l.sousCategorie); }
    for (const lx of Object.keys(b.lignes?.[0]?.repartition || {})) ajouterLieu(lx);
    for (const l of b.lignes || []) if (l.nature && !LIVRE.parametres.natures.includes(l.nature)) modifierParametres({natures: [...LIVRE.parametres.natures, l.nature]});
    const existant = vivants("budgets").find(x => x.nom === b.nom && x.annee === b.annee);
    if (!existant && b.actif) for (const autre of vivants("budgets").filter(x => x.annee === b.annee && x.actif)) enregistrer("budgets", Object.assign(autre, {actif: false}));
    enregistrer("budgets", Object.assign(existant || {}, b)); r.budgets++;
  }
  const courant = obtenir("comptes", LIVRE.parametres.compteTresorerie) || comptesDeType("courant")[0];
  for (let e of contenu.echeances || []){
    // « remplace » : libellé et date d'une échéance existante à reprendre (date ou libellé modifiés).
    const cle = e.remplace || e; e = Object.assign({}, e); delete e.remplace;
    const existant = vivants("echeances").find(x => x.libelle === cle.libelle && x.debut === cle.debut);
    if (e.categorie) ajouterCategorieSilencieuse(e.categorie, e.sousCategorie);
    enregistrer("echeances", Object.assign(existant || {}, {compte: courant?.id || ""}, e)); r.echeances++;
  }
  // Comptes (ex. compte-titres) et leurs valorisations datées ; un compte de même nom et de même type est repris.
  for (const cp of contenu.comptes || []){
    const {valorisations, ...champs} = cp;
    const existant = vivants("comptes").find(x => x.nom === cp.nom && x.type === cp.type);
    const compte = enregistrer("comptes", Object.assign(existant || {actif: true}, champs));
    for (const v of valorisations || []){
      const deja = vivants("valorisations").find(x => x.compte === compte.id && x.date === v.date);
      enregistrer("valorisations", Object.assign(deja || {}, {compte: compte.id, date: v.date, valeur: v.valeur, source: v.source || "plan"}));
    }
    r.comptes = (r.comptes || 0) + 1;
  }
  // Catégories et sous-catégories à créer : {"Catégorie": ["Sous-catégorie", …]}
  for (const [cat, sous] of Object.entries(contenu.categories || {})){ for (const s of sous) ajouterCategorieSilencieuse(cat, s); r.categories = (r.categories || 0) + sous.length; }
  if (contenu.regles?.length || contenu.commercants?.length) r.regles = appliquerRegles({regles: contenu.regles || [], commercants: contenu.commercants || []});
  // Reclassement ciblé d'opérations déjà enregistrées, désignées par date, montant et, au besoin, libellé
  for (const x of contenu.reclasser || []){
    const cibles = vivants("operations").filter(o => o.date === x.date && Math.abs(o.montant - x.montant) < 0.005 && (!x.contient || norm(o.libelle + " " + (o.detail || "")).toUpperCase().includes(norm(x.contient).toUpperCase())));
    for (const o of cibles) enregistrer("operations", Object.assign(o, {categorie: x.categorie, sousCategorie: x.sousCategorie || "", nature: x.nature || o.nature, statut: "classe", verrou: true}, x.lieu ? {lieu: x.lieu} : {}, x.natureExacte ? {natureExacte: x.natureExacte} : {}));
    if (x.categorie) ajouterCategorieSilencieuse(x.categorie, x.sousCategorie);
    r.reclassees = (r.reclassees || 0) + cibles.length;
  }
  return r;
}

/* ---------- Règles importées d'un fichier JSON ---------- */
function appliquerRegles(contenu){
  let n = 0;
  for (const r of contenu.regles || []){
    const existante = vivants("regles").find(x => x.nom === r.nom);
    enregistrer("regles", Object.assign(existante || {}, r, {active: r.active !== false}));
    if (r.categorie) ajouterCategorieSilencieuse(r.categorie, r.sousCategorie);
    if (r.lieu) ajouterLieu(r.lieu);
    n++;
  }
  for (const c of contenu.commercants || []){
    const fiche = assurerCommercant(c.alias?.[0] || c.nom, c.nom);
    if (!fiche) continue;
    fiche.nom = c.nom;
    for (const a of c.alias || []) ajouterAlias(fiche, a);
    Object.assign(fiche, {categorie: c.categorie || fiche.categorie, sousCategorie: c.sousCategorie || fiche.sousCategorie, nature: c.nature || fiche.nature || "Courante",
      lieu: c.lieu || fiche.lieu || "", fixe: !!c.categorie}, c.verifie ? {verifie: true} : {});
    if (c.natureExacte) fiche.natures = Object.assign(fiche.natures || {}, {[c.natureExacte]: (fiche.natures?.[c.natureExacte] || 0) + 1});
    if (c.categorie) ajouterCategorieSilencieuse(c.categorie, c.sousCategorie);
    if (c.lieu) ajouterLieu(c.lieu);
    enregistrer("commercants", fiche);
  }
  for (const l of contenu.lieux || []) ajouterLieu(l);
  for (const n2 of contenu.natures || []) if (!LIVRE.parametres.natures.includes(n2)) modifierParametres({natures: [...LIVRE.parametres.natures, n2]});
  invaliderIndex();
  return n;
}

/* ===== 10-reprise.js ===== */
/* ================= Reprise du classeur « Dépenses 2025-2026 – inventaire » =================
   Lit, sans le modifier, le classeur choisi par l'auteur :
   - « Opérations » : historique classé (sert aussi d'apprentissage aux fiches commerçants) ;
   - « Synthèse » : budget de l'année (colonne « Base … », lignes « Nouvelle » comprises) ;
   - « Analytique … » : répartition par lieu, appliquée aux lignes de chaque catégorie ;
   - « Projection épargne » : hypothèses proposées comme échéances, à confirmer. */

function colonnes(entete){ const m = {}; entete.forEach((v, i) => { if (v != null) m[norm(v).trim()] = i; }); return m; }
const valeurNum = v => typeof v === "number" ? v : lireMontant(v);

function preparerReprise(lu){
  const F = lu.classeur.feuilles;
  const res = {lu, operations: [], budget: null, echeances: [], lieux: [], natures: new Set(), numeroCompte: "", alertes: []};

  /* Paramètres : numéro du compte courant cité dans les sources */
  for (const l of F["Paramètres"] || []) for (const v of l || []){ const m = String(v || "").match(/(\d{5}) (\d{6}[A-Z])/); if (m && !res.numeroCompte) res.numeroCompte = m[2]; }

  /* Opérations */
  const ops = F["Opérations"]; const c = colonnes(ops[0] || []);
  const col = nom => c[norm(nom)];
  const iLieu = Object.entries(c).find(([k]) => /\/ autres$/.test(k))?.[1];
  for (const l of ops.slice(1)){
    if (!l || l[col("date")] == null) continue;
    const d = l[col("date")];
    const date = typeof d === "number" ? dateExcel(d) : lireDate(d);
    if (!date) continue;
    const lieu = propre(l[iLieu] ?? "");
    res.operations.push({date, source: propre(l[col("source")]), libelle: propre(l[col("libelle")]), detail: propre(l[col("detail (releve pdf)")] || ""),
      montant: valeurNum(l[col("montant bancaire")]), categorie: propre(l[col("categorie")] || ""), sousCategorie: propre(l[col("sous-categorie")] || ""),
      nature: propre(l[col("nature")] || ""), pertinent: propre(l[col("pertinent 2027")] || ""), reference: propre(l[col("reference")] || ""),
      ville: propre(l[col("ville du commercant")] || ""), lieu});
    if (lieu && !res.lieux.includes(lieu)) res.lieux.push(lieu);
  }

  /* Synthèse : budget */
  const syn = F["Synthèse"];
  const iTete = syn.findIndex(l => l && norm(l[0]) === "nature" && norm(l[1]) === "categorie");
  if (iTete >= 0){
    const t = syn[iTete].map(x => norm(x));
    const iBase = t.findIndex(x => /^base \d{4} \(hors/.test(x));
    const annee = +(String(syn[iTete][iBase] || "").match(/\d{4}/) || [new Date().getFullYear() + 1])[0];
    const iCompte = t.indexOf("lcl compte"), iCartes = t.findIndex(x => /cartes annualisees/.test(x)), iAmex = t.indexOf("amex");
    const lignes = [];
    for (const l of syn.slice(iTete + 1)){
      if (!l || !l[0] || !l[1]) continue;
      const nature = propre(l[0]);
      if (/^sous-total|^total|^base/i.test(nature)) continue;
      const base = valeurNum(l[iBase]);
      if (!base || isNaN(base)) continue;
      const pc = Math.max(0, valeurNum(l[iCompte]) || 0), pk = Math.max(0, valeurNum(l[iCartes]) || 0), pa = Math.max(0, valeurNum(l[iAmex]) || 0);
      const tot = pc + pk + pa;
      lignes.push({id: "lb-" + idAleatoire(8), nature: nature === "Nouvelle" ? "Courante" : nature, nouvelle: nature === "Nouvelle",
        categorie: propre(l[1]), sousCategorie: propre(l[2] || l[1]), annuel: Math.round(base * 100) / 100,
        paiement: tot ? {compte: pc / tot, cartes: pk / tot, amex: pa / tot} : {compte: 1, cartes: 0, amex: 0}, profil: null, repartition: null});
      if (nature !== "Nouvelle") res.natures.add(nature);
    }
    const ligneTotal = syn.find(l => l && /^Base \d{4} complète/i.test(String(l[0] || "")));
    res.budget = {annee, nom: "Budget " + annee + " (classeur v7)", lignes, totalAttendu: ligneTotal ? valeurNum(ligneTotal[iBase]) : null};
  }

  /* Analytique : répartition par lieu */
  const ana = F[lu.classeur.noms.find(n => /^analytique/i.test(n))];
  if (ana && res.budget){
    const iT = ana.findIndex(l => l && norm(l[0]) === "analytique");
    if (iT >= 0){
      const t = ana[iT].map(x => propre(x || ""));
      const iTotal = t.findIndex(x => norm(x) === "total");
      const lieux = t.slice(3, iTotal).filter(Boolean);
      for (const lx of lieux) if (!res.lieux.includes(lx)) res.lieux.push(lx);
      const parCategorie = {}, parDetail = {};
      for (const l of ana.slice(iT + 1)){
        if (!l || !l[0] || !l[1]) continue;
        const tot = valeurNum(l[iTotal]); if (!tot) continue;
        const rep = {}; lieux.forEach((lx, k) => { rep[lx] = (valeurNum(l[3 + k]) || 0) / tot; });
        if (norm(l[0]) === "reconduite") parCategorie[propre(l[1])] = rep;
        else if (l[2]) parDetail[propre(l[2])] = rep;
      }
      for (const lb of res.budget.lignes) lb.repartition = parDetail[lb.sousCategorie] || parCategorie[lb.categorie] || {[lieux[lieux.length - 1] || "Autres"]: 1};
    }
  }
  if (res.budget){
    res.budget.total = Math.round(somme(res.budget.lignes, l => l.annuel) * 100) / 100;
    if (res.budget.totalAttendu && Math.abs(res.budget.total - res.budget.totalAttendu) > 0.05)
      res.alertes.push("Total repris " + euros(res.budget.total) + " ≠ total du classeur " + euros(res.budget.totalAttendu) + ".");
  }

  /* Projection épargne : hypothèses → échéances proposées */
  const pro = F["Projection épargne"];
  if (pro && res.budget){
    const val = re => { const l = pro.find(x => x && re.test(String(x[0] || ""))); return l ? valeurNum(l[1]) : null; };
    const an = res.budget.annee;
    const pensions = val(/^Pensions brutes annuelles/i), prel = val(/^Prélèvements sociaux sur les pensions/i);
    if (pensions) res.echeances.push({libelle: "Pensions (nettes de prélèvements sociaux, estimation)", montant: Math.round(pensions * (1 - (prel || 0)) / 12), recurrence: "mensuelle", jour: 9, debut: an + "-01-09", categorie: "Revenus", sousCategorie: "Pensions", aConfirmer: true});
    const bmw = val(/solde à la livraison/i);
    if (bmw) res.echeances.push({libelle: "Voiture : solde à la livraison", montant: -bmw, recurrence: "unique", debut: an + "-07-15", categorie: "Voiture", sousCategorie: "Achat", nature: "Exceptionnelle", aConfirmer: true});
    const ligneTravaux = pro.find(x => x && /^Travaux/i.test(String(x[0] || "")));
    if (ligneTravaux && valeurNum(ligneTravaux[1])){
      const nomTravaux = String(ligneTravaux[0]).replace(/\s*\(\d{4}\)\s*$/, "");
      res.echeances.push({libelle: nomTravaux + " (échéancier à préciser)", montant: -valeurNum(ligneTravaux[1]), recurrence: "unique", debut: an + "-06-30", categorie: "Travaux", sousCategorie: nomTravaux, nature: "Exceptionnelle", aConfirmer: true});
    }
    const variable = val(/^Rémunération variable/i);
    if (variable) res.echeances.push({libelle: "Rémunération variable (nette, estimation)", montant: variable, recurrence: "unique", debut: an + "-01-31", categorie: "Revenus", sousCategorie: "Rémunération", aConfirmer: true});
    const loyer = val(/^Loyer actuel/i);
    if (loyer){
      const lb = res.budget.lignes.find(l => /^loyer$/i.test(l.sousCategorie));
      res.echeances.push({libelle: "Loyer (charges comprises)", montant: -Math.round(loyer / 12 * 100) / 100, recurrence: "mensuelle", jour: 1, debut: an + "-01-01", categorie: "Logement", sousCategorie: "Loyer", ligneBudget: lb?.id, aConfirmer: true});
    }
  }
  return res;
}

function appliquerReprise(prep, options){
  const o = Object.assign({operations: true, budget: true, echeances: true}, options);
  for (const l of prep.lieux) ajouterLieu(l);
  if (LIVRE.parametres.lieux.length > 1 && LIVRE.parametres.lieux[0] === "Autres") modifierParametres({lieux: [...LIVRE.parametres.lieux.slice(1), "Autres"]});
  for (const n of prep.natures) if (!LIVRE.parametres.natures.includes(n)) modifierParametres({natures: [...LIVRE.parametres.natures, n]});

  /* Comptes de la reprise */
  let courant = compteCourantLcl(prep.numeroCompte || undefined) || compteCourantLcl();
  if (!courant) courant = enregistrer("comptes", {nom: "Compte joint LCL" + (prep.numeroCompte ? " …" + prep.numeroCompte.slice(-4) : ""), type: "courant", banque: "LCL", numero: prep.numeroCompte, titulaire: "Joint", actif: true});
  if (!LIVRE.parametres.compteTresorerie) modifierParametres({compteTresorerie: courant.id});
  const cartesNv = compteCartesNonVentilees(courant.id);
  let amex = trouverCompte({carte: "AMEX", banque: "Amex"});
  if (!amex && prep.operations.some(x => x.source === "Amex")) amex = enregistrer("comptes", {nom: "Amex", type: "carte", banque: "Amex", carte: "AMEX", compteDebit: courant.id, actif: true});
  const compteDeSource = s => s === "LCL compte" ? courant : s === "LCL carte" ? cartesNv : s === "Amex" ? amex : courant;

  let n = 0;
  if (o.operations){
    const idx = indexEmpreintes();
    const parCompte = regrouper(prep.operations, x => compteDeSource(x.source).id);
    for (const [cid, liste] of parCompte){
      const compte = obtenir("comptes", cid);
      const emp = empreintes(cid, liste);
      liste.forEach((x, i) => {
        if (idx.has(emp[i])) return;
        const op = {compte: cid, date: x.date, dateDebit: compte.type === "carte" ? null : x.date, montant: Math.round(x.montant * 100) / 100,
          libelle: x.libelle, detail: x.detail, ville: x.ville, ref: x.reference, categorie: x.categorie || "À préciser", sousCategorie: x.sousCategorie || "",
          nature: x.nature || "Courante", lieu: x.lieu, pertinent: x.pertinent, empreinte: emp[i], origine: "reprise", statut: "classe", verrou: true, justificatifs: []};
        if (x.categorie) ajouterCategorieSilencieuse(x.categorie, x.sousCategorie);
        const c = assurerCommercant(x.libelle); if (c) op.commercant = c.id;
        enregistrer("operations", op);
        if (op.nature !== "Hors budget" && op.categorie !== "Transfert") apprendre(op);
        n++;
      });
    }
  }
  let budget = null;
  if (o.budget && prep.budget){
    for (const l of prep.budget.lignes) ajouterCategorieSilencieuse(l.categorie, l.sousCategorie);
    budget = enregistrer("budgets", {annee: prep.budget.annee, nom: prep.budget.nom, fige: true, lignes: prep.budget.lignes, source: prep.lu.nom});
    enregistrer("budgets", {annee: prep.budget.annee, nom: "Budget " + prep.budget.annee + " (version de travail)", fige: false, actif: true,
      lignes: JSON.parse(JSON.stringify(prep.budget.lignes)), origine: budget.id});
  }
  if (o.echeances) for (const e of prep.echeances) enregistrer("echeances", Object.assign({compte: courant.id}, e));
  estimerDebitsCartes();
  apparierTransferts();
  return {operations: n, budget};
}

/* ===== 11-rapprochement.js ===== */
/* ================= Justificatifs et rapprochement =================
   Un justificatif (ticket de caisse, facture, facturette CB) est rapproché de
   l'opération bancaire de même montant, dans une fenêtre de dates qui dépend de
   son type. Un cas sans ambiguïté est appliqué d'office, réversible ; les autres
   attendent dans « À traiter ». Facture et facturette d'un même achat se
   rattachent à la même opération sans double compte. Plusieurs tickets réglés en
   un seul paiement forment un « achat groupé » et ventilent l'opération. */

const TYPES_JUSTIF = {ticket: "Ticket de caisse", facture: "Facture", facturette: "Facturette CB", autre: "Autre"};

function fenetre(j){
  const p = LIVRE.parametres;
  return j.type === "facture" ? [p.tolFactureAvant, p.tolFactureApres] : [p.tolTicketAvant, p.tolTicketApres];
}
function compteCompatible(j, compte){
  if (!j.carte) return true;
  if (j.carte === "ESPECES") return compte.type === "especes";
  if (j.carte.startsWith("CPT:") || j.carte.startsWith("CHQ:")) return compte.id === j.carte.slice(4);
  if (j.carte === "AMEX") return compte.carte === "AMEX";
  if (/^X\d+/.test(j.carte)) return compte.carte === j.carte || compte.carte === "LCL-NV";
  return true;
}
function correspondCarte4(j, compte){
  return j.carte4 && compte.carte && /^X\d+/.test(compte.carte) && j.carte4.endsWith(compte.carte.slice(1));
}
function montantJustif(js){ return somme(js, j => versCentimes(j.montant)); }

/* Candidats pour un justificatif ou un groupe de justificatifs (même paiement). */
/* Les 4 derniers chiffres lus sur une facturette désignent la carte, s'ils correspondent à une carte connue. */
function carteDesChiffres(carte4){
  const d = String(carte4 || "").replace(/\D/g, "").slice(-4);
  if (!d) return "";
  const c = vivants("comptes").find(x => x.type === "carte" && (x.chiffres || []).includes(d))
    || vivants("comptes").find(x => x.type === "carte" && /^X\d+/.test(x.carte || "") && d.endsWith(x.carte.slice(1)));
  return c ? c.carte : "";
}
/* Les 4 derniers chiffres d'une facturette validée avec une carte sont retenus pour cette carte. */
function apprendreChiffresCarte(carte4, carte){
  const d = String(carte4 || "").replace(/\D/g, "").slice(-4);
  const c = d.length === 4 && carte ? vivants("comptes").find(x => x.type === "carte" && x.carte === carte) : null;
  if (!c || (c.chiffres || []).includes(d)) return false;
  c.chiffres = [...(c.chiffres || []), d]; enregistrer("comptes", c); return true;
}
function candidats(js){
  const j = Object.assign({}, js[0]); const cents = montantJustif(js);
  if (!j.carte && j.carte4) j.carte = carteDesChiffres(j.carte4);
  const [avant, apres] = fenetre(j);
  const nomJ = js.map(x => [x.commercantNom, x.raisonSociale].filter(Boolean).join(" ")).join(" ");
  const r = [];
  for (const op of vivants("operations")){
    if (op.montant >= 0 || -versCentimes(op.montant) !== cents) continue;
    const dj = ecartJours(j.date, op.date);
    if (dj < -avant || dj > apres) continue;
    const compte = obtenir("comptes", op.compte); if (!compte || !compteCompatible(j, compte)) continue;
    if (j.cheque && !String(op.libelle + " " + (op.detail || "")).replace(/\D/g, " ").split(" ").some(n => n && (n === j.cheque || n.endsWith(j.cheque)))) continue;
    const dejaTypes = (op.justificatifs || []).map(id => obtenir("justificatifs", id)).filter(x => x && !js.includes(x)).map(x => x.type);
    if (js.some(x => dejaTypes.includes(x.type))) continue;
    const cOp = op.commercant ? obtenir("commercants", op.commercant) : null;
    const sim = Math.max(similarite(nomJ, op.libelle), cOp ? similarite(nomJ, cOp.nom + " " + (cOp.alias || []).join(" ")) : 0,
      js.some(x => x.commercant && x.commercant === op.commercant) ? 1 : 0);
    let score = 100 - 6 * Math.abs(dj) - (dj < 0 ? 4 : 0) + Math.round(25 * sim) - 15;
    if (correspondCarte4(j, compte)) score += 15;
    if (dejaTypes.length) score += 5;     // l'autre pièce du même achat est déjà là
    r.push({op, score: Math.max(0, Math.min(100, score)), ecart: dj, sim});
  }
  return r.sort((a, b) => b.score - a.score);
}
/* Combinaisons de 2 ou 3 justificatifs du même jour et de la même carte dont la somme égale une opération. */
function achatsGroupes(libres){
  const r = [];
  const parJour = regrouper(libres.filter(j => j.type !== "facture"), j => j.date + "|" + (j.carte || ""));
  for (const liste of parJour.values()){
    if (liste.length < 2) continue;
    const combos = [];
    for (let a = 0; a < liste.length; a++) for (let b = a + 1; b < liste.length; b++){
      combos.push([liste[a], liste[b]]);
      for (let c = b + 1; c < liste.length; c++) combos.push([liste[a], liste[b], liste[c]]);
    }
    for (const js of combos){ const c = candidats(js); if (c.length) r.push({justifs: js, candidats: c}); }
  }
  return r;
}

function lier(js, op, auto){
  op.justificatifs = [...new Set([...(op.justificatifs || []), ...js.map(j => j.id)])];
  const j0 = js[0];
  if (js.length > 1){
    op.ventilation = js.map(j => ({montant: -Math.abs(j.montant), natureExacte: j.natureExacte || "", categorie: j.categorie || op.categorie,
      sousCategorie: j.sousCategorie || op.sousCategorie, lieu: j.lieu || op.lieu, justificatif: j.id, commercantNom: j.commercantNom || ""}));
    op.natureExacte = js.map(j => j.natureExacte).filter(Boolean).join(" ; ");
  } else if (j0.natureExacte && !op.natureExacte) op.natureExacte = j0.natureExacte;
  if (js.length === 1 && j0.commercant && op.commercant !== j0.commercant){
    // Le libellé bancaire devient un alias du commerçant du ticket, si sa fiche n'avait encore rien appris.
    const d = op.commercant ? obtenir("commercants", op.commercant) : null;
    const c = obtenir("commercants", j0.commercant);
    if (c && d && !d.fixe && !Object.keys(d.stats || {}).length) fusionnerCommercants(c, d);
    if (c) op.commercant = c.id;
  }
  if (j0.categorie && js.every(j => j.categorie === j0.categorie) && j0.categorie !== "À préciser"){
    const corrige = op.categorie !== j0.categorie || (j0.sousCategorie && op.sousCategorie !== j0.sousCategorie);
    Object.assign(op, {categorie: j0.categorie, sousCategorie: j0.sousCategorie || op.sousCategorie, nature: j0.nature || op.nature || natureParDefaut(j0.categorie)});
    if (j0.lieu) op.lieu = j0.lieu;
    validerClassement(op, corrige && !auto);
  } else enregistrer("operations", op);
  for (const j of js) enregistrer("justificatifs", Object.assign(j, {operations: [op.id], statut: "rapproche", auto: !!auto, rapprocheLe: new Date().toISOString(), propositions: null}));
}
function delier(j){
  for (const id of j.operations || []){
    const op = obtenir("operations", id); if (!op) continue;
    op.justificatifs = (op.justificatifs || []).filter(x => x !== j.id);
    if (op.ventilation) op.ventilation = op.ventilation.filter(v => v.justificatif !== j.id);
    if (op.ventilation && op.ventilation.length < 2) delete op.ventilation;
    enregistrer("operations", op);
  }
  enregistrer("justificatifs", Object.assign(j, {operations: [], statut: "a_rapprocher", auto: false, rapprocheLe: null, refuse: true}));
}

/* Passe automatique, après chaque import ou fusion de la boîte. */
function rapprocherTout(){
  // Une saisie du téléphone n'est rapprochée qu'une fois validée sur le PC
  const libres = vivants("justificatifs").filter(j => (j.statut === "a_rapprocher" || !j.statut) && !j.aValider);
  let auto = 0;
  // 1. Groupes déclarés au téléphone (« second ticket au même paiement »)
  const groupes = regrouper(libres.filter(j => j.groupe), j => j.groupe);
  for (const js of groupes.values()){
    if (js.length < 2) continue;
    const c = candidats(js);
    if (c.length === 1 && c[0].score >= 60 && !js.some(j => j.refuse)){ lier(js, c[0].op, true); auto++; }
    else for (const j of js) enregistrer("justificatifs", Object.assign(j, {propositions: c.slice(0, 4).map(x => ({op: x.op.id, score: x.score, groupe: js.map(y => y.id)}))}));
  }
  // 2. Justificatifs seuls
  for (const j of libres.filter(j => !j.groupe || (groupes.get(j.groupe) || []).length < 2)){
    if (j.statut === "rapproche") continue;
    const c = candidats([j]);
    const sur = (c.length === 1 && c[0].score >= 60) || (c.length > 1 && c[0].score >= 85 && c[1].score < c[0].score - 25);
    if (sur && !j.refuse){ lier([j], c[0].op, true); auto++; }
    else enregistrer("justificatifs", Object.assign(j, {propositions: c.slice(0, 4).map(x => ({op: x.op.id, score: x.score}))}));
  }
  // 3. Achats groupés devinés (jamais appliqués d'office)
  const restants = vivants("justificatifs").filter(j => j.statut === "a_rapprocher" && !(j.propositions || []).length);
  for (const g of achatsGroupes(restants)){
    for (const j of g.justifs) enregistrer("justificatifs", Object.assign(j, {propositions: g.candidats.slice(0, 2).map(x => ({op: x.op.id, score: Math.max(0, x.score - 5), groupe: g.justifs.map(y => y.id)}))}));
  }
  return auto;
}

/* En-cours : justificatifs à rapprocher (hors espèces), regroupés par moyen de paiement. */
function libelleMoyen(carte){
  if (!carte) return "Non précisé";
  if (carte === "AMEX") return "Amex";
  if (carte.startsWith("CPT:")) return "Virements · " + libelleCompte(carte.slice(4));
  if (carte.startsWith("CHQ:")) return "Chèques · " + libelleCompte(carte.slice(4));
  const c = vivants("comptes").find(x => x.carte === carte);
  return c ? c.nom : "Carte " + carte;
}
function encoursSaisis(){
  const m = new Map();
  for (const j of vivants("justificatifs").filter(x => x.statut === "a_rapprocher" && x.carte !== "ESPECES")){
    const k = libelleMoyen(j.carte); const g = m.get(k) || m.set(k, {moyen: k, n: 0, montant: 0, depuis: j.date}).get(k);
    g.n++; g.montant += j.montant || 0; if (j.date && j.date < g.depuis) g.depuis = j.date;
  }
  const lignes = [...m.values()].sort((a, b) => b.montant - a.montant);
  return {lignes, n: somme(lignes, x => x.n), montant: somme(lignes, x => x.montant)};
}
/* Justificatif déjà enregistré pour le même achat : même montant, même date, même fournisseur (ou même raison sociale lue). */
function justificatifDejaLa(x){
  const memeFournisseur = j => (x.commercant && j.commercant === x.commercant) || (x.raisonSociale && norm(j.raisonSociale || "") === norm(x.raisonSociale));
  // Le numéro de facture fait foi : même numéro et même fournisseur = même pièce ; numéros différents = pièces distinctes
  if (x.numero) return vivants("justificatifs").find(j => j.numero && j.numero === x.numero && memeFournisseur(j)) || null;
  if (!x.montant || !x.date) return null;
  return vivants("justificatifs").find(j => !j.numero && Math.abs((j.montant || 0) - x.montant) < 0.005 && j.date === x.date && memeFournisseur(j)) || null;
}
/* ---------- Création d'un justificatif (PC ou boîte) ---------- */
async function creerJustificatif(donnees, piece){
  const j = enregistrer("justificatifs", Object.assign({statut: "a_rapprocher", operations: [], cree: new Date().toISOString()}, donnees));
  if (piece) await enregistrerPiece(j.id, piece.octets, piece.mime);
  // Fournisseur : rattaché s'il est déjà enregistré ; sinon le nom reste provisoire, et la fiche n'est créée
  // qu'à la validation sur le PC (« Enregistrer la saisie »). Une saisie du téléphone ne modifie aucune fiche.
  if (j.commercantNom || j.raisonSociale){
    const mobile = j.origine === "mobile";
    const c = (j.raisonSociale && trouverCommercant(j.raisonSociale)) || (j.commercantNom && vivants("commercants").find(x => norm(x.nom) === norm(j.commercantNom)))
      || commercantPourTicket({raisonSociale: j.raisonSociale, enseigne: j.commercantNom, texte: j.texteOCR});
    if (c){
      if (!mobile){
        if (j.raisonSociale) ajouterAlias(c, j.raisonSociale);
        if (j.natureExacte){ c.natures = c.natures || {}; c.natures[j.natureExacte] = (c.natures[j.natureExacte] || 0) + 1; }
        enregistrer("commercants", c); invaliderIndex();
      }
      Object.assign(j, {commercant: c.id, commercantNom: c.nom, fournisseurProvisoire: false});
      if (!j.categorie && c.categorie) Object.assign(j, {categorie: c.categorie, sousCategorie: c.sousCategorie || "", lieu: j.lieu || c.lieu || ""});
    } else j.fournisseurProvisoire = true;
    enregistrer("justificatifs", j);
  }
  if (j.carte === "ESPECES" && !j.aValider) creerOperationEspeces(j);
  return j;
}
function compteEspeces(){
  let c = vivants("comptes").find(x => x.type === "especes");
  if (!c) c = enregistrer("comptes", {nom: "Espèces", type: "especes", banque: "", actif: true});
  return c;
}
function creerOperationEspeces(j){
  const compte = compteEspeces();
  const op = {compte: compte.id, date: j.date, dateDebit: j.date, montant: -Math.abs(j.montant), libelle: j.commercantNom || j.raisonSociale || "Espèces",
    natureExacte: j.natureExacte || "", commercant: j.commercant || null, categorie: j.categorie || "À préciser", sousCategorie: j.sousCategorie || "",
    nature: j.nature || natureParDefaut(j.categorie), lieu: j.lieu || "", origine: "especes", statut: j.categorie ? "classe" : "a_preciser",
    justificatifs: [j.id], empreinte: "especes|" + j.id};
  const o = enregistrer("operations", op);
  enregistrer("justificatifs", Object.assign(j, {operations: [o.id], statut: "rapproche", auto: true, rapprocheLe: new Date().toISOString()}));
  if (op.categorie !== "À préciser") apprendre(o);
}

/* ---------- Fusion de la boîte de saisies du téléphone ---------- */
async function fusionnerBoite(elements){
  let n = 0;
  for (const e of elements){
    if (!e.saisie) continue;
    const s = e.saisie;
    // Déjà reprise (essai précédent interrompu) : on ne fait que ranger le dépôt
    if (vivants("justificatifs").some(j => j.saisie === e.nom)){ await SESSION.adaptateur.deplacer(e.chemin, "boite/traitees"); continue; }
    const groupe = (s.tickets || []).length > 1 ? "g-" + idAleatoire(6) : null;
    for (const t of s.tickets || []){
      const piece = t.photo ? {octets: depuisB64(t.photo.b64), mime: t.photo.mime} : null;
      await creerJustificatif({type: t.type || "ticket", date: t.date || s.date, heure: t.heure || "", montant: Math.abs(lireMontant(t.montant)),
        raisonSociale: t.raisonSociale || "", commercantNom: t.commercant || "", commercantCorrige: !!t.commercantCorrige, natureExacte: t.natureExacte || "",
        categorie: s.categorie || "", sousCategorie: s.sousCategorie || "", lieu: s.lieu || "", carte: s.carte || "", carte4: t.carte4 || "", siret: t.siret || "",
        texteOCR: t.texte || "", origine: "mobile", auteur: s.auteur || "", saisie: e.nom, groupe, aValider: true}, piece);
      n++;
    }
    await SESSION.adaptateur.deplacer(e.chemin, "boite/traitees");
  }
